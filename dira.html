<title>דירה חדשה</title>
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--text:#1d2433;--muted:#6b7385;--border:#e3e7ef;
  --primary:#3b5bdb;--primary-soft:#e7ecff;--side:#2f4ac0;--side-text:#e8edff;
  --inc:#2b8a3e;--inc-soft:#e6f4ea;--exp:#c92a2a;--exp-soft:#fdecec;--warn:#e67700;--warn-soft:#fff4e0;
  --shadow:0 1px 3px rgba(20,30,60,.08);--radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c;--card:#1b2029;--text:#e6e9ef;--muted:#98a1b3;--border:#2c3340;
  --primary:#748ffc;--primary-soft:#232b45;--side:#1a2240;--side-text:#d5ddff;
  --inc:#51cf66;--inc-soft:#1d3324;--exp:#ff6b6b;--exp-soft:#3a2023;--warn:#ffa94d;--warn-soft:#3a2c17;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;font-size:15px;line-height:1.5}
.layout{display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:var(--side-text);padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:22px;font-weight:800;margin:0 8px 18px;color:#fff}
.nav-group{font-size:12px;opacity:.7;margin:16px 10px 6px}
.nav-cats{display:flex;flex-direction:column;gap:2px}
.nav-cat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:right;max-width:100%}
.nav-cat small{font-size:11.5px;opacity:.75;white-space:nowrap;font-weight:600}
aside button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:right}
aside button:hover{background:rgba(255,255,255,.1)}
aside button.active{background:#fff;color:var(--side);font-weight:700}
@media (prefers-color-scheme:dark){aside button.active{background:var(--primary);color:#10142a}}
/* סרגל הסיכום הקבוע: מהון עצמי ונשאר להוצאות, בכל מסך */
.content-shell{flex:1;min-width:0;display:flex;flex-direction:column}
.ownbar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;margin:14px 24px 0;padding:9px 16px;
  background:var(--primary-soft);border:1px solid var(--border);border-radius:12px;font-size:14px}
.ownbar[hidden]{display:none}
.ownbar .ob-item{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ownbar .ob-lbl{color:var(--muted);font-size:12.5px}
.ownbar .ob-val{font-weight:800;font-size:17px}
.ownbar .ob-sub{color:var(--muted);font-size:12px}
.ownbar .ob-val.pos{color:var(--inc)}.ownbar .ob-val.neg{color:var(--exp)}
@media print{.ownbar{display:none!important}}
@media (max-width:820px){.ownbar{margin:12px 16px 0}}
main{flex:1;min-width:0;padding:20px 24px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.topbar h1{margin:0;font-size:24px}
.dates{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-size:24px;font-weight:800;margin:4px 0}
.stat .cmp{font-size:12px;color:var(--muted)}
.pos{color:var(--inc)}.neg{color:var(--exp)}
.month-nav{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;padding:7px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#10142a}}
.btn.danger{color:var(--exp)}
.btn.sm{padding:3px 10px;font-size:13px}
.grid-form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.grid-form .wide{grid-column:1/-1}
/* פרטי התחייבות בטופס, ומעקב ההחזרים ברשימה */
.liab-only{grid-column:1/-1;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.liab-only[hidden]{display:none}
.loan-list{display:grid;gap:12px}
.loan-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--card,#fff)}
.loan-card.done{opacity:.72}
.loan-card.late{border-color:#e0a24a;background:#fff8ec}
.loan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.loan-due{display:block;font-size:12.5px;color:#a3600d;margin-top:4px}
.loan-due.ok{color:var(--inc)}
.loan-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));margin-bottom:8px}
.loan-grid small{display:block;font-size:11.5px;color:var(--muted)}
.loan-grid b{font-size:15px}
.loan-notes{margin:0 0 8px;font-size:13px}
.loan-pay{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.pay-chip{border:1.5px solid var(--border);background:none;border-radius:14px;padding:2px 10px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.pay-chip.on{background:var(--inc);border-color:var(--inc);color:#fff}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:13.5px;color:var(--text);cursor:pointer;padding:2px 0}
label.chk[hidden]{display:none}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);padding:8px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--border);padding:8px 6px;vertical-align:middle}
td .heb{display:block;font-size:12px;color:var(--muted)}
.amount{font-weight:700;white-space:nowrap}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:20px;padding:1px 10px;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:20px 0;margin:0}
.bar{height:9px;background:var(--border);border-radius:9px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:9px}
.bar.over>span{background:var(--exp)}.bar.near>span{background:var(--warn)}.bar.done>span{background:var(--inc)}
.budget-item{margin-bottom:12px}
.budget-item .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border)}
.chart text{fill:var(--muted);font-size:12px}
.legend{list-style:none;padding:0;margin:0;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px;padding:4px 0}
.legend .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.legend .v{margin-inline-start:auto;font-weight:600}
.donut-wrap{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media (max-width:560px){.donut-wrap{grid-template-columns:1fr}.donut-wrap svg{max-width:200px;margin:auto}}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;font:inherit;color:var(--text);padding:5px 14px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
/* לשוניות קטגוריות מהירות במסך העסקאות */
.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.cat-tab{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:var(--card,#fff);border-radius:20px;padding:6px 14px;font:inherit;font-size:13.5px;color:var(--text);cursor:pointer;max-width:100%}
.cat-tab small{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.cat-tab:hover{border-color:var(--primary)}
.cat-tab.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.cat-tab.on small{color:#e8f2f0}
.goal{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.goal h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.goal .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:8px 0}
.goal .meta b{color:var(--text)}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inline input{width:130px}
.maaser{background:var(--warn-soft)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats .tag button{background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:0 0 0 2px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:10px}
#toast .btn{background:#fff;color:#312e81;border-color:#fff;font-weight:700}
@media (max-width:820px){
  .layout{flex-direction:column}
  aside{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:10px 16px;gap:4px}
  .logo,.nav-group{display:none}
  aside button{width:auto;white-space:nowrap}
  main{padding:16px}
}

/* ===== New design ===== */
:root{
  --bg:#f4f6fc;--card:#ffffff;--text:#1a1f36;--muted:#6b7190;--border:#e6e9f4;
  --primary:#4f46e5;--primary-2:#7c3aed;--primary-soft:#eef0ff;--accent:#06b6d4;
  --inc:#0f9d58;--inc-soft:#e3f6ec;--exp:#e03131;--exp-soft:#fdeaea;--warn:#f08c00;--warn-soft:#fff5e1;
  --radius:20px;--shadow:0 1px 2px rgba(20,24,60,.04),0 8px 24px rgba(20,24,60,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1020;--card:#161a2e;--text:#e8eaf6;--muted:#9aa0c0;--border:#262b47;
  --primary:#8b8cf8;--primary-2:#a78bfa;--primary-soft:#232750;--accent:#22d3ee;
  --inc:#4ade80;--inc-soft:#163325;--exp:#f87171;--exp-soft:#3b1d22;--warn:#fbbf24;--warn-soft:#3a2d12;--shadow:0 8px 24px rgba(0,0,0,.25)}
}
body{font-family:"Segoe UI Variable","Segoe UI",Rubik,Arial,sans-serif;-webkit-font-smoothing:antialiased}
aside{background:linear-gradient(170deg,#1e1b4b 0%,#3730a3 55%,#5b21b6 100%);padding:24px 14px;box-shadow:-4px 0 24px rgba(30,27,75,.18)}
@media (prefers-color-scheme:dark){aside{background:linear-gradient(170deg,#0b0d1c 0%,#1e1b4b 100%);border-left:1px solid var(--border)}}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;margin-bottom:24px}
.logo-ico{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#818cf8,#22d3ee);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 16px rgba(34,211,238,.35)}
.nav-group{text-transform:none;letter-spacing:.3px;font-weight:600}
aside button{padding:11px 14px;border-radius:13px;margin-bottom:2px;transition:background .15s,transform .15s;font-weight:500}
aside button:hover{background:rgba(255,255,255,.12);transform:translateX(-2px)}
aside button.active,aside button.active:hover{background:#fff;color:#3730a3;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:none}
@media (prefers-color-scheme:dark){aside button.active,aside button.active:hover{background:var(--primary);color:#0d1020}}
main{padding:30px 34px 70px;max-width:1320px}
.topbar h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.dates{margin-top:2px}
.month-nav{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px 8px;box-shadow:var(--shadow)}
.month-nav strong{min-width:120px;text-align:center}
.month-nav .btn{border:0;background:var(--primary-soft);color:var(--primary);font-weight:800}
.card{border-radius:var(--radius);padding:24px;transition:box-shadow .2s}
.card:hover{box-shadow:0 1px 2px rgba(20,24,60,.04),0 12px 32px rgba(20,24,60,.09)}
.card h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.card h2::before{content:"";width:5px;height:20px;border-radius:5px;background:linear-gradient(var(--primary),var(--accent));flex-shrink:0}
.card .sub{margin-top:4px}
.stats{gap:16px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;padding:20px 20px 18px 72px;border-radius:var(--radius);transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.stat::before{position:absolute;top:18px;left:18px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--primary-soft)}
.stat::after{content:"";position:absolute;bottom:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.s-flow::before{content:"⚖️"}
.s-inc::before{content:"💰";background:var(--inc-soft)}.s-inc::after{background:var(--inc)}
.s-exp::before{content:"🧾";background:var(--exp-soft)}.s-exp::after{background:var(--exp)}
.s-nw::before{content:"🏦"}
.s-hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);border:0;color:#fff}
.s-hero .lbl,.s-hero .cmp,.s-hero .cmp span{color:rgba(255,255,255,.85)!important}
.s-hero .val{color:#fff!important}
.s-hero::before{background:rgba(255,255,255,.18)}.s-hero::after{display:none}
.stat .lbl{font-weight:600}
.stat .val{font-size:28px;letter-spacing:-.5px;margin:6px 0 2px}
.btn{border-radius:12px;padding:8px 16px;font-weight:600;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border:0;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.btn.danger{border-color:transparent;background:var(--exp-soft)}
.btn.sm{padding:4px 12px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
input,select{border-radius:12px;padding:9px 12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
label{font-weight:600}
table{border-collapse:separate;border-spacing:0}
th{background:var(--bg);font-size:12.5px;border-bottom:0;padding:10px 10px}
th:first-child{border-radius:0 12px 12px 0}th:last-child{border-radius:12px 0 0 12px}
td{padding:11px 10px}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--primary-soft)}
.tag{padding:3px 12px;font-weight:600;font-size:12.5px}
.bar{height:10px;background:var(--bg);border:1px solid var(--border)}
.bar>span{background:linear-gradient(270deg,var(--primary),var(--accent))}
.bar.over>span{background:linear-gradient(270deg,#e03131,#ff8787)}
.bar.near>span{background:linear-gradient(270deg,#f08c00,#ffc078)}
.bar.done>span{background:linear-gradient(270deg,#0f9d58,#69db7c)}
.budget-item{padding:10px 0;border-bottom:1px dashed var(--border);margin:0}
.budget-item:last-of-type{border-bottom:0}
.maaser{background:linear-gradient(135deg,var(--warn-soft),var(--card) 70%)}
.maaser-total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.maaser-total .lbl{font-size:13px;color:var(--muted);font-weight:600}
.maaser-total .val{font-size:26px;font-weight:800;margin:2px 0}
.maaser-break{font-size:13px;color:var(--muted);line-height:1.7}
.maaser h2::before{background:linear-gradient(var(--warn),#ffd43b)}
.seg{background:var(--bg);border:0;padding:4px;border-radius:13px}
.seg button{border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(20,24,60,.1)}
.legend li{padding:6px 0;border-bottom:1px solid var(--border)}
.legend li:last-child{border-bottom:0}
.empty{padding:28px 0}
.cats .tag{padding:5px 12px}
#toast{border-radius:14px;background:linear-gradient(135deg,#312e81,#5b21b6);box-shadow:0 10px 30px rgba(49,46,129,.35);font-weight:600}
.months-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.months-head span{margin-inline-end:6px}
.months{display:flex;flex-wrap:wrap;gap:6px}
.mchip{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--text);font-weight:500;background:var(--card);user-select:none}
.mchip input{width:auto;margin:0;accent-color:var(--primary)}
.mchip:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
.mode-sel{width:auto;padding:4px 8px}
[hidden]{display:none!important}
/* דוחות */
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#1e1b4b,#4f46e5 60%,#7c3aed);color:#fff;border-radius:var(--radius);padding:24px 26px;margin-bottom:18px}
.rep-head h1{margin:6px 0 4px;font-size:28px}
.rep-head .dates{color:rgba(255,255,255,.85)}
.rep-brand{display:flex;align-items:center;gap:8px;font-weight:700;opacity:.9}
.rep-brand .logo-ico{width:30px;height:30px;border-radius:10px;font-size:15px}
.rep-date{text-align:left;font-size:13px;opacity:.85}
.tips-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--bg);border-inline-start:4px solid var(--primary);line-height:1.6}

/* צ'אט */
.chat-fab{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:linear-gradient(135deg,#312e81,#5b21b6);color:#fff;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(49,46,129,.35)}

.chat-fab[hidden]{display:none}
.chat-panel{position:fixed;left:18px;bottom:18px;z-index:25;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 36px));display:none;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 40px rgba(20,24,60,.3);overflow:hidden}

.chat-h button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:13px}
.chat-panel .chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chat-panel .chat-form{padding:10px;border-top:1px solid var(--border);background:var(--card)}
.chat-note{font-size:12px;color:var(--muted);padding:0 12px 8px;background:var(--card)}
@media (max-width:760px){.chat-fab{bottom:88px}.chat-panel{left:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 16px)}}
.chat-msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.7;font-size:14px;position:relative}
.chat-msg.user{align-self:flex-start;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.bot{align-self:flex-end;background:var(--bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-msg .sub{font-size:12px}
.chat-tag{position:absolute;bottom:-8px;left:-6px;font-size:12px}
.chat-ul{margin:6px 0 0;padding-inline-start:18px}
.chat-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chat-form{display:flex;gap:8px}.chat-form input{flex:1}
.chat-dots{color:var(--muted)}
/* מרכז דוחות */
.rep-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.rep-item{display:flex;flex-direction:column;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card)}
.rep-item.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.rep-pick{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.rep-pick b{font-size:15px}.rep-pick span{font-size:13px;color:var(--muted);line-height:1.5}
.doc-chart{margin:4px 0 14px}
.dc-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:4px 0}
.dc-lbl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-bars{display:grid;gap:2px}
.dc-bar{height:8px;border-radius:4px;min-width:2px}
.dc-bar.inc,.dc-legend i.inc{background:var(--inc)}.dc-bar.exp,.dc-legend i.exp{background:var(--exp)}
.dc-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
.dc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.doc .rep-table tfoot td{font-weight:700;border-top:2px solid var(--border)}
/* גלריית אסמכתאות ותמונות בדוח */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.att{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card,#fff);break-inside:avoid}
.att img{display:block;width:100%;height:130px;object-fit:cover;background:#f3f4f8}
.att figcaption{font-size:11.5px;color:var(--muted);padding:6px 8px;word-break:break-word}
.att-file{display:flex;flex-direction:column;gap:4px;padding:12px;border:1px solid var(--border);border-radius:10px;background:#f7f8fc;text-decoration:none;color:inherit;break-inside:avoid}
.att-file .att-ico{font-size:22px}
.att-file .att-nm{font-size:12.5px;font-weight:600;word-break:break-word}
.att-file .att-sub{font-size:11px;color:var(--muted)}
.rep-att h2 small{font-weight:400}
@media print{.att img{height:auto;max-height:170px}.att-grid{grid-template-columns:repeat(3,1fr)}}
@media print{
  body.print-doc #view>:not(#docPreview){display:none!important}
  .doc-chart,.dc-bar,.doc .stat{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .rep-table{font-size:11px}
  .doc .rep-table thead{display:table-header-group}
  .doc .rep-table tr{break-inside:avoid}
  .doc .card{break-inside:auto}

.dup-alert{background:var(--warn-soft);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.dup-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.dup-head b{color:var(--warn)}
.dup-pair{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:8px 12px;margin-top:8px;flex-wrap:wrap}
.dup-amt{font-weight:800;min-width:90px}
.dup-tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.imp-dup{color:var(--warn);font-weight:700;font-size:12px;display:block}
/* תחזית */
.forecast.bad{border-color:var(--exp)}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fc-grid>div{background:var(--bg);border-radius:12px;padding:12px 14px}
.fc-grid b{font-size:22px;display:block;margin:2px 0}
.fc-grid .lbl{font-size:13px;color:var(--muted);font-weight:600}
.fc-end{background:var(--primary-soft)!important}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover,th.sorted{color:var(--primary)}
.fc-det{margin-top:8px}
.fc-det summary{cursor:pointer;color:var(--primary);font-size:13px;font-weight:600}
.fc-det h4{margin:10px 0 4px;font-size:13px;color:var(--muted)}
.fc-li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--border)}
.fc-li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-li b{font-size:13px;display:inline;margin:0;white-space:nowrap}
/* קופות */
.funds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.fund-bal{font-size:28px;font-weight:800;margin:4px 0 8px}
.fund details summary{cursor:pointer}
.split-card{border:2px solid var(--primary)}
.split-row{margin-bottom:6px}
/* מסך נעילה */
.auth{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#1e1b4b 0%,#3730a3 55%,#5b21b6 100%)}
.auth-card{background:var(--card);color:var(--text);border-radius:24px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-logo{color:var(--text);justify-content:center;margin-bottom:18px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-card h2{margin:0;font-size:20px;text-align:center}
.auth-card .btn{width:100%;padding:11px}
.auth-msg{font-size:13px;border-radius:10px;padding:8px 10px;text-align:center}
.auth-msg.err{background:var(--exp-soft);color:var(--exp)}
.linkbtn{background:none;border:0;color:var(--primary);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
/* כפתור הוספה מהירה (בטלפון) */
.fab{display:none}
@media (max-width:820px){
  input,select{font-size:16px}
  aside{position:sticky;top:0;z-index:8}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:14px 12px 14px 60px}
  .stat::before{width:36px;height:36px;font-size:17px;top:14px;left:12px}
  .stat .val{font-size:21px}
  .card{padding:16px;border-radius:16px}
  .fab{display:grid;place-items:center;position:fixed;bottom:20px;left:20px;z-index:9;width:58px;height:58px;border-radius:50%;border:0;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 24px rgba(79,70,229,.45);cursor:pointer}
  /* עסקאות ככרטיסים */
  .tx-table thead{display:none}
  .tx-table,.tx-table tbody{display:block}
  .tx-table tr{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"sel cat amt" "sel note date" "act act act";gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--border)}
  .tx-table td{border:0;padding:0}
  .tx-table .c-sel{grid-area:sel;align-self:center}
  .tx-table .c-cat{grid-area:cat}.tx-table .c-amt{grid-area:amt;text-align:left;font-size:16px}

  .tx-table tr:not(:has(.c-sel)){grid-template-areas:"cat amt" "note date" "act act";grid-template-columns:1fr auto}
}

.h-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

<script>
/* ---------- Link version: instead of the server on the computer, data is stored in this browser only (IndexedDB) ----------
   Every request the app used to send to the server (127.0.0.1) is answered here, in the browser. Nothing goes out to the internet. */
(function () {
  const PORT = '8773', DB = 'dira-chadasha-web', BASE = 'http://127.0.0.1:' + PORT + '/api/';
  const NO_MAIL = 'משיכת מיילים וחיבור הג׳ימייל זמינים רק בגרסה שמותקנת במחשב. בגרסת הקישור אפשר לצרף קבצים ותמונות ידנית.';

    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

    docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', xls: 'application/vnd.ms-excel' };

<script>
/* ---------- נתונים ושמירה ---------- */

  'שכר לימוד', 'מעשרות וצדקה', 'שבת וחגים', 'ביגוד והנעלה', 'תחבורה', 'בריאות', 'חוגים ושיעורים', 'ביטוחים', 'הלוואות', 'שמחות ומתנות', 'תקשורת'];
function cleanCategories() {
  ['income', 'expense'].forEach(type => {
    const used = new Set([...S.transactions, ...S.recurring].filter(t => t.type === type).map(t => t.category).filter(Boolean));
    if (!S.settings.catsCleaned) S.categories[type] = S.categories[type].filter(c => !OLD_BUILTIN.includes(c) || used.has(c));

  });

}
// הוספת קטגוריה לרשימה אם היא חדשה
function ensureCat(type, c) { if (c && !S.categories[type].includes(c)) S.categories[type].push(c); }

{ const nativeFetch = window.fetch.bind(window);
  window.fetch = (u, o = {}) => String(u).startsWith('http://127.0.0.1:8773/') ? nativeFetch(u, { ...o, headers: { ...(o.headers || {}), 'X-Device': DEVICE } }) : nativeFetch(u, o); }

/* החזרי הלוואות ומשכנתא: מסומנים בקטגוריית ההלוואות או בעסקה שסומנה כ"החזר חוב".

/* ---------- הוצאות והכנסות קבועות: רישום אוטומטי בכל חודש ---------- */
function applyRecurring() {
  const now = new Date(), cur = monthKey(now); let added = 0;
  S.recurring.forEach(r => {
    if (!r.active) return;
    let m = r.lastApplied ? shiftMonth(r.lastApplied, 1) : r.startMonth;
    while (m <= cur) {
      if (r.endMonth && m > r.endMonth) break; // הקבועה הסתיימה
      const [y, mm] = m.split('-').map(Number);
      const day = Math.min(r.day, new Date(y, mm, 0).getDate()), date = `${m}-${pad(day)}`;
      if (m === cur && now.getDate() < day) break;
      // נרשמת רק בחודשים שנבחרו, ולא נרשמת פעמיים אם כבר קיימת עסקה זהה
      const inMonths = !r.months || r.months.includes(mm);
      const exists = S.transactions.some(t => t.date === date && t.amount === r.amount && t.type === r.type && t.note === r.note);
      if (inMonths && !exists) {
        S.transactions.push({ id: uid(), type: r.type, amount: r.amount, date, category: r.category, note: r.note, recurringId: r.id });
        added++;

/* ---------- התחייבויות: הפחתת ההחזר החודשי מהיתרה ---------- */
// לא נרשמת הוצאה. רק יתרת ההתחייבות יורדת, פעם אחת לכל חודש חדש.
// חודש שסומן ידנית כ"שולם" (a.payments) לא מופחת שוב, כדי לא לספור את ההחזר פעמיים
function applyLiabilityPayments() {
  const cur = monthKey(new Date()); let changed = false;
  S.assets.forEach(a => {
    if (a.kind !== 'liability' || !(a.payment > 0)) return;
    if (!a.paidThrough) { a.paidThrough = cur; changed = true; return; }
    while (a.paidThrough < cur) {
      a.paidThrough = shiftMonth(a.paidThrough, 1); // החודש הזה נחשב "מטופל" בכל מקרה
      const paidMark = a.payments && a.payments[a.paidThrough];
      if (paidMark) { changed = true; continue; } // כבר נרשם ידנית דרך סימון "שולם"
      const amt = Math.min(a.payment, a.value);
      if (amt <= 0) continue;
      a.value = Math.max(0, Math.round((a.value - amt) * 100) / 100);
      a.paidTotal = Math.round(((a.paidTotal || 0) + amt) * 100) / 100;

const dayDiff = (a, b) => Math.abs((new Date(a) - new Date(b)) / 86400000);

  return x === y || (Math.min(x.length, y.length) >= 3 && (x.includes(y) || y.includes(x)));

// שתי עסקאות שחשודות ככפולות: אותו סוג, אותו סכום, הפרש של עד 3 ימים ותיאור דומה.
// שתי עסקאות שנוצרו משתי קבועות שונות אינן כפילות: אלה שני חיובים נפרדים
function isDupPair(t, u) {
  if (t.type !== u.type || Math.abs(t.amount - u.amount) >= 0.01 || dayDiff(t.date, u.date) > 3) return false;
  if (t.splitFrom && t.splitFrom === u.splitFrom) return false;

function duplicatePairs(list) {
  const ok = new Set(S.settings.notDup || []), pairs = [], seen = new Set();
  const sorted = [...list].sort((a, b) => a.date.localeCompare(b.date));
  sorted.forEach((t, i) => {
    for (let j = i + 1; j < sorted.length && dayDiff(sorted[j].date, t.date) <= 3; j++) {
      const u = sorted[j], key = [t.id, u.id].sort().join('|');

    <ul class="legend" style="display:flex;gap:18px"><li><span class="dot" style="background:var(--inc)"></span>הכנסות</li><li><span class="dot" style="background:var(--exp)"></span>הוצאות</li></ul></section>
  <section class="card"><h2>סיכום לפי חודשים · שנת ${Y}</h2><p class="sub">לחיצה על חודש מציגה את הנתונים שלו בתצוגה חודשית</p>${yearSummary(Y)}</section>

      <div class="budget-item"><div class="top"><span>${word}: ניתן ${money(mPaid)} מתוך ${money(mDue)}</span><b class="${mBal >= 0 ? 'pos' : 'neg'}">${signed(mBal)} ${mBal >= 0 ? 'עודף' : 'חסר'}</b></div>
      <div class="bar ${mLeft <= 0 ? 'done' : ''}"><span style="width:${mDue ? Math.min(100, mPaid / mDue * 100) : 0}%"></span></div></div>
      <div class="maaser-total"><div><div class="lbl">יתרה מצטברת מכל התקופה</div>

        <div class="maaser-break">${ma.deduct || ma.base !== ma.inc ? 'בסיס החישוב' : 'סה״כ הכנסות'} ${money(allInc)}<br>נדרש ${money(allDue)} · ניתן ${money(allGiven)}${opening ? `<br>יתרת פתיחה ${signed(opening)}` : ''}</div></div></section>

      <div class="actions"><button class="btn sm" data-tab="tx">לכל העסקאות</button></div></section>
  </div>`;
};

function donut(m, type) {
  const map = {};
  S.transactions.filter(t => t.type === type && t.date.startsWith(m) && !(type === 'expense' && isDebtRepay(t))).forEach(t => map[t.category] = (map[t.category] || 0) + t.amount);
  return donutFromMap(map, `אין ${type === 'expense' ? 'הוצאות' : 'הכנסות'} להצגה ${m.length === 4 ? 'בשנה זו' : 'בחודש זה'}`);
}
function donutFromMap(map, emptyMsg) {
  const arr = Object.entries(map).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]), tot = arr.reduce((a, x) => a + x[1], 0);
  if (!tot) return `<p class="empty">${emptyMsg}</p>`;
  const r = 70, C = 2 * Math.PI * r; let off = 0, circles = '';
  arr.forEach(([c, v], i) => {
    const len = v / tot * C;
    circles += `<circle r="${r}" cx="100" cy="100" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="30" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"><title>${esc(c)}: ${money(v)}</title></circle>`;
    off += len;
  });
  return `<div class="donut-wrap"><svg viewBox="0 0 200 200" class="chart" role="img" aria-label="פילוח לפי קטגוריה">
    <g transform="rotate(-90 100 100)">${circles}</g>
    <text x="100" y="96" text-anchor="middle" style="font-size:12px">סה״כ</text>
    <text x="100" y="116" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--text)">${money(tot)}</text></svg>
    <ul class="legend">${arr.map(([c, v], i) => `<li><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>${esc(c)}<span class="v">${money(v)} · ${(v / tot * 100).toFixed(0)}%</span></li>`).join('')}</ul></div>`;
}

function barChart(end) {
  const ms = []; for (let i = 11; i >= 0; i--) ms.push(shiftMonth(end, -i));
  const data = ms.map(k => ({ k, i: sumMonth(k, 'income'), e: sumMonth(k, 'expense') }));
  const max = Math.max(1, ...data.map(d => Math.max(d.i, d.e)));
  const W = 720, H = 240, pt = 10, pb = 26, ch = H - pt - pb, cw = W / 12, bw = Math.min(20, cw / 3);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="הכנסות מול הוצאות לפי חודש">`;
  for (let g = 0; g <= 4; g++) { const y = pt + ch * g / 4; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="grid"/>`; }
  data.forEach((d, idx) => {
    const cx = W - idx * cw - cw / 2; // הסדר מימין לשמאל
    const hi = d.i / max * ch, he = d.e / max * ch;
    s += `<rect x="${cx + 1}" y="${pt + ch - hi}" width="${bw}" height="${hi}" rx="3" fill="var(--inc)"><title>${monthName(d.k)} · הכנסות ${money(d.i)}</title></rect>`;
    s += `<rect x="${cx - bw - 1}" y="${pt + ch - he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)"><title>${monthName(d.k)} · הוצאות ${money(d.e)}</title></rect>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${monthName(d.k, 'short')}</text>`;
  });
  return s + '</svg>';
}

function budgetBars(m, limit, factor = 1) {
  const items = Object.entries(S.budgets).filter(([c, v]) => v > 0 && c !== S.settings.loanCategory);
  if (!items.length) return `<p class="empty">אין תקציב מוגדר</p><div class="actions"><button class="btn sm" data-tab="budget">הגדרת תקציב חודשי</button></div>`;
  const rows = items.map(([c, b]) => ({ c, b: b * factor, s: sumMonth(m, 'expense', c) })).sort((a, b) => b.s / b.b - a.s / a.b);
  return rows.slice(0, limit || rows.length).map(({ c, b, s }) => {
    const p = s / b * 100, cls = p > 100 ? 'over' : p >= 85 ? 'near' : '';
    return `<div class="budget-item"><div class="top"><span>${esc(c)}</span><span>${money(s)} / ${money(b)} ${p > 100 ? '<b class="neg">חריגה</b>' : ''}</span></div>
      <div class="bar ${cls}"><span style="width:${Math.min(100, p)}%"></span></div></div>`;
  }).join('') + (limit && rows.length > limit ? `<div class="actions"><button class="btn sm" data-tab="budget">לכל התקציבים</button></div>` : '');
}

/* ---------- עסקאות ---------- */
function txTable(list, withActions = true) {

  </tbody></table></div>`;

function filteredTx() {
  const f = ui.filters, q = f.q.trim();
  const key = f.period === 'month' ? f.month : f.period === 'year' ? f.year : '';
  const inPeriod = t => f.period === 'hmonth' ? hebKey(t.date) === f.hmonth : f.period === 'hyear' ? hebParts(t.date).y === f.hyear : (!key || t.date.startsWith(key));
  // חיפוש חופשי: בהערה, בקטגוריה או בסכום (למשל 2050)
  const ql = q.toLowerCase(), qNum = q.replace(/[,₪\s]/g, '');
  const matchQ = t => !q || (t.note || '').toLowerCase().includes(ql) || (t.category || '').toLowerCase().includes(ql) ||
    (/^\d+(\.\d+)?$/.test(qNum) && String(t.amount).startsWith(qNum));
  const min = parseFloat(f.min), max = parseFloat(f.max);
  const inRange = t => (isNaN(min) || t.amount >= min) && (isNaN(max) || t.amount <= max);
  // בלשונית "עסקאות" מוצגות כל התנועות, כולל החזרי הלוואה. הסינון היחיד הוא "🏦 החזרי חוב" שמציג אותם לבד
  const view = f.cat === '__debt__' ? 'debt' : (ui.txView && ui.txView !== 'exp' ? ui.txView : 'all');
  return S.transactions.filter(t => inPeriod(t) && (f.type === 'all' || t.type === f.type) &&
    (f.cat === '__debt__' ? isDebtRepay(t) : (f.cat === 'all' || t.category === f.cat)) &&
    (view !== 'exp' || t.type !== 'expense' || !isDebtRepay(t)) && (view !== 'debt' || isDebtRepay(t)) && matchQ(t) && inRange(t))
    .sort(TX_SORTS[f.sort] || TX_SORTS['date-desc']);
}
const TX_SORTS = {
  'date-desc': (a, b) => b.date.localeCompare(a.date),
  'date-asc': (a, b) => a.date.localeCompare(b.date),
  'amt-desc': (a, b) => b.amount - a.amount || b.date.localeCompare(a.date),
  'amt-asc': (a, b) => a.amount - b.amount || b.date.localeCompare(a.date),
  'cat': (a, b) => (a.category || '').localeCompare(b.category || '', 'he') || b.date.localeCompare(a.date),
  'note': (a, b) => (a.note || '').localeCompare(b.note || '', 'he') || b.date.localeCompare(a.date)
};
// לחיצה על כותרת עמודה ממיינת לפיה. לחיצה נוספת הופכת את הכיוון
const SORT_COLS = { 'תאריך': ['date-desc', 'date-asc'], 'סכום': ['amt-desc', 'amt-asc'], 'קטגוריה': ['cat'], 'הערה': ['note'] };
const sortTh = name => {

  return `<th class="sortable${on ? ' sorted' : ''}" data-action="sortTx" data-col="${name}" title="מיון לפי ${name}">${name}${arrow}</th>`;
};
VIEWS.tx = () => {

      <input type="checkbox" name="debtRepay" style="width:auto"${ed && ed.debtRepay ? ' checked' : ''}> זהו החזר הלוואה / משכנתא (לא נספר כהוצאה)</label>

  </form></section>
  <section class="card"><div class="grid-form" style="margin-bottom:14px">

const BULK_FIELDS = { category: 'קטגוריה', type: 'סוג', date: 'תאריך', amount: 'סכום', note: 'הערה' };
function bulkControl(field) {
  const allCats = [...new Set([...S.categories.expense, ...S.categories.income])];

function nwChart() {
  const cur = monthKey(new Date()), ms = [];
  for (let i = 5; i >= 0; i--) ms.push(shiftMonth(cur, -i));
  // חודש בלי תמונת מצב מקבל את הערך האחרון שידוע לפניו
  const keys = Object.keys(S.nwHistory).sort(); let last = null;
  const vals = ms.map(m => { keys.forEach(k => { if (k <= m) last = S.nwHistory[k]; }); return last; });
  if (vals.every(v => v === null)) return '<p class="empty">אין עדיין נתונים</p>';
  const nums = vals.map(v => v ?? 0), min = Math.min(0, ...nums), max = Math.max(1, ...nums);
  const W = 600, H = 200, pt = 14, pb = 26, ch = H - pt - pb, step = W / 6;
  const pts = nums.map((v, i) => [W - i * step - step / 2, pt + ch - (v - min) / (max - min || 1) * ch]);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="מגמת שווי נקי">`;
  for (let g = 0; g <= 4; g++) { const y = pt + ch * g / 4; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="grid"/>`; }
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--primary)"><title>${monthName(ms[i])}: ${money(nums[i])}</title></circle>
    <text x="${p[0]}" y="${H - 6}" text-anchor="middle">${monthName(ms[i], 'short')}</text>`; });
  return s + '</svg>';
}

/* סימון "שולם" להחזר של חודש מסוים: מוריד את היתרה בסכום ההחזר, ולחיצה שנייה מבטלת.

    const amt = Math.min(+a.payment || 0, a.value + (+a.payment || 0));

/* קריאת קובץ אקסל (.xlsx) בלי ספריות חיצוניות: קובץ xlsx הוא ZIP של קובצי XML */

        else if (v) { val = v.textContent; if (t !== 'str' && t !== 'b' && dateStyles.has(+c.getAttribute('s')) && !isNaN(+val)) val = serialToISO(+val); }

function colIndex(ref) { const m = ref.match(/^[A-Z]+/); if (!m) return -1; let n = 0; for (const ch of m[0]) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; }

async function saveFile(name, blob, kind) {
  if (window.showSaveFilePicker) {
    try {
      const types = { xlsx: [{ description: 'קובץ אקסל', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] }[kind];
      const h = await window.showSaveFilePicker({ suggestedName: name.replace(/[\\/:*?"<>|]/g, '-'), types });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return toast(`הקובץ נשמר: ${h.name}`);
    } catch (e) {
      if (e.name === 'AbortError') return toast('השמירה בוטלה');
      // כל שגיאה אחרת: ממשיכים להורדה רגילה
    }
  }
  downloadBlob(name, blob); toast('הקובץ ירד לתיקיית ההורדות. אם לא רואים אותו, בדקו את סמל ההורדות בכרום');
}

async function exportXlsxFile(name, txList, label) {

    S.recurring = S.recurring.filter(r => !dropIds.has(r.id));
    if (delTx) S.transactions = S.transactions.filter(t => !dropIds.has(t.recurringId));
    save(); render();
    undoToast(delTx ? `נמחקו ${drop.length} קבועות ו־${txs.length} עסקאות` : `נמחקו ${drop.length} קבועות`, () => {
      // מחזירים רק את מה שנמחק, בלי לגעת בשינויים אחרים
      drop.forEach(r => { if (!S.recurring.some(x => x.id === r.id)) S.recurring.push(r); });
      if (delTx) txs.forEach(t => { if (!S.transactions.some(x => x.id === t.id)) S.transactions.push(t); });
      save(); render(); toast('המחיקה בוטלה');
    });
  },
  recNotDup: el => { S.settings.notDupRec = [...(S.settings.notDupRec || []), el.dataset.key]; save(); render(); toast('סומן כלא כפול'); },
  budgetSave: () => { document.querySelectorAll('.bud').forEach(i => { const v = parseFloat(i.value); if (v > 0) S.budgets[i.dataset.cat] = v; else delete S.budgets[i.dataset.cat]; }); save(); render(); toast('התקציב נשמר'); },
  budgetAvg: () => { document.querySelectorAll('.bud').forEach(i => { const a = avgMonths(ui.month, 'expense', i.dataset.cat); if (a > 0) i.value = Math.ceil(a / 10) * 10; }); toast('מולא לפי ממוצע. לחצו "שמירת התקציב"'); },
  assetDel: el => { if (!confirm('למחוק את הפריט? אי אפשר לבטל את הפעולה.')) return; S.assets = S.assets.filter(a => a.id !== el.dataset.id); if (ui.editAsset === el.dataset.id) ui.editAsset = null; save(); render(); toast('הפריט נמחק'); },
  assetEdit: el => { ui.editAsset = el.dataset.id; render(); },
  loanPay: el => markLoanPaid(el.dataset.id, el.dataset.m),
  catAdd: el => { const t = el.dataset.type, inp = $('#newCat-' + t), v = inp.value.trim(); if (!v) return; if (S.categories[t].includes(v)) return toast('הקטגוריה כבר קיימת'); S.categories[t].push(v); save(); render(); },
  catDel: el => { const t = el.dataset.type, n = el.dataset.name; if (!confirm(`למחוק את הקטגוריה "${n}"? עסקאות קיימות לא יימחקו.`)) return; S.categories[t] = S.categories[t].filter(c => c !== n); save(); render(); },
  impGo: () => {
    const modes = ui.imp.modes || {}, months = ui.imp.months || MONTH_PRESETS.all;
    const strip = ({ src, ...t }) => t;
    const f = (ui.imp.fresh || []).filter(t => modes[t.src] === 'tx' || modes[t.src] === 'rec');
    const recRows = f.filter(t => modes[t.src] === 'rec');
    if (recRows.length && !months.length) return toast('יש לסמן לפחות חודש אחד לעסקאות הקבועות');
    f.forEach(t => { if (!S.categories[t.type].includes(t.category)) S.categories[t.type].push(t.category); });
    S.transactions.push(...f.filter(t => modes[t.src] === 'tx').map(strip));
    // קיבוץ שורות קבועות זהות לעסקה קבועה אחת
    const groups = {};
    recRows.forEach(t => (groups[recKey(t)] = groups[recKey(t)] || []).push(t));
    let newRec = 0;
    Object.values(groups).forEach(g => {
      g.sort((a, b) => a.date.localeCompare(b.date));
      const first = g[0], last = g[g.length - 1];
      let r = S.recurring.find(x => recKey(x) === recKey(first));
      if (!r) {
        r = { id: uid(), type: first.type, amount: first.amount, category: first.category, note: first.note, day: +last.date.slice(8),
          months: [...months], active: true, startMonth: first.date.slice(0, 7), lastApplied: last.date.slice(0, 7) };
        S.recurring.push(r); newRec++;
      }
      g.forEach(t => S.transactions.push({ ...strip(t), recurringId: r.id }));
    });
    applyRecurring();
    const nTx = f.length - recRows.length;
    ui.imp = null; save(); render();
    toast(`יובאו ${nTx} עסקאות רגילות ו־${newRec} עסקאות קבועות`);
  },
  impCancel: () => { ui.imp = null; render(); },
  backup: async () => download(`גיבוי-כספי-הבית-${today()}${CRYPT ? '-מוצפן' : ''}.json`, await backupText(), 'application/json'),
  printReport: () => window.print(),
  exportReportXlsx: () => {
    const year = ui.period === 'year', key = year ? ui.month.slice(0, 4) : ui.month, label = year ? 'שנת ' + key : monthName(key);
    exportXlsxFile(`כספי-הבית-${label}.xlsx`, S.transactions.filter(t => t.date.startsWith(key)), label);
  },
  exportXlsx: () => exportXlsxFile(`כספי-הבית-${today()}.xlsx`, S.transactions),
  exportShown: () => {
    const f = ui.filters, label = { month: monthName(f.month), year: 'שנת ' + f.year, hmonth: f.hmonth, hyear: 'שנת ' + f.hyear }[f.period] || 'כל התקופה';
    exportXlsxFile(`כספי-הבית-${label}.xlsx`, filteredTx(), label);
  },
  clearAll: () => { if (!confirm('למחוק את כל הנתונים? אי אפשר לבטל את הפעולה. מומלץ לשמור קודם קובץ גיבוי.')) return; S = clone(DEFAULT); save(); render(); toast('כל הנתונים נמחקו'); }
};

/* =====================================================================
   תוספות: כללי סיווג, גיבוי אוטומטי, תחזית, קופות, פיצול, תאריך עברי,
   מעשרות מפורט, נעילה בסיסמה, טלפון
   ===================================================================== */

/* ---------- 1. כללי סיווג אוטומטיים ---------- */
// כלל: אם התיאור מכיל טקסט מסוים, העסקה מקבלת קטגוריה מסוימת
function ruleCat(note, type) {
  const n = (note || '').toLowerCase();
  const r = (S.rules || []).find(r => (r.type === 'any' || r.type === type) && r.text && n.includes(r.text.toLowerCase()));
  return r ? r.category : '';
}
function applyRulesTo(list, onlyUncategorized) {
  let n = 0;
  list.forEach(t => {
    if (onlyUncategorized && t.category && t.category !== 'ללא קטגוריה') return;
    const c = ruleCat(t.note, t.type);
    if (c && c !== t.category) { t.category = c; ensureCat(t.type, c); n++; }
  });
  return n;
}
function rulesSection() {
  const rules = S.rules || [];
  return `<section class="card"><h2>כללי סיווג אוטומטי</h2>
    <p class="sub">כשהתיאור של עסקה מכיל את הטקסט, היא מקבלת את הקטגוריה. הכללים פועלים בייבוא ובהוספה ידנית בלי קטגוריה. קטגוריה שמגיעה מקובץ הייבוא קודמת לכלל.</p>
    <form id="ruleForm" class="grid-form">
      <label>התיאור מכיל<input name="text" required maxlength="40" placeholder="למשל: שופרסל"></label>
      <label>סוג<select name="type"><option value="any">הכל</option><option value="expense">הוצאה</option><option value="income">הכנסה</option></select></label>
      <label>קטגוריה<input name="category" list="cats-all" required maxlength="40" placeholder="בחירה או הקלדה" autocomplete="off">
        <datalist id="cats-all">${[...new Set([...S.categories.expense, ...S.categories.income])].map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
      <div class="actions"><button class="btn primary">הוספת כלל</button></div></form>
    ${rules.length ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>התיאור מכיל</th><th>סוג</th><th>קטגוריה</th><th>מתאים ל־</th><th></th></tr></thead><tbody>
      ${rules.map(r => `<tr><td><b>${esc(r.text)}</b></td><td>${{ any: 'הכל', expense: 'הוצאה', income: 'הכנסה' }[r.type]}</td><td><span class="tag">${esc(r.category)}</span></td>
        <td>${S.transactions.filter(t => (r.type === 'any' || r.type === t.type) && (t.note || '').toLowerCase().includes(r.text.toLowerCase())).length} עסקאות</td>
        <td><button class="btn sm danger" data-action="ruleDel" data-id="${r.id}">מחיקה</button></td></tr>`).join('')}</tbody></table></div>
      <div class="actions" style="margin-top:10px"><button class="btn sm" data-action="rulesApply" data-only="1">החלה על עסקאות ללא קטגוריה</button><button class="btn sm" data-action="rulesApply" data-only="0">החלה על כל העסקאות המתאימות</button></div>`
      : '<p class="empty">עוד לא הוגדרו כללים</p>'}</section>`;
}
function bindRules() {
  const f = $('#ruleForm'); if (!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const text = f.elements.text.value.trim(), category = f.elements.category.value.trim(), type = f.elements.type.value;
    if (!text || !category) return;
    S.rules = S.rules || [];
    if (S.rules.some(r => r.text === text && r.type === type)) return toast('כבר קיים כלל עם הטקסט הזה');
    S.rules.push({ id: uid(), text, type, category });
    ensureCat(type === 'income' ? 'income' : 'expense', category);
    save(); render(); toast('הכלל נוסף');
  });
}

/* ---------- 2. גיבוי אוטומטי ---------- */
// שמירת "ידית" לתיקיית הגיבוי ב־IndexedDB (רק בכרום ובאדג׳)
const IDB = {
  db: () => new Promise((res, rej) => { const r = indexedDB.open('dira-chadasha', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  get: async k => { try { const db = await IDB.db(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
  set: async (k, v) => { try { const db = await IDB.db(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
};
const canPickFolder = () => 'showDirectoryPicker' in window;
const backupDays = () => ({ daily: 1, weekly: 7, monthly: 30 }[S.settings.backupFreq || 'weekly'] || 0);
function backupDue() {
  const d = backupDays(); if (!d || !S.transactions.length) return false;
  const last = S.settings.lastBackup; return !last || dayDiff(last, today()) >= d;
}
// כשהנעילה פעילה, גם קובץ הגיבוי מוצפן באותה סיסמה
async function backupText() { return CRYPT ? await encryptState(S) : JSON.stringify(S, null, 1); }
async function writeBackup(interactive) {
  const name = `גיבוי-כספי-הבית-${today()}${CRYPT ? '-מוצפן' : ''}.json`, text = await backupText();
  const dir = await IDB.get('backupDir');
  if (dir) {
    try {
      let perm = await dir.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted' && interactive) perm = await dir.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable();
        await w.write(text); await w.close();
        S.settings.lastBackup = today(); save();
        return `הגיבוי נשמר בתיקייה "${dir.name}"`;
      }
    } catch (e) { if (!interactive) return ''; }
  }
  if (!interactive) return '';
  download(name, text, 'application/json');
  S.settings.lastBackup = today(); save();
  return 'קובץ הגיבוי נשמר בתיקיית ההורדות';
}
// בפתיחת התוכנה: אם הגיע הזמן ויש הרשאה לתיקייה, הגיבוי נשמר בשקט
async function autoBackupOnStart() {
  if (!backupDue()) return;
  const msg = await writeBackup(false);
  if (msg) { toast('גיבוי אוטומטי: ' + msg); }
}
function backupBanner() {
  if (!backupDue()) return '';
  return `<div class="dup-alert backup-alert"><div class="dup-head"><b>💾 הגיע הזמן לגיבוי</b>
    <span class="sub" style="margin:0">${S.settings.lastBackup ? `הגיבוי האחרון: ${gregDate(S.settings.lastBackup)}` : 'עוד לא נשמר גיבוי'}</span>
    <button class="btn sm primary" data-action="backup">גיבוי עכשיו</button></div></div>`;
}
function backupSettingsHtml(dirName) {
  // מצב הגיבויים האוטומטיים שהשרת שומר (בתיקיית התוכנה, ובכונן D כל 3 ימים)

        ועותק נוסף כל ${b.offsite.days} ימים בכונן אחר: "${esc(b.offsite.dir)}" (${b.offsite.count} גיבויים${b.offsite.last ? ', האחרון ' + gregDate(b.offsite.last) : ''}).`;
    } catch (e) { el.textContent = 'בגרסת הקישור הנתונים נשמרים רק בדפדפן הזה, ולא בענן. חשוב לשמור קובץ גיבוי מדי פעם (מומלץ לבחור תיקיית גיבוי למטה). בדפדפן או במחשב אחר הנתונים לא יופיעו, אבל אפשר לשחזר בהם מקובץ הגיבוי.'; } }, 0);
  return `<p class="sub" id="srvBackups" style="margin-top:14px">בודק את מצב הגיבויים…</p><div class="grid-form" style="margin-top:14px">
    <label>תזכורת וגיבוי אוטומטי<select id="bFreq">${[['daily', 'כל יום'], ['weekly', 'כל שבוע'], ['monthly', 'כל חודש'], ['off', 'כבוי']].map(([v, n]) => `<option value="${v}"${(S.settings.backupFreq || 'weekly') === v ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
    <div><div class="sub" style="margin:0 0 4px">תיקיית גיבוי</div>${canPickFolder() ? `<div class="inline"><b id="bDir">${dirName ? esc(dirName) : 'לא נבחרה (הגיבוי יורד לתיקיית ההורדות)'}</b><button type="button" class="btn sm" data-action="pickBackupDir">בחירת תיקייה</button></div>` : '<span class="sub">הדפדפן הזה לא תומך בבחירת תיקייה, ולכן הגיבוי יורד לתיקיית ההורדות. בכרום או באדג׳ אפשר לבחור תיקייה.</span>'}</div></div>
    <p class="sub" style="margin-top:8px">${S.settings.lastBackup ? `הגיבוי האחרון: <b>${gregDate(S.settings.lastBackup)}</b>. ` : ''}כשהגיע הזמן לגיבוי ונבחרה תיקייה, הגיבוי נשמר בה אוטומטית בפתיחת התוכנה. אם הדפדפן מבקש אישור, מופיע בדשבורד כפתור "גיבוי עכשיו". מומלץ לבחור תיקייה בדיסק אחר, בדיסק און קי או בתיקייה שמסונכרנת לענן.</p>`;

/* ---------- 3. תחזית לסוף החודש ---------- */
function forecastCard() {
  const now = new Date(), cur = monthKey(now);
  if (ui.period === 'year' || ui.month !== cur) return '';
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), d = now.getDate(), remDays = dim - d, mm = now.getMonth() + 1;
  const incSoFar = sumMonth(cur, 'income'), expSoFar = sumMonth(cur, 'expense');
  // קבועות שעוד לא נרשמו החודש
  // (קבועה שכבר נרשמה החודש, למשל מייבוא, לא נספרת שוב)
  const pending = S.recurring.filter(r => r.active && !(r.endMonth && r.endMonth < cur) && (!r.months || r.months.includes(mm)) && Math.min(r.day, dim) > d &&
    !S.transactions.some(t => t.recurringId === r.id && t.date.startsWith(cur)));
  const recInc = pending.filter(r => r.type === 'income').reduce((a, r) => a + r.amount, 0), recExp = pending.filter(r => r.type === 'expense').reduce((a, r) => a + r.amount, 0);
  // התחזית מבוססת רק על מה שרשום בפועל ועל הקבועות שעוד צפויות, בלי הערכה של הוצאות משתנות
  const projInc = incSoFar + recInc, projExp = expSoFar + recExp, end = projInc - projExp;
  if (!incSoFar && !expSoFar && !pending.length) return '';
  const bad = end < 0;
  // פירוט שנפתח בלחיצה: מה כבר נרשם (לפי קטגוריה), ואילו קבועות עוד צפויות ומתי
  const li = (name, amt, cls) => `<div class="fc-li"><span title="${esc(name)}">${esc(name)}</span><b class="${cls}">${money(amt)}</b></div>`;
  const byCat = type => {
    const g = {}; S.transactions.filter(t => t.type === type && t.date.startsWith(cur)).forEach(t => { g[t.category || 'ללא קטגוריה'] = (g[t.category || 'ללא קטגוריה'] || 0) + t.amount; });
    return Object.entries(g).sort((a, b) => b[1] - a[1]);
  };
  const detail = type => {
    const cls = type === 'income' ? 'pos' : 'neg', done = byCat(type);
    const rec = pending.filter(r => r.type === type).sort((a, b) => a.day - b.day);
    return `<details class="fc-det" data-fc="${type}"${ui['fc_' + type] ? ' open' : ''}><summary>פירוט</summary>
      <h4>קבועות עד סוף החודש</h4>${rec.length ? rec.map(r => li(`${Math.min(r.day, dim)}/${mm} · ${r.note || r.category}`, r.amount, cls)).join('') : '<div class="sub" style="margin:0">אין</div>'}
      <h4>נרשם עד היום</h4>${done.length ? done.map(([c, v]) => li(c, v, cls)).join('') : '<div class="sub" style="margin:0">עוד לא נרשם</div>'}</details>`;
  };
  return `<section class="card forecast ${bad ? 'bad' : 'good'}"><h2>🔮 תחזית לסוף ${monthName(cur)}</h2>
    <p class="sub">לפי מה שנרשם עד היום, ועוד הקבועות שצפויות עד סוף החודש. הוצאות שעוד לא נרשמו לא נכללות.</p>
    <div class="fc-grid">
      <div><div class="lbl">הכנסות</div><b class="pos">${money(projInc)}</b><div class="sub" style="margin:0">עד היום ${money(incSoFar)}${recInc ? ` + קבועות ${money(recInc)}` : ''}</div>${detail('income')}</div>
      <div><div class="lbl">הוצאות</div><b class="neg">${money(projExp)}</b><div class="sub" style="margin:0">עד היום ${money(expSoFar)}${recExp ? ` + קבועות ${money(recExp)}` : ''}</div>${detail('expense')}</div>
      <div class="fc-end"><div class="lbl">צפוי להישאר</div><b class="${bad ? 'neg' : 'pos'}">${money(end)}</b><div class="sub" style="margin:0">${remDays} ימים לסוף החודש</div></div></div>
    ${bad ? `<div class="tip bad" style="margin-top:12px"><span class="tip-ico">⚠️</span><span>גם בלי הוצאות נוספות, צפוי מינוס של ${money(-end)} בסוף החודש.</span></div>`
      : `<div class="tip good" style="margin-top:12px"><span class="tip-ico">✅</span><span>אחרי הקבועות שעוד צפויות, נשארו ${money(end)} להוצאות נוספות עד סוף החודש.</span></div>`}</section>`;
}

// זוכר אם הפירוט פתוח, כדי שלא ייסגר בכל רענון של המסך
document.addEventListener('toggle', e => { const fc = e.target.dataset && e.target.dataset.fc; if (fc) ui['fc_' + fc] = e.target.open; }, true);

/* ---------- 4. קופות ייעודיות ---------- */
const fundBal = f => (f.entries || []).reduce((a, e) => a + e.amount, 0);
// הפקדה חודשית אוטומטית לקופה (מעקב בלבד, לא נרשמת הוצאה)
function applyFundDeposits() {
  const cur = monthKey(new Date()); let ch = false;
  (S.funds || []).forEach(f => {

/* ---------- 6. תאריך עברי ---------- */
const hebPartsFmt = (() => { try { return new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { month: 'long', year: 'numeric' }); } catch (e) { return null; } })();
const hebCache = {};
function hebParts(iso) {
  if (hebCache[iso]) return hebCache[iso];
  if (!hebPartsFmt) return { y: '', m: '' };
  const [y, m, d] = iso.split('-').map(Number), parts = hebPartsFmt.formatToParts(new Date(y, m - 1, d, 12));
  const r = { y: (parts.find(p => p.type === 'year') || {}).value || '', m: ((parts.find(p => p.type === 'month') || {}).value || '').replace(/^ב/, '') };
  return hebCache[iso] = r;
}
const hebKey = iso => { const p = hebParts(iso); return `${p.m} ${p.y}`; };
// חודשים עבריים שיש בהם עסקאות, לפי סדר הזמן
function hebMonthsInData() {
  const seen = new Map();
  [...S.transactions.map(t => t.date), today()].sort().forEach(d => { const k = hebKey(d); if (!seen.has(k)) seen.set(k, d); });
  return [...seen.keys()].reverse();
}

// בסיס החישוב: הכנסות (בלי קטגוריות שהוחרגו) פחות הוצאות שהוגדרו כמנוכות
function maaserCalc(prefix) {
  const st = S.settings, exInc = st.maaserExcludeInc || [], ded = st.maaserDeduct || [];
  const inTx = t => !prefix || t.date.startsWith(prefix);
  const inc = S.transactions.filter(t => t.type === 'income' && inTx(t) && !exInc.includes(t.category)).reduce((a, t) => a + t.amount, 0);
  const deduct = S.transactions.filter(t => t.type === 'expense' && inTx(t) && ded.includes(t.category)).reduce((a, t) => a + t.amount, 0);
  // תוספת מרצון מעבר לאחוז: סכום שנרשם לכל חודש ומתווסף לנדרש באותו חודש
  const extra = Object.entries(st.maaserExtra || {}).filter(([m]) => !prefix || m.startsWith(prefix)).reduce((a, [, v]) => a + (+v || 0), 0);
  const base = Math.max(0, inc - deduct), pctDue = base * st.maaserPct / 100, due = pctDue + extra;
  const given = S.transactions.filter(t => t.type === 'expense' && inTx(t) && t.category === st.maaserCategory).reduce((a, t) => a + t.amount, 0);
  return { inc, deduct, base, pctDue, extra, due, given, bal: given - due };
}

/* ---------- 8. נעילה בסיסמה (הצפנה) ---------- */
// הנתונים נשמרים מוצפנים (AES-GCM) עם מפתח שנגזר מהסיסמה. בלי הסיסמה אי אפשר לקרוא אותם
let CRYPT = null; // { key, salt }
// המרה ל־base64 בחתיכות, כדי שגם נתונים גדולים (אלפי עסקאות) לא יקרסו
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {

// בניית המסמך של כל דוח

        rows: g.map(([c, v]) => [c, v.n, v.s, tot ? v.s / tot : 0, v.s / nM]), total: ['סה״כ', g.reduce((a, [, v]) => a + v.n, 0), tot, 1, tot / nM] } });

  }

    const rows = monthRows(list);
    doc.sections.push({ h: 'חודש אחרי חודש', chart: rows.map(r => [r[0], r[1].v, r[2].v]), table: { cols: monthCols, rows, total: ['סה״כ', { v: inc, k: 'inc' }, { v: exp, k: 'exp' }, inc - exp, '', ''] } });
  }

    doc.sections.push({ h: 'רשימה מלאה', table: { cols: [['תאריך', 'date'], ['קטגוריה', 'text'], ['תיאור', 'text'], ['סכום', 'money']], rows: bl.map(t => [t.date, t.category, t.note, { v: t.amount, k: txKind(t) }]), total: ['סה״כ', '', '', be - bi] } });
  }
  if (id === 'recurring') {
    doc.period = 'מצב נוכחי'; doc.filt = '';
    const cur = monthKey(new Date());
    // כמה תשלומים נשארו עד תאריך הסיום (רק בחודשים שנבחרו), החל מהחודש הבא או מהחודש הזה אם עוד לא נרשם
    const left = r => { if (!r.endMonth || recEnded(r) || !r.active) return null; let n = 0, m = r.lastApplied && r.lastApplied >= cur ? shiftMonth(cur, 1) : cur;

      rows: rs.map(r => { const n = left(r); return [r.note || r.category, r.type === 'income' ? 'הכנסה' : 'הוצאה', r.category, { v: r.amount, k: r.type === 'income' ? 'inc' : 'exp' }, r.day, monthsText(r.months), yr(r), r.endMonth ? shortMonth(r.endMonth) : '—', n == null ? '' : n, n == null ? '' : n * r.amount, recEnded(r) ? 'הסתיימה' : r.active ? 'פעילה' : 'מושהית']; }) } });
    const loans = live.filter(r => r.endMonth).sort((a, b) => a.endMonth.localeCompare(b.endMonth));

  if (!doc.empty && !doc.sections.length && !doc.kpis) doc.empty = 'אין נתונים בתקופה ובסינון שנבחרו';

}

// גלריית האסמכתאות בדוח: תמונות מוצגות כתמונה, קבצים אחרים ככרטיס עם קישור לפתיחה
const isImg = n => /\.(png|jpe?g|gif|webp|bmp|heic)$/i.test(String(n || ''));
function attachmentsHtml(list) {
  if (!list || !list.length) return '';
  const cards = list.map(a => {
    const url = HOME_API + 'file?f=' + encodeURIComponent(a.file);
    return isImg(a.name)
      ? `<figure class="att"><a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(a.name)}" loading="lazy"></a><figcaption>${esc(a.name)}${a.note ? ' · ' + esc(a.note) : ''}</figcaption></figure>`
      : `<a class="att-file" href="${url}" target="_blank" rel="noopener"><span class="att-ico">📄</span><span class="att-nm">${esc(a.name)}</span>${a.note ? `<span class="att-sub">${esc(a.note)}</span>` : ''}</a>`;
  }).join('');
  return `<section class="card rep-card rep-att"><h2>📎 אסמכתאות ותמונות <small>(${list.length})</small></h2><div class="att-grid">${cards}</div></section>`;
}
// הצגה במסך ובהדפסה
function docCell(c, kind) {
  const o = c !== null && typeof c === 'object' ? c : { v: c }, k = o.k || kind, v = o.v;
  if (v === '' || v === null || v === undefined) return '<td></td>';
  if (k === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return `<td class="c-date">${gregDate(v)}<span class="heb">${hebDate(v)}</span></td>`;
  if (k === 'bar') return `<td><div class="bar"><span style="width:${Math.min(100, v * 100).toFixed(1)}%"></span></div><span class="heb">${(v * 100).toFixed(0)}%</span></td>`;
  if (k === 'pct') return `<td class="amount">${(v * 100).toFixed(0)}%</td>`;
  if (typeof v === 'number' && (k === 'money' || k === 'inc' || k === 'exp')) return `<td class="amount ${k === 'inc' ? 'pos' : k === 'exp' ? 'neg' : v < 0 ? 'neg' : ''}">${money(v)}</td>`;
  return `<td${k === 'center' || k === 'num' ? ' style="text-align:center"' : ''}>${esc(v)}</td>`;
}
function docHtml(doc) {
  const kv = ([l, v, k]) => `<div class="stat ${k === 'inc' ? 's-inc' : k === 'exp' ? 's-exp' : 's-nw'}"><div class="lbl">${esc(l)}</div><div class="val" style="font-size:20px">${typeof v === 'number' ? (k === 'num' ? v : k === 'pct' ? (v * 100).toFixed(0) + '%' : money(v)) : esc(v)}</div></div>`;
  const chart = rows => { const max = Math.max(1, ...rows.flatMap(r => [r[1], r[2]]));
    return `<div class="doc-chart">${rows.map(([n, i, e]) => `<div class="dc-row"><span class="dc-lbl">${esc(n)}</span><div class="dc-bars"><div class="dc-bar inc" style="width:${(i / max * 100).toFixed(1)}%" title="הכנסות ${money(i)}"></div><div class="dc-bar exp" style="width:${(e / max * 100).toFixed(1)}%" title="הוצאות ${money(e)}"></div></div></div>`).join('')}
      <div class="dc-legend"><span><i class="inc"></i>הכנסות</span><span><i class="exp"></i>הוצאות</span></div></div>`; };
  return `<div class="report doc">
    <div class="rep-head"><div><div class="rep-brand"><span class="logo-ico">₪</span> דירה חדשה</div><h1>${esc(doc.title)}</h1>
      <div class="dates">${esc(doc.period)}${doc.filt ? ' · ' + esc(doc.filt) : ''}</div></div>
      <div class="rep-date">הופק ב־${gregDate(today())}<br>${hebDate(today())}</div></div>
    ${doc.empty ? `<p class="empty">${esc(doc.empty)}</p>` : ''}
    ${doc.kpis ? `<div class="stats">${doc.kpis.map(kv).join('')}</div>` : ''}
    ${doc.highlights ? `<section class="card rep-card"><div class="rep-mini" style="margin:0">${doc.highlights.map(h => `<div>${esc(h)}</div>`).join('')}</div></section>` : ''}
    ${doc.sections.map(s => `<section class="card rep-card"><h2>${esc(s.h)}</h2>${s.chart && s.chart.length > 1 ? chart(s.chart) : ''}
      <div class="table-wrap"><table class="rep-table"><thead><tr>${s.table.cols.map(([h]) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>
      ${s.table.rows.map(r => `<tr>${r.map((c, j) => docCell(c, s.table.cols[j][1])).join('')}</tr>`).join('')}</tbody>
      ${s.table.total ? `<tfoot><tr>${s.table.total.map((c, j) => docCell(c, s.table.cols[j][1] === 'bar' ? 'pct' : s.table.cols[j][1])).join('')}</tr></tfoot>` : ''}</table></div></section>`).join('')}
    ${attachmentsHtml(doc.attachments)}
    ${doc.note ? `<p class="sub" style="margin-top:4px">${esc(doc.note)}</p>` : ''}</div>`;
}
// אותו מסמך כקובץ אקסל: גיליון "סיכום" ועוד גיליון לכל טבלה
function docXlsx(doc) {
  const xs = (c, kind, tot) => { const o = c !== null && typeof c === 'object' ? c : { v: c }, k = o.k || kind, v = o.v;
    if (v === '' || v === null || v === undefined) return { v: '', s: tot ? XS.totText : XS.text };
    if (k === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return { d: v };
    if (k === 'bar' || k === 'pct') return { v: +v, s: tot ? XS.totPct : XS.pct };
    if (typeof v === 'number') return { v: Math.round(v * 100) / 100, s: tot ? XS.totMoney : k === 'inc' ? XS.inc : k === 'exp' ? XS.exp : k === 'num' ? XS.center : XS.money };
    return { v: String(v), s: tot ? XS.totText : k === 'center' ? XS.center : XS.text }; };
  const width = k => ({ text: 26, date: 12, center: 13, num: 10, bar: 10, pct: 10 }[k] || 15);
  const head = [[{ v: `${doc.title} · דירה חדשה`, s: XS.title }], [{ v: `${doc.period}${doc.filt ? ' · ' + doc.filt : ''} · הופק ב־${gregDate(today())} · ${hebDate(today())}`, s: XS.sub }], []];
  const sum = { name: 'סיכום', cols: [34, 18], heights: [30], tab: 'FF4F46E5', merges: ['A1:F1', 'A2:F2'], rows: [...head] };
  if (doc.empty) sum.rows.push([{ v: doc.empty, s: XS.text }]);
  (doc.kpis || []).forEach(([l, v, k]) => sum.rows.push([{ v: l, s: XS.totText }, typeof v === 'number' ? (k === 'pct' ? { v, s: XS.totPct } : k === 'num' ? { v, s: XS.center } : { v: Math.round(v * 100) / 100, s: XS.totMoney }) : { v: String(v), s: XS.totText }]));
  if (doc.highlights) { sum.rows.push([]); doc.highlights.forEach(h => sum.rows.push([{ v: h, s: XS.text }])); }
  if (doc.note) { sum.rows.push([]); sum.rows.push([{ v: doc.note, s: XS.sub }]); }
  const used = new Set(['סיכום']);
  const sheets = [sum, ...doc.sections.map((s, i) => {
    let name = s.h.replace(/\s*[\[\]:*?\/\\']\s*/g, ' - ').slice(0, 31).trim(); while (used.has(name)) name = name.slice(0, 28) + ' ' + (i + 1); used.add(name);
    const cols = s.table.cols, n = s.table.rows.length;
    const rows = [...head, cols.map(([h]) => ({ v: h, s: XS.head })), ...s.table.rows.map(r => r.map((c, j) => xs(c, cols[j][1]))), ...(s.table.total ? [s.table.total.map((c, j) => xs(c, cols[j][1], true))] : [])];
    return { name, cols: cols.map(([, k], j) => j === 0 && k === 'text' ? 30 : width(k)), freeze: 4, heights: [30, null, null, 24], tab: ['FF06B6D4', 'FFF59E0B', 'FF10B981', 'FFEC4899', 'FF8B5CF6'][i % 5],
      merges: [`A1:${colL(Math.max(cols.length - 1, 3))}1`, `A2:${colL(Math.max(cols.length - 1, 3))}2`], filter: n ? `A4:${colL(cols.length - 1)}${4 + n}` : null, rows };
  })];
  return buildXlsx(sheets);
}

/* ---------- צ'אט "שאל את הנתונים": מנוע מקומי (בלי אינטרנט) ו־AI אמיתי (Claude) ---------- */
// מנוע מקומי: מזהה בשאלה תקופה, סוג, קטגוריה, שם ומה שואלים, ומחשב מהנתונים
const CHAT_STOP = new Set(['כמה', 'מה', 'על', 'של', 'את', 'לי', 'אני', 'הוצאתי', 'הוצאות', 'הוצאה', 'הכנסות', 'הכנסה', 'קיבלתי', 'השנה', 'החודש', 'חודש', 'שנה', 'שעבר', 'שעברה', 'הקודם', 'הקודמת', 'בסך', 'הכל', 'סה״כ', 'סהכ', 'היה', 'היו', 'יש', 'זה', 'הזה', 'הזו', 'בכל', 'כל', 'עם', 'עד', 'מתי', 'למי', 'איפה', 'לאן', 'הכי', 'גדול', 'גבוה', 'יקר', 'הגדולה', 'הגדולות', 'הגבוהה', 'פעמים', 'עסקאות', 'עסקה', 'ממוצע', 'בממוצע', 'יתרה', 'נשאר', 'חסר', 'שילמתי', 'נתתי', 'ניתן', 'לפי', 'קטגוריה', 'קטגוריות', 'הרבה', 'תראה', 'תן', 'רשימה', 'וכמה', 'או', 'גם', 'בין', 'לעומת', 'יצא', 'נכנס', 'הולך', 'כסף', 'שקל', 'שקלים', 'שלי', 'שלנו', 'הייתה', 'צריך', 'קבועות', 'הקבועות', 'קבועה', 'תודה', 'בבקשה', 'אפשר', 'רוצה', 'לדעת']);
const chatWords = q => q.replace(/[?!.,:;"״׳']/g, ' ').split(/\s+/).filter(Boolean);
const stripPrefix = w => w.replace(/^(ו?(ב|ל|מ|ה|ש|כ)?)/, '');
function chatPeriod(q) {
  const now = new Date(), cur = monthKey(now), Y = String(now.getFullYear()), words = chatWords(q);
  let year = (q.match(/(20\d\d)/) || [])[1];
  if (/שנה שעברה|בשנה הקודמת|שנה קודמת/.test(q)) year = String(+Y - 1);
  for (let i = 0; i < 12; i++) if (words.some(w => w === MONTHS[i] || stripPrefix(w) === MONTHS[i])) { const k = `${year || Y}-${pad(i + 1)}`; return { key: k, label: monthName(k) }; }
  if (/חודש שעבר|בחודש הקודם|חודש קודם/.test(q)) { const k = shiftMonth(cur, -1); return { key: k, label: monthName(k) }; }
  if (/החודש|בחודש הזה/.test(q)) return { key: cur, label: monthName(cur) };
  if (year) return { key: year, label: 'שנת ' + year };
  if (/מתחילת|כל הזמן|כל התקופה|אי פעם/.test(q)) return { key: '', label: 'כל התקופה' };
  return { key: Y, label: 'שנת ' + Y };
}
function localAnswer(q) {
  const P = chatPeriod(q), inP = t => !P.key || t.date.startsWith(P.key);
  const isInc = /הכנס|קיבלתי|נכנס|משכורת/.test(q), isExp = /הוצא|הוצאתי|שילמתי|יצא|עלה לי|קניתי/.test(q);
  let type = isInc && isExp ? null : isInc ? 'income' : isExp ? 'expense' : null;
  // קטגוריה שמופיעה בשאלה (הארוכה ביותר קודם)
  const cats = [...new Set(S.transactions.map(t => t.category).filter(Boolean))].sort((a, b) => b.length - a.length);
  const cat = cats.find(c => q.includes(c));
  if (cat === 'משכורת' && !/הוצא/.test(q)) type = null;
  // מילה שמופיעה בתיאורי העסקאות (שם ספק, מוסד, אדם)
  // כל מילה נבדקת כמו שהיא, ואחר כך בלי אות שימוש אחת או שתיים (ו, ב, ל, מ, ה, ש, כ). ההתאמה רק בתחילת מילה בתיאור
  let term = null;
  const cands = w => [w, w.replace(/^[ובלמהשכ]/, ''), w.replace(/^ו[בלמהשכ]/, '')].filter((x, i, a) => x.length >= 3 && a.indexOf(x) === i);
  const atWordStart = (note, s) => new RegExp(`(^|[\\s\\-–(])${s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`).test(note || '');
  if (!cat) outer: for (const w of chatWords(q)) {
    const cs = cands(w); if (!cs.length || cs.some(s => CHAT_STOP.has(s) || MONTHS.includes(s)) || /^\d+$/.test(w)) continue;
    for (const s of cs) if (S.transactions.some(t => atWordStart(t.note, s))) { term = s; break outer; } }
  const base = S.transactions.filter(t => inP(t) && (!cat || t.category === cat) && (!term || atWordStart(t.note, term)));
  // הוצאות בלי החזרי חוב, אלא אם שואלים במפורש על קטגוריית ההלוואות
  const expOf = l => l.filter(t => t.type === 'expense' && (!isDebtRepay(t) || cat === S.settings.loanCategory));
  const list = type ? base.filter(t => t.type === type) : base;
  const what = [cat ? `"${cat}"` : '', term ? `"${term}"` : ''].filter(Boolean).join(' ');
  const where = ` ב${P.label}`;
  const tot = l => l.reduce((a, t) => a + t.amount, 0);
  const txLines = l => `<ul class="chat-ul">${l.map(t => `<li>${gregDate(t.date)} · ${esc(t.note || t.category)} · <b class="${t.type === 'income' ? 'pos' : 'neg'}">${money(t.amount)}</b></li>`).join('')}</ul>`;
  const nMonths = Math.max(1, new Set(base.map(t => t.date.slice(0, 7))).size);

  // מעשרות / חומש
  if (/חומש|מעשרות|מעשר/.test(q) && /חסר|נשאר|יתרה|צריך|חייב|נדרש|מצב|עודף|כמה/.test(q) && !/נתתי ל|למי/.test(q)) {
    const c = maaserCalc(P.key), all = maaserCalc(''), cum = all.bal + (+S.settings.maaserOpening || 0);
    return `<b>${S.settings.maaserPct === 20 ? 'חומש' : 'מעשר'}${where}:</b> נדרש ${money(c.due)}, ניתן <b>${money(c.given)}</b> · ${c.bal >= 0 ? `עודף של <b class="pos">${money(c.bal)}</b>` : `חסר <b class="neg">${money(-c.bal)}</b>`}.<br>
      יתרה מצטברת מכל התקופה: <b class="${cum >= 0 ? 'pos' : 'neg'}">${cum >= 0 ? 'עודף ' : 'חסר '}${money(Math.abs(cum))}</b>.<br><span class="sub">החישוב לפי ההגדרות במסך המעשרות. את כללי החישוב כדאי לברר אצל הרב.</span>`;
  }
  // למי נתתי
  if (/למי/.test(q)) {
    const g = groupSum(base.filter(t => t.type === 'expense' && t.category === (cat || S.settings.maaserCategory)), t => t.note).slice(0, 10);
    if (!g.length) return `לא מצאתי נתינות${where}.`;
    return `<b>למי ניתן הכי הרבה${where}:</b><ul class="chat-ul">${g.map(([w, v]) => `<li>${esc(w)} · <b>${money(v.s)}</b> (${v.n} פעמים)</li>`).join('')}</ul>`;
  }
  // הקבועות
  if (/קבוע|הוראות קבע|הוראת קבע|הלווא/.test(q) && !cat && !term) {
    const live = S.recurring.filter(r => r.active && !recEnded(r)), e = live.filter(r => r.type === 'expense'), i = live.filter(r => r.type === 'income');
    return `יש לך ${live.length} קבועות פעילות: הוצאות <b class="neg">${money(tot(e))}</b> בחודש, הכנסות <b class="pos">${money(tot(i))}</b> בחודש.
      ${e.length ? `<br>הגדולות:<ul class="chat-ul">${[...e].sort((a, b) => b.amount - a.amount).slice(0, 5).map(r => `<li>${esc(r.note || r.category)} · <b>${money(r.amount)}</b>${r.endMonth ? ` · עד ${shortMonth(r.endMonth)}` : ''}</li>`).join('')}</ul>` : ''}`;
  }
  if (!base.length) return `לא מצאתי עסקאות${what ? ' של ' + what : ''}${where}. נסה תקופה אחרת, למשל "בכל התקופה".`;
  // ההוצאות / העסקאות הגדולות
  if (/הכי (גדול|גבוה|יקר)|הגדול|הגבוה|הכי יקר/.test(q) && !/קטגורי/.test(q)) {
    const l = (type ? list : expOf(base)).sort((a, b) => b.amount - a.amount).slice(0, 5);
    return `<b>${type === 'income' ? 'ההכנסות' : 'ההוצאות'} הגדולות${what ? ' של ' + what : ''}${where}:</b>${txLines(l)}`;
  }
  // על מה הולך הכסף
  if (/קטגורי|על מה|לאן|איפה .*כסף|הכי הרבה/.test(q)) {
    const t2 = type || 'expense', pool2 = t2 === 'expense' ? expOf(base) : base.filter(t => t.type === t2),
      g = groupSum(pool2, t => t.category).slice(0, 8), all = tot(pool2);
    return `<b>${t2 === 'income' ? 'ההכנסות' : 'ההוצאות'} לפי קטגוריה${where}:</b><ul class="chat-ul">${g.map(([c, v]) => `<li>${esc(c)} · <b>${money(v.s)}</b> (${all ? (v.s / all * 100).toFixed(0) : 0}%)</li>`).join('')}</ul>`;
  }
  // לפי חודשים
  if (/לפי חודש|כל חודש|חודש אחרי|בכל חודש|חודשי/.test(q)) {
    const ms = monthsOf(base);
    return `<b>${what || (type === 'income' ? 'הכנסות' : type === 'expense' ? 'הוצאות' : 'הכנסות והוצאות')} לפי חודשים${where}:</b><ul class="chat-ul">${ms.map(m => { const ml = base.filter(t => t.date.startsWith(m));
      return `<li>${monthName(m)} · ${type !== 'expense' ? `הכנסות <b class="pos">${money(tot(ml.filter(t => t.type === 'income')))}</b> ` : ''}${type !== 'income' ? `הוצאות <b class="neg">${money(tot(expOf(ml)))}</b>` : ''}</li>`; }).join('')}</ul>`;
  }
  if (/כמה פעמים|כמה עסקאות|מספר/.test(q)) return `${what || 'נמצאו'}${where}: <b>${list.length}</b> עסקאות, בסך ${money(tot(list))}.`;
  if (/ממוצע/.test(q)) return `ממוצע ${type === 'income' ? 'הכנסות' : 'הוצאות'}${what ? ' על ' + what : ''}${where}: <b>${money(tot(type ? list : expOf(base)) / nMonths)}</b> לחודש (לפי ${nMonths} חודשים).`;
  if (/יתרה|נשאר לי|חסכתי|חיסכון|מאזן|פלוס|מינוס/.test(q) && !cat && !term) {
    const i = tot(base.filter(t => t.type === 'income')), e = tot(expOf(base));
    return `${where.trim()}: הכנסות <b class="pos">${money(i)}</b>, הוצאות <b class="neg">${money(e)}</b>, יתרה <b class="${i - e >= 0 ? 'pos' : 'neg'}">${money(i - e)}</b>${i ? ` (${((i - e) / i * 100).toFixed(0)}% מההכנסות)` : ''}.`;
  }
  // ברירת מחדל: סכום
  if (!type && !cat && !term) {
    const i = tot(base.filter(t => t.type === 'income')), e = tot(expOf(base));
    return `${where.trim()}: הכנסות <b class="pos">${money(i)}</b>, הוצאות <b class="neg">${money(e)}</b>, יתרה <b>${money(i - e)}</b>.<br><span class="sub">אפשר לשאול על קטגוריה, שם, חודש, "הכי גדולות", "לפי חודשים" ועוד.</span>`;
  }
  const l2 = type === 'expense' ? expOf(base) : type ? list : base, s = tot(l2);
  return `${type === 'income' ? 'הכנסות' : type === 'expense' ? 'הוצאות' : 'סך הכל'}${what ? ' על ' + what : ''}${where}: <b class="${type === 'income' ? 'pos' : 'neg'}">${money(s)}</b> ב־${l2.length} עסקאות.
    ${l2.length > 1 ? `<br>האחרונות:${txLines([...l2].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5))}` : ''}`;
}

// צ'אט בחלון צף, כמו "שאל את המאגר" בתוכנת הביטוחים:
// כששרת הצ'אט (chat_server.py) פועל ומחובר לשירות SAI – תשובות במשפטים מלאים. אחרת – חישוב מקומי מהנתונים.
