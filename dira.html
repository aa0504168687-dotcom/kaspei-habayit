// מחזיר true = למחוק גם את ההו"ק, false = רק את התשלום, null = ביטול.
function askDeleteMode(title, one, rec, picked, recs) {
  const n = picked ? picked.length : 1;
  const howMany = recs
    ? `${recs.length} הוראות קבע:\n` + recs.slice(0, 8).map(r => `• ${r.note || '(בלי תיאור)'} — ${money(r.amount)}`).join('\n') +
      (recs.length > 8 ? `\n…ועוד ${recs.length - 8}` : '')
    : `• ${rec.note || '(בלי תיאור)'} — ${money(rec.amount)} בכל חודש`;
  const msg = `${title}\n\n${howMany}\n\n` +
    `לחיצה על "אישור" תמחק את ההוצאה${n > 1 ? `ות (${n})` : ''} וגם את ההוראה הקבועה עצמה – ` +
    `מכאן והלאה היא לא תיווצר יותר.\n` +
    `לחיצה על "ביטול" תשאיר את ההוראה הקבועה כמו שהיא, ותחזור לתוכנה בלי למחוק כלום.\n\n` +
    `רוצה למחוק רק את ההוצאה${n > 1 ? 'ות' : ''} האלה ולהשאיר את ההוראה הקבועה פעילה? – לחץ "ביטול" ואז מחק דרך מסך "הוצאות והכנסות קבועות".`;
  return confirm(msg) ? true : null;
}

// מוחק הוצאות (ובאופציה גם את הוראות הקבע שלהן), עם אפשרות ביטול
function deleteExpense(ids, alsoRec) {
  const set = new Set(ids), h = H();
  const txBefore = S.transactions.map(t => ({ t, i: S.transactions.indexOf(t) }));
  const recBefore = S.recurring.slice();
  const stageBefore = { ...h.stageOf };

  const recIds = alsoRec ? new Set(S.transactions.filter(t => set.has(t.id) && t.recurringId).map(t => t.recurringId)) : new Set();
  // במחיקת הו"ק — נמחקים גם כל התשלומים האחרים שלה, אחרת ההוצאה תחזור בשקט
  const allIds = alsoRec ? new Set(S.transactions.filter(t => set.has(t.id) || (t.recurringId && recIds.has(t.recurringId))).map(t => t.id)) : set;

  S.transactions = S.transactions.filter(t => !allIds.has(t.id));
  if (alsoRec) S.recurring = S.recurring.filter(r => !recIds.has(r.id));
  allIds.forEach(id => delete h.stageOf[id]);
  recIds.forEach(id => delete h.stageOf['r:' + id]);
  save();

  undoToast(`${allIds.size} הוצאות נמחקו` + (recIds.size ? ` ו־${recIds.size} הוראות קבע` : ''), () => {    // מחזיר את ההוצאות למקומן המדויק ברשימה
    txBefore.filter(({ t }) => allIds.has(t.id)).forEach(({ t, i }) => {
      if (!S.transactions.some(x => x.id === t.id)) S.transactions.splice(Math.min(i, S.transactions.length), 0, t);
    });
    if (alsoRec) S.recurring = recBefore;
    Object.assign(h.stageOf, stageBefore);
    save(); render(); toast('המחיקה בוטלה');
  });
}

async function homeUpload(list) {

    try {
      const data = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] || '');
        r.onerror = () => rej(new Error('קריאת הקובץ נכשלה'));
        r.readAsDataURL(f);
      });
      const d = await homePost('file', { name: f.name, data });
      if (d.ok) out.push({ file: d.file, name: f.name });
      else toast(d.error || 'צירוף הקובץ נכשל');
    } catch (e) {
      // קובץ בודד שנכשל לא עוצר את התשלום — הוא נשמר בלי אותו, עם הודעה ברורה

/* ---------- טיפול בלחיצות: כל הכפתורים במסך מגיעים לכאן ---------- */
document.addEventListener('click', e => {
  // קודם data-action: שם מטפל הכפתור עצמו (למשל עריכה או מחיקה של פריט)
  const act = e.target.closest('[data-action]');
  if (act && ACTIONS[act.dataset.action]) {
    try { ACTIONS[act.dataset.action](act); }
    catch (err) { console.error('שגיאה בפעולה ' + act.dataset.action, err); toast('הפעולה נכשלה: ' + String((err && err.message) || err)); }
    return;
  }
  // אחר כך data-tab: מעבר בין המסכים של הפרויקט (משימות, חוזה, הוצאות…)
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.homeTab = tab.dataset.tab; render(); window.scrollTo(0, 0); }
});

// גרירת קובץ מהמחשב אל התוכנה (מייל, PDF או תמונה)
document.addEventListener('dragover', e => { if ([...((e.dataTransfer || {}).types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (![...((e.dataTransfer || {}).types || [])].includes('Files')) return;
  if (e.target.closest && e.target.closest('#hDrop, #hUpDrop')) return;   // אזורי הגרירה כבר מטפלים בזה
  e.preventDefault(); window.homeDrop(e.dataTransfer);
});

// הסיכום הקבוע בראש כל מסך: כמה מההוצאות כוסה מהון עצמי, וכמה נשאר לפי התקציב.
// "מהון עצמי" = ההוצאות של הפרויקט פחות כל ההלוואות והמימון שנרשמו בלשונית שלהם.
// "נשאר להוצאות" = סך התקציב שהוגדר לשלבים פחות ההוצאות שנוצלו ממנו.
function ownSummary() {
  const h = H(), tx = homeTx();
  const loans = h.funding.filter(f => f.kind === 'loan')
    .reduce((a, f) => a + (+f.amount || 0), 0)
    + tx.filter(t => isDebtRepay(t)).reduce((a, t) => a + t.amount, 0);
  const spent = tx.reduce((a, t) => a + t.amount, 0);
  const own = Math.max(0, spent - loans);
  const bud = Object.values(h.budget).reduce((a, v) => a + (+v || 0), 0);
  return { own, spent, loans, bud, left: bud - own, hasBud: bud > 0 };
}
function ownBar() {
  const s = ownSummary();
  if (!s.spent && !s.loans && !s.bud) return '';
  const sign = v => (v >= 0 ? '' : '−') + money(Math.abs(v));
  return `<div class="ob-item"><span class="ob-lbl">מהון עצמי</span><span class="ob-val" dir="ltr">${money(s.own)}</span>
      <span class="ob-sub">הוצאות ${money(s.spent)} פחות הלוואות ומימון ${money(s.loans)}</span></div>
    <div class="ob-item"><span class="ob-lbl">נשאר להוצאות</span><span class="ob-val ${s.left < 0 ? 'neg' : 'pos'}" dir="ltr">${sign(s.left)}</span>
      <span class="ob-sub">${s.hasBud ? `מתוך תקציב ${money(s.bud)}` : 'לא הוגדר תקציב'}</span></div>`;
}
function render() {
  const cur = ui.homeTab || 'all';
  document.querySelectorAll('aside [data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === cur));
  const el = $('#view');
  if (el.dataset.screen !== cur) { el.dataset.screen = cur; el.scrollTop = 0; }
  let html;
  try { html = VIEWS.home(); }
  catch (e) { html = renderError(e); }
  el.innerHTML = html;
  const ob = $('#ownbar');
  // הסרגל העליון (הון עצמי / כמה נשאר) הוסר לבקשת המשתמש — הנתונים מופיעים בלשונית "הלוואות ומימון" ובדוחות
  if (ob) { ob.hidden = true; ob.innerHTML = ''; }
  // קריסה של מאזין אחד לא מונעת רישום של האחרים
  if (BIND.home) { try { BIND.home(); } catch (e) { console.error('שגיאה בקישור המסך', e); } }
}

// שגיאת תצוגה: לא מפילים את כל הדף
function renderError(e) {
  console.error('שגיאה בתצוגה', e);
  return `<section class="card"><h2>⚠️ לא הצלחנו להציג את המסך הזה</h2>
    <p class="sub">הנתונים שלך שמורים ולא נפגעו. נסו לרענן, ואם התקלה נמשכת — שלחו לי את ההודעה הבאה:</p>
    <pre dir="ltr" style="white-space:pre-wrap;background:#f6f6f6;padding:10px;border-radius:8px">${esc(String((e && e.stack) || e))}</pre></section>`;
}

// הודעת "אין לך רשיון" וכדומה לא נדרשת כאן
/* ---------- מונה כניסות אנונימי (GoatCounter) ----------
   רק באתר הציבורי (github.io), פעם אחת לכל פתיחה. נשלחת בקשת תמונה קטנה בלבד: בלי סקריפט חיצוני, בלי עוגיות,

(function kaspeiCount() {
  try {
    if (!/\.github\.io$/.test(location.hostname)) return;

  if (k === 'recurring') return `${o.note || o.category || ''} · ${money(o.amount)} ${o.type === 'income' ? 'הכנסה' : 'הוצאה'} קבועה`;

  const now = hTake(), at = Date.now(), del = [], ed = [], add = [];
  for (const id in hSnap) { if (!(id in now)) del.push(id); else if (now[id] !== hSnap[id]) ed.push(id); }
  for (const id in now) if (!(id in hSnap)) add.push(id);
  if (!del.length && !ed.length && !add.length) return;
  const H = S.history = S.history || [], obj = (m, id) => JSON.parse(m[id]), sp = id => { const i = id.indexOf(':'); return [id.slice(0, i), id.slice(i + 1)]; };
  if (del.length > 20) H.push({ at, kind: 'bulkdel', k: sp(del[0])[0], items: del.slice(0, 2000).map(id => { const [k] = sp(id); return { k, o: obj(hSnap, id) }; }), n: del.length });
  else del.forEach(id => { const [k, i] = sp(id); H.push({ at, kind: 'del', k, id: i, o: obj(hSnap, id) }); });
  if (ed.length > 20) H.push({ at, kind: 'bulkedit', k: sp(ed[0])[0], items: ed.slice(0, 2000).map(id => { const [k] = sp(id); return { k, o: obj(hSnap, id) }; }), n: ed.length });
  else ed.forEach(id => { const [k, i] = sp(id); H.push({ at, kind: 'edit', k, id: i, o: obj(hSnap, id), after: obj(now, id) }); });
  const realAdd = add.filter(id => { const o = obj(now, id); return !(sp(id)[0] === 'transactions' && o.recurringId); });
  if (realAdd.length > 20) H.push({ at, kind: 'bulkadd', k: sp(realAdd[0])[0], ids: realAdd.slice(0, 5000).map(id => sp(id)[1]), n: realAdd.length });
  else realAdd.forEach(id => { const [k, i] = sp(id); H.push({ at, kind: 'add', k, id: i, after: obj(now, id) }); });

const QR = (() => {
  const ECC_M = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26], BLK_M = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const rawModules = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCw = v => Math.floor(rawModules(v) / 8) - ECC_M[v] * BLK_M[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 255; };
  function divisor(deg) { const r = []; for (let i = 0; i < deg - 1; i++) r.push(0); r.push(1); let root = 1; for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; }
  function remainder(data, div) { const r = div.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); } return r; }
  function alignPos(v) { if (v === 1) return []; const n = Math.floor(v / 7) + 2, size = v * 4 + 17, step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2; const r = [6]; for (let p = size - 7; r.length < n; p -= step) r.splice(1, 0, p); return r; }
  function encode(text) {
    const bytes = [...new TextEncoder().encode(text)];
    let v = 1; for (; v <= 10; v++) if (4 + (v < 10 ? 8 : 16) + 8 * bytes.length <= dataCw(v) * 8) break;
    if (v > 10) throw new Error('QR: text too long');
    const bits = []; const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCw(v) * 8; put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));
    // ECC and interleaving
    const nb = BLK_M[v], el = ECC_M[v], raw = Math.floor(rawModules(v) / 8), nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = divisor(el);
    const blocks = []; for (let i = 0, k = 0; i < nb; i++) { const d = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += d.length; const e = remainder(d, div); if (i < nShort) d.push(0); blocks.push(d.concat(e)); }
    const cw = []; for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) cw.push(b[i]); });
    // the grid
    const size = v * 4 + 17, M = [...Array(size)].map(() => Array(size).fill(false)), F = [...Array(size)].map(() => Array(size).fill(false));
    const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const xx = x + dx, yy = y + dy, d = Math.max(Math.abs(dx), Math.abs(dy)); if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const ap = alignPos(v), last = ap.length - 1;
    ap.forEach((a, i) => ap.forEach((b, j) => { if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    const drawFormat = mask => {
      const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, g = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, g(i));
      set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (v >= 7) { let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (v << 12) | r; for (let i = 0; i < 18; i++) { const bit = ((b >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, bit); set(c, a, bit); } }
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && i < cw.length * 8) { M[y][x] = ((cw[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; }
      }
    }
    const maskFn = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const apply = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && maskFn[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let a = 0; a < size; a++) for (const horiz of [true, false]) { let run = 1; for (let b = 1; b <= size; b++) { const cur = b < size ? (horiz ? M[a][b] : M[b][a]) : null, prev = horiz ? M[a][b - 1] : M[b - 1][a]; if (cur === prev) run++; else { if (run >= 5) p += run - 2; run = 1; } } }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) { const c = M[y][x]; if (c === M[y][x + 1] && c === M[y + 1][x] && c === M[y + 1][x + 1]) p += 3; }
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (M[y][x]) dark++;
      return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { apply(m); drawFormat(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } apply(m); }
    apply(best); drawFormat(best);
    return { size, modules: M, version: v, mask: best };
  }
  function svg(text, px = 220) {
    const q = encode(text), n = q.size + 8; let d = '';
    q.modules.forEach((row, y) => row.forEach((on, x) => { if (on) d += `M${x + 4} ${y + 4}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { encode, svg };
})();

      if (f.p1.value !== f.p2.value) return msg('הסיסמאות לא זהות');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      CRYPT = { key: await deriveKey(f.p1.value, salt), salt };
      persist(); await encChain; await rememberKey();
      el.hidden = true; el.innerHTML = ''; resetIdle(); render();
      toast('הסיסמה נשמרה והנתונים מוצפנים. מומלץ להפעיל גם אימות כפול בהגדרות');
    });
    setTimeout(() => f.p1.focus(), 50);
  }
  const _safeStart = safeStart;
  safeStart = function () { const ok = _safeStart(); if (!CRYPT) setupPassword(); return ok; };
  ACTIONS.lockOff = () => toast('בגרסת הקישור הסיסמה היא חובה. אפשר להחליף אותה, אבל לא לבטל.');

  /* 2. Unlock: password, then (if enabled) a code from the authenticator app */
  const _lockScreen = lockScreen;
  lockScreen = function (m) {
    _lockScreen(m);
    const old = $('#unlockForm'); if (!old) return;
    const f = old.cloneNode(true); old.replaceWith(f);
    f.addEventListener('submit', async e => {
      e.preventDefault(); const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'פותח…';
      let data;
      try { data = normalize(await decryptState(FILE.raw, f.p.value)); } catch (err) { lockScreen('סיסמה שגויה'); return; }
      const t = data.settings && data.settings.twofa;
      if (t && t.secret) { const ok = await codeStep(t, data); if (!ok) return; }
      openWith(data);

    setTimeout(() => { const i = f.querySelector('input'); if (i) i.focus(); }, 50);
  };
  function openWith(data) {

        <label>קוד מהאפליקציה<input name="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" style="text-align:center;font-size:22px;letter-spacing:6px" required></label>

          <p class="sub" style="margin:4px 0 0;font-size:12px">אחרי כניסה עם קוד שחזור, האימות הכפול יבוטל, ותוכלו להפעיל אותו מחדש בהגדרות.</p></details>

      const f = $('#tfaForm'), msg = s => { const m = $('#tfaMsg'); m.hidden = false; m.textContent = s; };

      return `<section class="card" id="tfaCard"><h2>🔐 הפעלת אימות כפול</h2>
        <ol class="sub" style="margin:0 0 10px;padding-inline-start:20px;line-height:1.9">

})();

/* ---------- פנייה לשדרוג או הצעה: חלון קטן ששולח הודעה למייל ---------- */

    el.addEventListener('click', e => { if (e.target === el) close(); });

    $('#reqForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button.primary');
      const data = { name: f.name.value.trim(), contact: f.contact.value.trim(), message: f.message.value.trim() };

      btn.disabled = true; btn.textContent = 'שולח…';
      try {
        const r = await fetch('https://formsubmit.co/ajax/' + TO, { method: 'POST', referrerPolicy: 'origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
