/* ---------- תיקון: קבועות שעוד לא ירדו החודש, וקבועות שנרשמות רק מהחודש שבו הוגדרו ----------
   1. בגרף "הכנסות מול הוצאות": בחודש הנוכחי מופיע גם מה שעוד צפוי מהקבועות (עמודה בהירה מקווקוות)
   2. בכרטיסי ההכנסות וההוצאות: "+ צפוי עוד ..." עם שם הקבועה והיום שלה
   3. קבועה שנרשמת רק מאמצע השנה: הודעה עם כפתור לרישום גם מתחילת השנה (בלי כפילויות)
   4. בטופס הקבועה: כפתורים מהירים "מתחילת השנה" / "מהחודש הזה" ליד "רישום מחודש" */

// הקבועות שעוד צפויות החודש (היום שלהן עוד לא הגיע, ועוד לא נרשמו)
function recPendingNow(type) {
  const now = new Date(), cur = monthKey(now), mm = now.getMonth() + 1, dim = new Date(now.getFullYear(), mm, 0).getDate();
  return S.recurring.filter(r => r.active && r.type === type && !(r.endMonth && r.endMonth < cur) && !(r.startMonth && r.startMonth > cur) &&
    (!r.months || r.months.includes(mm)) && Math.min(r.day, dim) > now.getDate() &&
    !S.transactions.some(t => t.recurringId === r.id && t.date.startsWith(cur))).sort((a, b) => a.day - b.day);
}

barChart = function (end) {
  const cur = monthKey(new Date());
  const ms = []; for (let i = 11; i >= 0; i--) ms.push(shiftMonth(end, -i));
  const data = ms.map(k => { const x = k === cur ? recExpected(k) : { inc: 0, exp: 0 }; return { k, i: sumMonth(k, 'income'), e: sumMonth(k, 'expense'), xi: x.inc, xe: x.exp }; });
  const max = Math.max(1, ...data.map(d => Math.max(d.i + d.xi, d.e + d.xe)));
  const W = 720, H = 240, pt = 10, pb = 26, ch = H - pt - pb, cw = W / 12, bw = Math.min(20, cw / 3);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="הכנסות מול הוצאות לפי חודש">`;
  for (let g = 0; g <= 4; g++) { const y = pt + ch * g / 4; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="grid"/>`; }
  let anyExp = false;
  data.forEach((d, idx) => {
    const cx = W - idx * cw - cw / 2; // הסדר מימין לשמאל
    const hi = d.i / max * ch, he = d.e / max * ch, hxi = d.xi / max * ch, hxe = d.xe / max * ch;
    s += `<rect x="${cx + 1}" y="${pt + ch - hi}" width="${bw}" height="${hi}" rx="3" fill="var(--inc)" class="bc-bar" data-gm="${d.k}"><title>${monthName(d.k)} · הכנסות ${money(d.i)}</title></rect>`;
    s += `<rect x="${cx - bw - 1}" y="${pt + ch - he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)" class="bc-bar" data-gm="${d.k}"><title>${monthName(d.k)} · הוצאות ${money(d.e)}</title></rect>`;
    if (hxi > 0) { anyExp = true; s += `<rect x="${cx + 1.5}" y="${pt + ch - hi - hxi}" width="${bw - 1}" height="${hxi}" rx="3" class="bc-exp inc" data-gm="${d.k}"><title>${monthName(d.k)} · הכנסות קבועות שעוד צפויות ${money(d.xi)}</title></rect>`; }
    if (hxe > 0) { anyExp = true; s += `<rect x="${cx - bw - 0.5}" y="${pt + ch - he - hxe}" width="${bw - 1}" height="${hxe}" rx="3" class="bc-exp exp" data-gm="${d.k}"><title>${monthName(d.k)} · הוצאות קבועות שעוד צפויות ${money(d.xe)}</title></rect>`; }
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${monthName(d.k, 'short')}</text>`;
  });
  return s + '</svg>' + (anyExp ? '<p class="sub bc-exp-note"><span class="bc-exp-key"></span> עמודה בהירה מקווקוות = קבועות שעוד צפויות החודש (נרשמות ביום שלהן)</p>' : '');
};

// קבועות שנרשמות רק מאמצע השנה: החודשים החסרים מתחילת השנה, רק כשאין באותו חודש עסקה באותו סכום (כדי לא לכפול ייבוא מהבנק)
function lateRecMissing(r, from) {
  const cur = monthKey(new Date()), out = [];
  if (!r.active || !r.startMonth || r.startMonth <= from) return out;
  for (let m = from; m < r.startMonth && m < cur; m = shiftMonth(m, 1)) {
    if (r.endMonth && m > r.endMonth) break;
    if (r.months && !r.months.includes(+m.slice(5))) continue;
    if (S.transactions.some(t => t.type === r.type && t.date.startsWith(m) && Math.abs(t.amount - r.amount) < 1)) continue;
    out.push(m);
  }
  return out;
}
function lateRecList() {
  const from = new Date().getFullYear() + '-01';
  return S.recurring.map(r => ({ r, miss: lateRecMissing(r, from) })).filter(x => x.miss.length);
}
function lateRecCard(inDash) {
  if (S.settings.lateRecHidden === String(new Date().getFullYear())) return '';
  const L = lateRecList(); if (!L.length) return '';
  const n = L.reduce((a, x) => a + x.miss.length, 0), first = L.map(x => x.r.startMonth).sort()[0];
  const names = L.slice(0, 4).map(x => `<b>${esc(x.r.note || x.r.category)}</b> (מ${monthName(x.r.startMonth)})`).join(' · ') + (L.length > 4 ? ` ועוד ${L.length - 4}` : '');
  const btns = `<button type="button" class="btn sm primary" data-action="lateRecFill">📅 לרשום גם מתחילת השנה (${n} רישומים)</button>${inDash ? '<button type="button" class="btn sm" data-tab="rec">לקבועות</button>' : ''}`;
  const body = `${L.length === 1 ? 'קבועה אחת נרשמת' : `${L.length} קבועות נרשמות`} רק מהחודש שבו הוגדרו, ולכן החודשים שלפני כן ריקים בגרף ובסיכומים: ${names}.
    <br><span class="sub" style="margin:0">אפשר לרשום אותן גם בחודשים החסרים מינואר. חודש שכבר יש בו עסקה באותו סכום (למשל מייבוא מהבנק) לא נרשם שוב.</span>`;
  return `<div class="nudge info late-rec" data-nu="lateRec"><span class="nu-ico" aria-hidden="true">🗓️</span><div class="nu-body"><b>החודשים מתחילת השנה עוד לא מלאים</b><div class="nu-txt">${body}</div><div class="nu-act">${btns}</div></div>
    <button type="button" class="nu-x" data-action="lateRecHide" title="הסתרה" aria-label="הסתרת ההודעה">✕</button></div>`;
}

// הדשבורד: הודעת "מתחילת השנה", ו"צפוי עוד" בכרטיסי ההכנסות וההוצאות
const _dashViewFix = VIEWS.dash;
VIEWS.dash = () => {
  let h = _dashViewFix();
  const cur = monthKey(new Date());
  if (ui.period !== 'year' && ui.month === cur) {
    const mm = new Date().getMonth() + 1;
    [['income', 's-inc'], ['expense', 's-exp']].forEach(([type, cls]) => {
      const p = recPendingNow(type); if (!p.length) return;
      const sum = p.reduce((a, r) => a + r.amount, 0), who = p.slice(0, 2).map(r => `${esc(r.note || r.category)} ב־${r.day}/${mm}`).join(', ') + (p.length > 2 ? ` ועוד ${p.length - 2}` : '');
      h = h.replace(new RegExp(`(<div class="stat ${cls}">[\\s\\S]*?<div class="cmp">)`), `$1<span class="exp-more" title="קבועות שהיום שלהן עוד לא הגיע. הן נרשמות לבד ביום שלהן">+ צפוי עוד ${money(sum)} (${who})</span><br>`);
    });
  }
  const late = lateRecCard(true);
  if (late) {
    const idx = ['<div class="nudge', '<section class="card first-steps', '<section class="card forecast', '<div class="stats">'].map(a => h.indexOf(a)).filter(i => i >= 0).sort((a, b) => a - b)[0];
    if (idx >= 0) h = h.slice(0, idx) + late + h.slice(idx);
  }
  return h;
};
const _recViewFix = VIEWS.rec;
VIEWS.rec = () => { const h = _recViewFix(), late = lateRecCard(false); if (!late) return h; const i = h.indexOf('<section'); return i >= 0 ? h.slice(0, i) + late + h.slice(i) : late + h; };

/* ---------- תיקון: עסקה שבהערה שלה כתוב חודש אחר מהתאריך ----------
   משתמש רשם "משכורת ינואר" בלי לשנות את שדה התאריך (שנשאר על היום), ולכן כל ההכנסות נרשמו בחודש הנוכחי.
   1. ברישום חדש (טופס העסקה והרישום המהיר): שאלה "לרשום בינואר?", והתאריך מתוקן לפני השמירה
   2. עסקאות שכבר נרשמו כך: הודעה בדשבורד ובמסך העסקאות עם כפתור להעברה לחודש שכתוב בהערה */
const NM_NAMES = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
const NM_RE = new RegExp(`(?:^|[^\\u0590-\\u05FF])[ולבהמש]?(${NM_NAMES.join('|')}|מרס)(?![\\u0590-\\u05FF])(?:\\s*['׳]?(\\d{2,4}))?`);
// החודש שכתוב בהערה (1-12) ושנה אם נכתבה, או null
function noteMonth(note) {
  const m = NM_RE.exec(note || ''); if (!m) return null;
  let y = m[2] ? +m[2] : null; if (y && y < 100) y += 2000; if (y && (y < 2000 || y > 2100)) y = null;
  return { mi: m[1] === 'מרס' ? 3 : NM_NAMES.indexOf(m[1]) + 1, y, name: m[1] === 'מרס' ? 'מרץ' : m[1] };
}
// התאריך המתאים לחודש שבהערה: אותה שנה, או השנה הקודמת אם החודש עוד לא הגיע
function noteMonthDate(note, date) {
  const nm = noteMonth(note); if (!nm || !/^\d{4}-\d{2}-\d{2}$/.test(date || '')) return null;
  const dy = +date.slice(0, 4), dm = +date.slice(5, 7), dd = +date.slice(8, 10);
  if (nm.mi === dm && (!nm.y || nm.y === dy)) return null;
  const y = nm.y || (nm.mi <= dm ? dy : dy - 1), dim = new Date(y, nm.mi, 0).getDate();
  return { date: `${y}-${pad(nm.mi)}-${pad(Math.min(dd, dim))}`, label: `${nm.name} ${y}` };
}

function pmDonut(list) {

  const top = list.slice(0, 6), rest = list.slice(6).reduce((a, x) => a + x[1], 0);
  if (rest > 0) top.push(['אחר', rest]);

    const s = `<circle class="pm-arc" r="${R}" cx="110" cy="110" fill="none" stroke="${PM_COLORS[i % 8]}" stroke-width="34" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" style="--d:${i * 90}ms"/>`;
    off += len; return s;
  }).join('');
  return `<div class="pm-donut"><svg viewBox="0 0 220 220" role="img" aria-label="חלוקת ההוצאות לפי קטגוריות"><g transform="rotate(-90 110 110)">${arcs}</g>

        el.querySelector('.req-done button').addEventListener('click', close);
      } catch (err) {
        btn.disabled = false; btn.textContent = 'שליחה';
        msg(`השליחה לא הצליחה (אולי אין חיבור לאינטרנט). אפשר <a href="${mailto(data.name + ':\n' + data.message + (data.contact ? '\n' + data.contact : ''))}">לשלוח את ההודעה במייל</a>.`, true);
      }
    });
    setTimeout(() => el.querySelector('input').focus(), 50);
  }
  $('#reqOpen').addEventListener('click', openReq);
  window.reqPost = body => fetch('https://formsubmit.co/ajax/' + TO, { method: 'POST', referrerPolicy: 'origin', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) });
})();
/* ---------- שלב 7: פרטי מסך בפנייה (בלי נתונים כספיים) וסקר קצר ---------- */
(function () {
  const APPN = /דירה/.test(document.title) ? 'דירה חדשה' : 'כספי הבית', KEY = /דירה/.test(document.title) ? 'dira' : 'kaspei';
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  // שגיאות והודעות אחרונות – רק לצורך "פרטי המסך"
  const lastErr = [], lastToast = [];
  const keep = (a, v) => { a.push(v); if (a.length > 3) a.shift(); };
  window.addEventListener('error', e => keep(lastErr, String(e.message || '').slice(0, 140)));
  window.addEventListener('unhandledrejection', e => keep(lastErr, String((e.reason && e.reason.message) || e.reason || '').slice(0, 140)));
  const tEl = document.getElementById('toast');
  if (tEl) new MutationObserver(() => { const t = tEl.textContent.trim(); if (t && t !== lastToast[lastToast.length - 1]) keep(lastToast, t.slice(0, 120)); }).observe(tEl, { childList: true, characterData: true, subtree: true });
  // הסתרה: כל ספרה הופכת ל-#, וכל טקסט במירכאות (שמות, תיאורים) מוסתר
  const mask = s => String(s || '').replace(/\s+/g, ' ').trim().replace(/["“”״][^"“”״]{0,80}["“”״]/g, '"…"').replace(/\d/g, '#').slice(0, 70);
  function snapText() {
    const v = document.getElementById('view'), L = [];
    const h1 = v && v.querySelector('h1');
    L.push('תוכנה: ' + APPN + ' (גרסת קישור)');
    L.push('מסך: ' + (h1 ? mask(h1.textContent) : '—') + (typeof ui !== 'undefined' ? ` [${mask(ui.tab || '')}${ui.homeTab ? '/' + mask(ui.homeTab) : ''}]` : ''));
    const h2 = v ? [...v.querySelectorAll('h2')].map(h => mask(h.textContent)).filter(Boolean).slice(0, 12) : [];
    if (h2.length) L.push('חלקים במסך: ' + h2.join(' | '));
    const dlg = [...document.querySelectorAll('.auth:not([hidden]):not(#reqBox):not(#svyBox) h2, #wn h2')].map(h => mask(h.textContent)).filter(Boolean);
    if (dlg.length) L.push('חלון פתוח: ' + dlg.join(' | '));
    if (lastToast.length) L.push('הודעות אחרונות: ' + lastToast.map(mask).join(' | '));
    if (lastErr.length) L.push('שגיאות אחרונות: ' + lastErr.map(mask).join(' | '));
    const ua = navigator.userAgent, m = ua.match(/Edg\/(\d+)/) ? 'Edge ' + ua.match(/Edg\/(\d+)/)[1] : ua.match(/Chrome\/(\d+)/) ? 'Chrome ' + ua.match(/Chrome\/(\d+)/)[1] : ua.match(/Firefox\/(\d+)/) ? 'Firefox ' + ua.match(/Firefox\/(\d+)/)[1] : /Safari/.test(ua) ? 'Safari' : 'אחר';
    L.push(`דפדפן: ${m} · ${/Android|iPhone|iPad/.test(ua) ? 'טלפון/טאבלט' : 'מחשב'} · חלון ${innerWidth}×${innerHeight}${matchMedia('(display-mode: standalone)').matches ? ' · מותקן כאפליקציה' : ''}`);
    return L.join('\n');
  }
  // ההודעה עצמה נשלחת בקוד הקיים; כאן רק מוסיפים לה את פרטי המסך כשהמשתמש בחר בכך
  let pendingSnap = null;
  const _fetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (pendingSnap && typeof url === 'string' && url.includes('formsubmit.co/ajax/') && opts && typeof opts.body === 'string') {
      try { const b = JSON.parse(opts.body); if (b['הודעה'] !== undefined) { b['פרטי המסך (בלי סכומים)'] = pendingSnap; opts = Object.assign({}, opts, { body: JSON.stringify(b) }); } } catch (e) {}
      pendingSnap = null;
    }
    return _fetch(url, opts);
  };
  const reqBtn = document.getElementById('reqOpen');
  // החלון נבנה במאזין הקיים, ולכן מוסיפים את החלק החדש מיד אחריו
  if (reqBtn) reqBtn.addEventListener('click', () => setTimeout(() => {
    const f = document.getElementById('reqForm'); if (!f || f.querySelector('.req-snap')) return;
    const snap = snapText(), box = document.createElement('div'); box.className = 'req-snap';
    box.innerHTML = `<label class="req-snap-chk"><input type="checkbox" name="snap" checked> 📸 לצרף את פרטי המסך שאני נמצא בו – בלי סכומים, בלי שמות ובלי נתונים</label>
      <details><summary>מה בדיוק יישלח?</summary><pre class="req-snap-pre"></pre></details>
      <button type="button" class="req-svy-link">📋 או: למלא סקר קצר (חצי דקה)</button>`;
    box.querySelector('pre').textContent = snap;
    f.insertBefore(box, f.querySelector('#reqMsg'));
    box.querySelector('.req-svy-link').addEventListener('click', () => { const b = document.getElementById('reqBox'); if (b) b.remove(); openSurvey(); });
    // שלב הלכידה רץ לפני מאזין השליחה הקיים
    f.addEventListener('submit', () => { pendingSnap = f.elements.snap && f.elements.snap.checked ? snap : null; }, true);
  }, 0));

  /* סקר קצר: מוצג פעם אחת אחרי 10 ימי שימוש, ואפשר לפתוח אותו מחלון הפניות */
  const FEAT = APPN === 'כספי הבית'
    ? ['לוח הבקרה', 'רישום הוצאות והכנסות', 'ייבוא מהבנק והאשראי', 'תקציב', 'מעשרות', 'דוחות', 'תכנון וחיסכון', 'מבט מהיר']
    : ['משימות', 'חוזה ותשלומים', 'הוצאות', 'הלוואות ומימון', 'אנשי קשר', 'מיילים וקבצים', 'ציוד לדירה', 'ליקויים למסירה'];
  function openSurvey() {
    if (document.getElementById('svyBox')) return;
    const el = document.createElement('div'); el.className = 'auth'; el.id = 'svyBox';
    el.innerHTML = `<div class="auth-card svy-card"><form id="svyForm"><h2>📋 סקר קצר – ${APPN}</h2>
      <p class="sub" style="text-align:center;margin:0">חצי דקה, בלי שם ובלי נתונים. עוזר לשפר את התוכנה 🙏</p>
      <fieldset class="svy-q"><legend>כמה התוכנה עוזרת לכם?</legend><div class="svy-stars">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="stars" value="${n}"><span>${'★'.repeat(n)}</span></label>`).join('')}</div></fieldset>
      <fieldset class="svy-q"><legend>מה הכי שימושי? (אפשר כמה)</legend><div class="svy-opts">${FEAT.map(x => `<label><input type="checkbox" name="feat" value="${x}"> ${x}</label>`).join('')}</div></fieldset>
      <label>מה חסר, או מה היה עוזר לכם?<textarea name="miss" rows="3" maxlength="1000" placeholder="רשות"></textarea></label>
      <fieldset class="svy-q"><legend>הייתם ממליצים לחברים?</legend><div class="svy-opts">${['כן', 'אולי', 'לא'].map(x => `<label><input type="radio" name="rec" value="${x}"> ${x}</label>`).join('')}</div></fieldset>
      <label>איך הגעתם לתוכנה?<select name="src"><option value="">—</option><option>חבר או משפחה</option><option>ישעיה גליק</option><option>קהילה או בית כנסת</option><option>אחר</option></select></label>
      <div class="auth-msg" id="svyMsg" hidden></div>
      <button class="btn primary">שליחה</button><button type="button" class="btn" data-x>סגירה</button></form></div>`;
    document.body.appendChild(el);
    const close = () => el.remove();
    el.querySelector('[data-x]').addEventListener('click', close);
    el.addEventListener('click', e => { if (e.target === el) close(); });
    el.querySelector('#svyForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button.primary'), m = el.querySelector('#svyMsg');
      const err = t => { m.hidden = false; m.className = 'auth-msg err'; m.textContent = t; };
      const stars = (f.querySelector('[name=stars]:checked') || {}).value;
      if (!stars) return err('צריך לבחור כמה כוכבים');
      if (typeof window.reqPost !== 'function') return err('השליחה לא זמינה כרגע');
      btn.disabled = true; btn.textContent = 'שולח…';
      const body = { 'תוכנה': APPN, 'כמה עוזרת (1–5)': stars, 'הכי שימושי': [...f.querySelectorAll('[name=feat]:checked')].map(x => x.value).join(', ') || '—',
        'מה חסר': f.miss.value.trim() || '—', 'ממליצים': (f.querySelector('[name=rec]:checked') || {}).value || '—', 'איך הגיעו': f.src.value || '—',
        _subject: 'סקר קצר – ' + APPN, _template: 'table', _captcha: 'false' };
      try {
        const r = await window.reqPost(body), d = await r.json().catch(() => ({}));
        if (!r.ok || String(d.success) === 'false') throw new Error('failed');
        ls.set('sai_survey_' + KEY, 'done');
        el.querySelector('.auth-card').innerHTML = '<div class="req-done"><h2>✅ תודה רבה!</h2><p>התשובות התקבלו.</p><button class="btn primary" type="button">סגירה</button></div>';
        el.querySelector('.req-done button').addEventListener('click', close);
        const bar = document.getElementById('svyBar'); if (bar) bar.remove();
      } catch (x) { btn.disabled = false; btn.textContent = 'שליחה'; err('השליחה לא הצליחה (אולי אין חיבור לאינטרנט). אפשר לנסות שוב מאוחר יותר.'); }
    });
    setTimeout(() => { const i = el.querySelector('input'); if (i) i.focus(); }, 50);
  }
  window.openSurvey = openSurvey;
  // ההזמנה לסקר: פס קטן בתחתית, אחרי 10 ימים מהשימוש הראשון. "לא עכשיו" = עוד שבועיים, "לא להציג שוב" = לעולם
  const FIRST = 'sai_first_use_' + KEY, SV = 'sai_survey_' + KEY;
  if (!ls.get(FIRST)) ls.set(FIRST, new Date().toISOString().slice(0, 10));
  function surveyBar() {
    const st = ls.get(SV) || '', first = ls.get(FIRST), now = new Date().toISOString().slice(0, 10);
    if (st === 'done' || st === 'never' || (st && st > now) || document.getElementById('svyBar')) return;
    if (!first || (Date.parse(now) - Date.parse(first)) / 864e5 < 10) return;
    const lock = document.getElementById('lock'); if (lock && !lock.hidden) return setTimeout(surveyBar, 30000);
    const b = document.createElement('div'); b.id = 'svyBar'; b.className = 'svy-bar'; b.setAttribute('role', 'region'); b.setAttribute('aria-label', 'הזמנה לסקר');
    b.innerHTML = `<span>📋 סקר קצר (חצי דקה) – עוזר לשפר את ${APPN}</span><button type="button" class="btn sm primary" data-s="go">למילוי</button><button type="button" class="btn sm" data-s="later">לא עכשיו</button><button type="button" class="btn sm" data-s="never">לא להציג שוב</button>`;
    b.addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.s; if (!a) return;
      if (a === 'go') openSurvey();
      else { if (a === 'later') { const d = new Date(); d.setDate(d.getDate() + 14); ls.set(SV, d.toISOString().slice(0, 10)); } else ls.set(SV, 'never'); b.remove(); }
    });
    document.body.appendChild(b);
  }
  setTimeout(surveyBar, 15000);
  window.surveyBar = surveyBar;
})();
</script>
