/* ---------- 3. תחזית לסוף החודש ---------- */
function forecastCard() {
  const now = new Date(), cur = monthKey(now);
  if (ui.period === 'year' || ui.month !== cur) return '';
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), d = now.getDate(), remDays = dim - d, mm = now.getMonth() + 1;
  const incSoFar = sumMonth(cur, 'income'), expSoFar = sumMonth(cur, 'expense');
  // קבועות שעוד לא נרשמו החודש
  // (קבועה שכבר נרשמה החודש, למשל מייבוא, לא נספרת שוב)
  const pending = S.recurring.filter(r => r.active && !(r.endMonth && r.endMonth < cur) && (!r.months || r.months.includes(mm)) && Math.min(r.day, dim) > d &&
    !S.transactions.some(t => t.recurringId === r.id && t.date.startsWith(cur)));
  const recInc = pending.filter(r => r.type === 'income').reduce((a, r) => a + r.amount, 0), recExp = pending.filter(r => r.type === 'expense').reduce((a, r) => a + r.amount, 0);
  // התחזית מבוססת רק על מה שרשום בפועל ועל הקבועות שעוד צפויות, בלי הערכה של הוצאות משתנות
  const projInc = incSoFar + recInc, projExp = expSoFar + recExp, end = projInc - projExp;
  if (!incSoFar && !expSoFar && !pending.length) return '';
  const bad = end < 0;
  // פירוט שנפתח בלחיצה: מה כבר נרשם (לפי קטגוריה), ואילו קבועות עוד צפויות ומתי
  const li = (name, amt, cls) => `<div class="fc-li"><span title="${esc(name)}">${esc(name)}</span><b class="${cls}">${money(amt)}</b></div>`;
  const byCat = type => {
    const g = {}; S.transactions.filter(t => t.type === type && t.date.startsWith(cur)).forEach(t => { g[t.category || 'ללא קטגוריה'] = (g[t.category || 'ללא קטגוריה'] || 0) + t.amount; });
    return Object.entries(g).sort((a, b) => b[1] - a[1]);
  };
  const detail = type => {
    const cls = type === 'income' ? 'pos' : 'neg', done = byCat(type);
    const rec = pending.filter(r => r.type === type).sort((a, b) => a.day - b.day);
    return `<details class="fc-det" data-fc="${type}"${ui['fc_' + type] ? ' open' : ''}><summary>פירוט</summary>
      <h4>קבועות עד סוף החודש</h4>${rec.length ? rec.map(r => li(`${Math.min(r.day, dim)}/${mm} · ${r.note || r.category}`, r.amount, cls)).join('') : '<div class="sub" style="margin:0">אין</div>'}
      <h4>נרשם עד היום</h4>${done.length ? done.map(([c, v]) => li(c, v, cls)).join('') : '<div class="sub" style="margin:0">עוד לא נרשם</div>'}</details>`;
  };
  return `<section class="card forecast ${bad ? 'bad' : 'good'}"><h2>🔮 תחזית לסוף ${monthName(cur)}</h2>
    <p class="sub">לפי מה שנרשם עד היום, ועוד הקבועות שצפויות עד סוף החודש. הוצאות שעוד לא נרשמו לא נכללות.</p>
    <div class="fc-grid">
      <div><div class="lbl">הכנסות</div><b class="pos">${money(projInc)}</b><div class="sub" style="margin:0">עד היום ${money(incSoFar)}${recInc ? ` + קבועות ${money(recInc)}` : ''}</div>${detail('income')}</div>
      <div><div class="lbl">הוצאות</div><b class="neg">${money(projExp)}</b><div class="sub" style="margin:0">עד היום ${money(expSoFar)}${recExp ? ` + קבועות ${money(recExp)}` : ''}</div>${detail('expense')}</div>
      <div class="fc-end"><div class="lbl">צפוי להישאר</div><b class="${bad ? 'neg' : 'pos'}">${money(end)}</b><div class="sub" style="margin:0">${remDays} ימים לסוף החודש</div></div></div>
    ${bad ? `<div class="tip bad" style="margin-top:12px"><span class="tip-ico">⚠️</span><span>גם בלי הוצאות נוספות, צפוי מינוס של ${money(-end)} בסוף החודש.</span></div>`
      : `<div class="tip good" style="margin-top:12px"><span class="tip-ico">✅</span><span>אחרי הקבועות שעוד צפויות, נשארו ${money(end)} להוצאות נוספות עד סוף החודש.</span></div>`}</section>`;
}

const fundBal = f => (f.entries || []).reduce((a, e) => a + e.amount, 0);
// הפקדה חודשית אוטומטית לקופה (מעקב בלבד, לא נרשמת הוצאה)
function applyFundDeposits() {
  const cur = monthKey(new Date()); let ch = false;
  (S.funds || []).forEach(f => {
    if (!(f.monthly > 0)) return;
    if (!f.lastAuto) { f.lastAuto = shiftMonth(cur, -1); ch = true; }
    while (f.lastAuto < cur) { f.lastAuto = shiftMonth(f.lastAuto, 1); f.entries.push({ id: uid(), date: f.lastAuto + '-01', amount: f.monthly, note: 'הפקדה חודשית' }); ch = true; }
  });
  if (ch) save();
}

const hebPartsFmt = (() => { try { return new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { month: 'long', year: 'numeric' }); } catch (e) { return null; } })();
const hebCache = {};
function hebParts(iso) {
  if (hebCache[iso]) return hebCache[iso];
  if (!hebPartsFmt) return { y: '', m: '' };
  const [y, m, d] = iso.split('-').map(Number), parts = hebPartsFmt.formatToParts(new Date(y, m - 1, d, 12));
  const r = { y: (parts.find(p => p.type === 'year') || {}).value || '', m: ((parts.find(p => p.type === 'month') || {}).value || '').replace(/^ב/, '') };
  return hebCache[iso] = r;
}
const hebKey = iso => { const p = hebParts(iso); return `${p.m} ${p.y}`; };
// חודשים עבריים שיש בהם עסקאות, לפי סדר הזמן
function hebMonthsInData() {
  const seen = new Map();
  [...S.transactions.map(t => t.date), today()].sort().forEach(d => { const k = hebKey(d); if (!seen.has(k)) seen.set(k, d); });
  return [...seen.keys()].reverse();
}

// בסיס החישוב: הכנסות (בלי קטגוריות שהוחרגו) פחות הוצאות שהוגדרו כמנוכות
function maaserCalc(prefix) {
  const st = S.settings, exInc = st.maaserExcludeInc || [], ded = st.maaserDeduct || [];
  const inTx = t => !prefix || t.date.startsWith(prefix);
  const inc = S.transactions.filter(t => t.type === 'income' && inTx(t) && !exInc.includes(t.category)).reduce((a, t) => a + t.amount, 0);
  const deduct = S.transactions.filter(t => t.type === 'expense' && inTx(t) && ded.includes(t.category)).reduce((a, t) => a + t.amount, 0);
  // תוספת מרצון מעבר לאחוז: סכום שנרשם לכל חודש ומתווסף לנדרש באותו חודש
  const extra = Object.entries(st.maaserExtra || {}).filter(([m]) => !prefix || m.startsWith(prefix)).reduce((a, [, v]) => a + (+v || 0), 0);
  const base = Math.max(0, inc - deduct), pctDue = base * st.maaserPct / 100, due = pctDue + extra;
  const given = S.transactions.filter(t => t.type === 'expense' && inTx(t) && t.category === st.maaserCategory).reduce((a, t) => a + t.amount, 0);
  return { inc, deduct, base, pctDue, extra, due, given, bal: given - due };
}

/* ---------- 8. נעילה בסיסמה (הצפנה) ---------- */
// הנתונים נשמרים מוצפנים (AES-GCM) עם מפתח שנגזר מהסיסמה. בלי הסיסמה אי אפשר לקרוא אותם
let CRYPT = null; // { key, salt }
// המרה ל־base64 בחתיכות, כדי שגם נתונים גדולים (אלפי עסקאות) לא יקרסו
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptState(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, CRYPT.key, new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({ __enc: 1, salt: b64e(CRYPT.salt), iv: b64e(iv), ct: b64e(ct) });
}
async function decryptState(raw, pass) {
  const o = JSON.parse(raw), salt = b64d(o.salt), key = await deriveKey(pass, salt);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(o.iv) }, key, b64d(o.ct));
  CRYPT = { key, salt };
  return JSON.parse(new TextDecoder().decode(pt));
}
let encChain = Promise.resolve();
function persist() {
  if (!CRYPT) { fileSave(JSON.stringify(S)); return; }
  const snap = JSON.parse(JSON.stringify(S));
  encChain = encChain.then(async () => { try { fileSave(await encryptState(snap)); } catch (e) { toast('השמירה נכשלה'); } });
}
function lockSection() {

  const on = !!CRYPT;
  return `<section class="card"><h2>🔒 נעילה בסיסמה</h2>

    <form id="lockForm" class="grid-form">
      ${on ? '<label>הסיסמה הנוכחית<input name="cur" type="password" required autocomplete="current-password"></label>' : ''}
      <label>${on ? 'סיסמה חדשה' : 'סיסמה'}<input name="p1" type="password" minlength="6" ${on ? '' : 'required'} autocomplete="new-password"></label>
      <label>אימות הסיסמה<input name="p2" type="password" minlength="6" ${on ? '' : 'required'} autocomplete="new-password"></label>
      <div class="actions"><button class="btn primary">${on ? 'החלפת סיסמה' : 'הפעלת נעילה'}</button>
        ${on ? '<button type="button" class="btn" data-action="lockNow">נעילה עכשיו</button><button type="button" class="btn danger" data-action="lockOff">ביטול הנעילה</button>' : ''}</div></form></section>`;
}
async function verifyCurrent(pass) {
  try { await decryptState(FILE.raw, pass); return true; } catch (e) { return false; }
}
function bindLock() {
  const f = $('#lockForm'); if (!f) return;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (CRYPT && !(await verifyCurrent(f.cur.value))) return toast('הסיסמה הנוכחית שגויה');
    if (f.p1.value.length < 6) return toast('הסיסמה צריכה להכיל לפחות 6 תווים');
    if (f.p1.value !== f.p2.value) return toast('הסיסמאות לא זהות');
    const salt = crypto.getRandomValues(new Uint8Array(16));
    CRYPT = { key: await deriveKey(f.p1.value, salt), salt };
    persist(); await encChain; rememberKey(); resetIdle(); render(); toast('הנעילה הופעלה. זכרו את הסיסמה!');
  });
}

// הצגה במסך ובהדפסה
function docCell(c, kind) {

  if (k === 'bar') return `<td><div class="bar"><span style="width:${Math.min(100, v * 100).toFixed(1)}%"></span></div><span class="heb">${(v * 100).toFixed(0)}%</span></td>`;
  if (k === 'pct') return `<td class="amount">${(v * 100).toFixed(0)}%</td>`;
  if (typeof v === 'number' && (k === 'money' || k === 'inc' || k === 'exp')) return `<td class="amount ${k === 'inc' ? 'pos' : k === 'exp' ? 'neg' : v < 0 ? 'neg' : ''}">${money(v)}</td>`;

function docHtml(doc) {

// אותו מסמך כקובץ אקסל: גיליון "סיכום" ועוד גיליון לכל טבלה
function docXlsx(doc) {

    if (v === '' || v === null || v === undefined) return { v: '', s: tot ? XS.totText : XS.text };
    if (k === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return { d: v };
    if (k === 'bar' || k === 'pct') return { v: +v, s: tot ? XS.totPct : XS.pct };

      merges: [`A1:${colL(Math.max(cols.length - 1, 3))}1`, `A2:${colL(Math.max(cols.length - 1, 3))}2`], filter: n ? `A4:${colL(cols.length - 1)}${4 + n}` : null, rows };

// סנכרון בין לשוניות: כשהתוכנה פתוחה בכמה לשוניות ונשמר שינוי באחת, השאר טוענות את הנתונים החדשים.
// בלי זה, לשונית ישנה הייתה שומרת את הנתונים הישנים שלה ומוחקת את העדכון
// כשחוזרים לחלון: אם הקובץ השתנה בינתיים מחלון אחר, טוענים את הגרסה העדכנית
window.addEventListener('focus', async () => {
  if (FILE.busy || FILE.pending !== null || !$('#lock').hidden) return;
  try {
    const d = await (await fetch(DATA_API)).json();
    if (d.v !== FILE.v && d.data) { FILE.raw = d.data; FILE.v = d.v; await applyFileRaw(); toast('הנתונים עודכנו מחלון אחר'); }
  } catch (e) {}
});

document.addEventListener('click', e => {
  // כפתור עם data-action מטפל בעצמו. data-tab שלו הוא פרמטר של הפעולה (כמו לשוניות "דירה חדשה"),
  // ולא בקשה לעבור ללשונית ראשית — לכן בודקים קודם data-action
  const act = e.target.closest('[data-action]');
  if (act && ACTIONS[act.dataset.action]) {
    try { ACTIONS[act.dataset.action](act); }
    catch (err) { console.error('שגיאה בפעולה ' + act.dataset.action, err); toast('הפעולה נכשלה: ' + String((err && err.message) || err)); }
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; ui.editTx = null; ui.editRec = null; ui.splitTx = null; render(); window.scrollTo(0, 0); }
});

// גרירת קובץ שנשמר במחשב (מייל .eml, PDF או תמונה) אל התוכנה – מכל מקום בלשונית דירה חדשה
document.addEventListener('dragover', e => { if ([...((e.dataTransfer || {}).types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (![...((e.dataTransfer || {}).types || [])].includes('Files')) return;
  if (e.target.closest && e.target.closest('#hDrop')) return;  // אזור הגרירה בלשונית כבר מטפל בזה
  e.preventDefault(); window.homeDrop(e.dataTransfer);
});

// שגיאת תצוגה: לא מפילים את כל הדף. מציגים הודעה, והשאר ממשיך לעבוד
function renderError(e) {
  console.error('שגיאה בתצוגה של ' + ui.tab, e);
  return `<section class="card"><h2>⚠️ לא הצלחנו להציג את המסך הזה</h2>
    <p class="sub">הדף נשאר פעיל. אפשר לעבור ללשונית אחרת ולחזור לכאן.</p>
    <div class="tip bad"><span class="tip-ico">⚠️</span><span dir="ltr" style="font-family:monospace;font-size:12px;word-break:break-word">${esc(String((e && e.message) || e))}</span></div>
    <div class="actions"><button class="btn primary" data-action="renderAgain">🔄 ניסיון נוסף</button></div></section>`;
}
function render() {
  document.querySelectorAll('aside [data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
  let html;
  try { html = VIEWS[ui.tab](); }
  catch (e) { html = renderError(e); }
  $('#view').innerHTML = html;
  // קריסה של מאזין אחד לא מונעת רישום של האחרים: כל צירוף עטוף בנפרד
  if (BIND[ui.tab]) { try { BIND[ui.tab](); } catch (e) { console.error('שגיאה בקישור המסך ' + ui.tab, e); } }
}

// היתרה שנותר לחלק בפיצול מתעדכנת בזמן הקלדה
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('sp-amt')) splitUpdate(); });


function startApp() {
  removeSampleData();
  cleanCategories();
  save();
  applyRecurring();
  applyLiabilityPayments();
  // מסך הקופות הוסר מהתפריט, ולכן גם ההפקדה האוטומטית לקופות כבויה. הנתונים הקיימים נשארים שמורים
  render();
  resetIdle();
  autoBackupOnStart();
}
// הפעלה מוגנת: גם אם שלב אוטומטי נכשל, המסך מוצג והכפתורים מחווטים. מחזיר true אם ההצגה הצליחה
function safeStart() {
  try { startApp(); return true; }
  catch (e) {
    console.error('שגיאה בהפעלת התוכנה', e);
    try { render(); resetIdle(); return true; } catch (e2) { console.error(e2); return false; }
  }
}
(async function boot() {
  // הנתונים נטענים מהקובץ במחשב דרך השרת. בלי השרת אין נתונים, ולכן מציגים הסבר במקום תוכנה ריקה
  try {
    // קודם אימות: אם הדפדפן הזה לא מאושר, צריך קוד מהמייל
    const a = await (await fetch('http://127.0.0.1:8772/api/auth')).json();
    if (a.enabled && !a.ok) await authScreen(a.to);
    const d = await (await fetch(DATA_API)).json();
    if (d.error) throw new Error(d.error);
    FILE.raw = d.data; FILE.v = d.v;
  } catch (e) {
    const el = $('#lock'); el.hidden = false;
    el.innerHTML = `<div class="auth-card"><div class="logo auth-logo"><span class="logo-ico">₪</span>כספי הבית</div><form onsubmit="return false">
      <h2>צריך לפתוח מקיצור הדרך</h2><p class="sub" style="text-align:center">הנתונים שמורים בקובץ במחשב, ושרת התוכנה לא פועל כרגע.<br>סגרו את החלון ופתחו את התוכנה מקיצור הדרך <b>"כספי הבית"</b> בשולחן העבודה.</p>
      <button class="btn primary" type="button" onclick="location.reload()">ניסיון חוזר</button></form></div>`;
    return;
  }
  // נתונים ישנים שנשמרו בכרום בפרופיל הזה: לא מוחקים אותם בלי לשאול. מציעים להעביר אותם לקובץ
  let old = null; try { old = localStorage.getItem(STORE); } catch (e) {}
  if (old && old !== FILE.raw) {
    let info = 'מוצפנים בסיסמה';
    try { const o = JSON.parse(old); if (!o.__enc) { const ds = (o.transactions || []).map(t => t.date).sort();
      info = `${(o.transactions || []).length} עסקאות, ${(o.recurring || []).length} קבועות, העסקה האחרונה מ־${ds.length ? gregDate(ds[ds.length - 1]) : '—'}`; } } catch (e) {}
    let cur = 'ריק'; try { const c = JSON.parse(FILE.raw || '{}'); if (!c.__enc) cur = `${(c.transactions || []).length} עסקאות`; else cur = 'מוצפן'; } catch (e) {}
    if (confirm(`נמצאו בדפדפן הזה נתונים מהגרסה הקודמת של האתר:\n${info}\n\nבקובץ במחשב יש עכשיו: ${cur}.\n\nלהעביר אותם לגרסה החדשה?\n(העותק הקודם של הקובץ נשמר בתיקייה "גיבויים אוטומטיים")\n\nאישור = להחליף · ביטול = להשאיר את הקובץ כמו שהוא`)) {
      try {
        const r = await (await fetch(DATA_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: old, base: FILE.v, keepPrev: true }) })).json();
        if (!r.ok) throw new Error(r.error || 'conflict');
        FILE.raw = old; FILE.v = r.v; try { localStorage.removeItem(STORE); } catch (e) {}
        alert('הנתונים הועברו לקובץ במחשב.');
      } catch (e) { alert('ההעברה נכשלה. הנתונים נשארו בכרום ולא נמחקו.'); }
    } else if (confirm('למחוק את הנתונים הישנים מהפרופיל הזה של כרום?\nאישור = למחוק לצמיתות · ביטול = להשאיר אותם בכרום (אפשר להחליט בפעם הבאה)')) {
      try { localStorage.removeItem(STORE); } catch (e) {}
    }
  }
  if (FILE.raw && FILE.raw.startsWith('{"__enc"')) {
    // קובץ מוצפן נפתח תמיד עם סיסמה. "סיסמה שגויה" שבמסך הנעילה = הסיסמה לא נכונה
    if (await tryRemembered()) { if (!safeStart()) lockScreen(); } else lockScreen();
  } else { forgetKey(); S = load(); safeStart(); }
})();
/* ---------- פנייה לשדרוג או הצעה: חלון קטן ששולח הודעה למייל ---------- */
(function () {
  const TO = 'aa0504168687@gmail.com';
  const mailto = t => `mailto:${TO}?subject=${encodeURIComponent('פנייה לשדרוג – כספי הבית')}&body=${encodeURIComponent(t || '')}`;
  function openReq() {
    if ($('#reqBox')) return;
    const el = document.createElement('div'); el.className = 'auth'; el.id = 'reqBox';
    el.innerHTML = `<div class="auth-card"><form id="reqForm"><h2>💬 פנייה לשדרוג או הצעה</h2>
      <p class="sub" style="text-align:center;margin:0">ההודעה תגיע ישירות לישעיה גליק</p>
      <label>שם<input name="name" required maxlength="60" autocomplete="name"></label>
      <label>טלפון או מייל לחזרה (רשות)<input name="contact" maxlength="80" dir="ltr" autocomplete="email"></label>
      <label>ההודעה<textarea name="message" required maxlength="2000" rows="5" placeholder="מה היית רוצה שיתווסף או ישתפר בתוכנה?"></textarea></label>
      <div class="auth-msg" id="reqMsg" hidden></div>
      <button class="btn primary">שליחה</button><button type="button" class="btn" data-x>סגירה</button></form></div>`;
    document.body.appendChild(el);
    const close = () => el.remove();
    el.querySelector('[data-x]').addEventListener('click', close);
    el.addEventListener('click', e => { if (e.target === el) close(); });
    const msg = (h, err) => { const m = $('#reqMsg'); m.hidden = false; m.className = 'auth-msg' + (err ? ' err' : ''); m.innerHTML = h; };
    $('#reqForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('button.primary');
      const data = { name: f.name.value.trim(), contact: f.contact.value.trim(), message: f.message.value.trim() };
      if (!data.name || !data.message) return msg('צריך לכתוב שם והודעה', true);
      btn.disabled = true; btn.textContent = 'שולח…';
      try {
        const r = await fetch('https://formsubmit.co/ajax/' + TO, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ 'שם': data.name, 'פרטי קשר': data.contact || '—', 'הודעה': data.message, _subject: 'פנייה לשדרוג – כספי הבית', _template: 'table', _captcha: 'false' }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || String(d.success) === 'false') throw new Error(d.message || 'failed');
        el.querySelector('.auth-card').innerHTML = `<div class="req-done"><h2>✅ ההודעה נשלחה</h2><p>תודה ${esc(data.name)}! ההודעה הגיעה לישעיה גליק.</p><button class="btn primary" type="button">סגירה</button></div>`;
        el.querySelector('.req-done button').addEventListener('click', close);
      } catch (err) {
        btn.disabled = false; btn.textContent = 'שליחה';
        msg(`השליחה לא הצליחה (אולי אין חיבור לאינטרנט). אפשר <a href="${mailto(data.name + ':\n' + data.message + (data.contact ? '\n' + data.contact : ''))}">לשלוח את ההודעה במייל</a>.`, true);
      }
    });
    setTimeout(() => el.querySelector('input').focus(), 50);
  }
  $('#reqOpen').addEventListener('click', openReq);
})();
</script>
</body>
