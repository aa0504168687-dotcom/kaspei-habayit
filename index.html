<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- אבטחה: חוסם כל חיבור לאינטרנט וכל טעינת קוד או קבצים מבחוץ. החריג היחיד: שרת הצ'אט שרץ במחשב הזה (127.0.0.1), שמעביר שאלות לשירות SAI -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src https://formsubmit.co; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כספי הבית</title>
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--text:#1d2433;--muted:#6b7385;--border:#e3e7ef;
  --primary:#3b5bdb;--primary-soft:#e7ecff;--side:#2f4ac0;--side-text:#e8edff;
  --inc:#2b8a3e;--inc-soft:#e6f4ea;--exp:#c92a2a;--exp-soft:#fdecec;--warn:#e67700;--warn-soft:#fff4e0;
  --shadow:0 1px 3px rgba(20,30,60,.08);--radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c;--card:#1b2029;--text:#e6e9ef;--muted:#98a1b3;--border:#2c3340;
  --primary:#748ffc;--primary-soft:#232b45;--side:#1a2240;--side-text:#d5ddff;
  --inc:#51cf66;--inc-soft:#1d3324;--exp:#ff6b6b;--exp-soft:#3a2023;--warn:#ffa94d;--warn-soft:#3a2c17;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;font-size:15px;line-height:1.5}
.layout{display:flex;min-height:100vh}

aside{width:230px;background:var(--side);color:var(--side-text);padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-size:22px;font-weight:800;margin:0 8px 18px;color:#fff}
.nav-group{font-size:12px;opacity:.7;margin:16px 10px 6px}
.nav-cats{display:flex;flex-direction:column;gap:2px}
.nav-cat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:right;max-width:100%}
.nav-cat small{font-size:11.5px;opacity:.75;white-space:nowrap;font-weight:600}
aside button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:right}
aside button:hover{background:rgba(255,255,255,.1)}
aside button.active{background:#fff;color:var(--side);font-weight:700}
@media (prefers-color-scheme:dark){aside button.active{background:var(--primary);color:#10142a}}
main{flex:1;min-width:0;padding:20px 24px 60px}

.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.topbar h1{margin:0;font-size:24px}
.dates{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.row{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-size:24px;font-weight:800;margin:4px 0}
.stat .cmp{font-size:12px;color:var(--muted)}
.pos{color:var(--inc)}.neg{color:var(--exp)}
.month-nav{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;padding:7px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#10142a}}
.btn.danger{color:var(--exp)}
.btn.sm{padding:3px 10px;font-size:13px}
.grid-form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.grid-form .wide{grid-column:1/-1}
/* פרטי התחייבות בטופס, ומעקב ההחזרים ברשימה */
.liab-only{grid-column:1/-1;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
.liab-only[hidden]{display:none}
.loan-list{display:grid;gap:12px}
.loan-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--card,#fff)}
.loan-card.done{opacity:.72}
.loan-card.late{border-color:#e0a24a;background:#fff8ec}
.loan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.loan-due{display:block;font-size:12.5px;color:#a3600d;margin-top:4px}
.loan-due.ok{color:var(--inc)}
.loan-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));margin-bottom:8px}
.loan-grid small{display:block;font-size:11.5px;color:var(--muted)}
.loan-grid b{font-size:15px}
.loan-notes{margin:0 0 8px;font-size:13px}
.loan-pay{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.pay-chip{border:1.5px solid var(--border);background:none;border-radius:14px;padding:2px 10px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.pay-chip.on{background:var(--inc);border-color:var(--inc);color:#fff}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.chk{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:13.5px;color:var(--text);cursor:pointer;padding:2px 0}
label.chk[hidden]{display:none}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);padding:8px 6px;white-space:nowrap}
td{border-bottom:1px solid var(--border);padding:8px 6px;vertical-align:middle}
td .heb{display:block;font-size:12px;color:var(--muted)}
.amount{font-weight:700;white-space:nowrap}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:20px;padding:1px 10px;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:20px 0;margin:0}
.bar{height:9px;background:var(--border);border-radius:9px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:9px}
.bar.over>span{background:var(--exp)}.bar.near>span{background:var(--warn)}.bar.done>span{background:var(--inc)}
.budget-item{margin-bottom:12px}
.budget-item .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border)}
.chart text{fill:var(--muted);font-size:12px}
.legend{list-style:none;padding:0;margin:0;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px;padding:4px 0}
.legend .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.legend .v{margin-inline-start:auto;font-weight:600}
.donut-wrap{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media (max-width:560px){.donut-wrap{grid-template-columns:1fr}.donut-wrap svg{max-width:200px;margin:auto}}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;font:inherit;color:var(--text);padding:5px 14px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
/* לשוניות קטגוריות מהירות במסך העסקאות */
.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.cat-tab{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:var(--card,#fff);border-radius:20px;padding:6px 14px;font:inherit;font-size:13.5px;color:var(--text);cursor:pointer;max-width:100%}
.cat-tab small{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.cat-tab:hover{border-color:var(--primary)}
.cat-tab.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.cat-tab.on small{color:#e8f2f0}
.goal{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.goal h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.goal .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:8px 0}
.goal .meta b{color:var(--text)}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inline input{width:130px}
.maaser{background:var(--warn-soft)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats .tag button{background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:0 0 0 2px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:10px}
#toast .btn{background:#fff;color:#312e81;border-color:#fff;font-weight:700}
@media (max-width:820px){
  .layout{flex-direction:column}
  aside{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:10px 16px;gap:4px}
  .logo,.nav-group{display:none}
  aside button{width:auto;white-space:nowrap}
  main{padding:16px}
}

/* ===== New design ===== */
:root{
  --bg:#f4f6fc;--card:#ffffff;--text:#1a1f36;--muted:#6b7190;--border:#e6e9f4;
  --primary:#4f46e5;--primary-2:#7c3aed;--primary-soft:#eef0ff;--accent:#06b6d4;
  --inc:#0f9d58;--inc-soft:#e3f6ec;--exp:#e03131;--exp-soft:#fdeaea;--warn:#f08c00;--warn-soft:#fff5e1;
  --radius:20px;--shadow:0 1px 2px rgba(20,24,60,.04),0 8px 24px rgba(20,24,60,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1020;--card:#161a2e;--text:#e8eaf6;--muted:#9aa0c0;--border:#262b47;
  --primary:#8b8cf8;--primary-2:#a78bfa;--primary-soft:#232750;--accent:#22d3ee;
  --inc:#4ade80;--inc-soft:#163325;--exp:#f87171;--exp-soft:#3b1d22;--warn:#fbbf24;--warn-soft:#3a2d12;--shadow:0 8px 24px rgba(0,0,0,.25)}
}
body{font-family:"Segoe UI Variable","Segoe UI",Rubik,Arial,sans-serif;-webkit-font-smoothing:antialiased}
aside{background:linear-gradient(170deg,#1e1b4b 0%,#3730a3 55%,#5b21b6 100%);padding:24px 14px;box-shadow:-4px 0 24px rgba(30,27,75,.18)}
@media (prefers-color-scheme:dark){aside{background:linear-gradient(170deg,#0b0d1c 0%,#1e1b4b 100%);border-left:1px solid var(--border)}}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;margin-bottom:24px}
.logo-ico{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#818cf8,#22d3ee);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 16px rgba(34,211,238,.35)}
.nav-group{text-transform:none;letter-spacing:.3px;font-weight:600}
aside button{padding:11px 14px;border-radius:13px;margin-bottom:2px;transition:background .15s,transform .15s;font-weight:500}
aside button:hover{background:rgba(255,255,255,.12);transform:translateX(-2px)}
aside button.active,aside button.active:hover{background:#fff;color:#3730a3;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:none}
@media (prefers-color-scheme:dark){aside button.active,aside button.active:hover{background:var(--primary);color:#0d1020}}
main{padding:30px 34px 70px;max-width:1320px}
.topbar h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.dates{margin-top:2px}
.month-nav{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px 8px;box-shadow:var(--shadow)}
.month-nav strong{min-width:120px;text-align:center}
.month-nav .btn{border:0;background:var(--primary-soft);color:var(--primary);font-weight:800}
.card{border-radius:var(--radius);padding:24px;transition:box-shadow .2s}
.card:hover{box-shadow:0 1px 2px rgba(20,24,60,.04),0 12px 32px rgba(20,24,60,.09)}
.card h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.card h2::before{content:"";width:5px;height:20px;border-radius:5px;background:linear-gradient(var(--primary),var(--accent));flex-shrink:0}
.card .sub{margin-top:4px}
.stats{gap:16px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;padding:20px 20px 18px 72px;border-radius:var(--radius);transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.stat::before{position:absolute;top:18px;left:18px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--primary-soft)}
.stat::after{content:"";position:absolute;bottom:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.s-flow::before{content:"⚖️"}
.s-inc::before{content:"💰";background:var(--inc-soft)}.s-inc::after{background:var(--inc)}
.s-exp::before{content:"🧾";background:var(--exp-soft)}.s-exp::after{background:var(--exp)}
.s-nw::before{content:"🏦"}
.s-hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);border:0;color:#fff}
.s-hero .lbl,.s-hero .cmp,.s-hero .cmp span{color:rgba(255,255,255,.85)!important}
.s-hero .val{color:#fff!important}
.s-hero::before{background:rgba(255,255,255,.18)}.s-hero::after{display:none}
.stat .lbl{font-weight:600}
.stat .val{font-size:28px;letter-spacing:-.5px;margin:6px 0 2px}
.btn{border-radius:12px;padding:8px 16px;font-weight:600;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border:0;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.btn.danger{border-color:transparent;background:var(--exp-soft)}
.btn.sm{padding:4px 12px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
input,select{border-radius:12px;padding:9px 12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
label{font-weight:600}
table{border-collapse:separate;border-spacing:0}
th{background:var(--bg);font-size:12.5px;border-bottom:0;padding:10px 10px}
th:first-child{border-radius:0 12px 12px 0}th:last-child{border-radius:12px 0 0 12px}
td{padding:11px 10px}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--primary-soft)}
.tag{padding:3px 12px;font-weight:600;font-size:12.5px}
.bar{height:10px;background:var(--bg);border:1px solid var(--border)}
.bar>span{background:linear-gradient(270deg,var(--primary),var(--accent))}
.bar.over>span{background:linear-gradient(270deg,#e03131,#ff8787)}
.bar.near>span{background:linear-gradient(270deg,#f08c00,#ffc078)}
.bar.done>span{background:linear-gradient(270deg,#0f9d58,#69db7c)}
.budget-item{padding:10px 0;border-bottom:1px dashed var(--border);margin:0}
.budget-item:last-of-type{border-bottom:0}
.maaser{background:linear-gradient(135deg,var(--warn-soft),var(--card) 70%)}
.maaser-total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.maaser-total .lbl{font-size:13px;color:var(--muted);font-weight:600}
.maaser-total .val{font-size:26px;font-weight:800;margin:2px 0}
.maaser-break{font-size:13px;color:var(--muted);line-height:1.7}
.maaser h2::before{background:linear-gradient(var(--warn),#ffd43b)}
.seg{background:var(--bg);border:0;padding:4px;border-radius:13px}
.seg button{border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(20,24,60,.1)}
.legend li{padding:6px 0;border-bottom:1px solid var(--border)}
.legend li:last-child{border-bottom:0}
.empty{padding:28px 0}
.cats .tag{padding:5px 12px}
#toast{border-radius:14px;background:linear-gradient(135deg,#312e81,#5b21b6);box-shadow:0 10px 30px rgba(49,46,129,.35);font-weight:600}
.months-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.months-head span{margin-inline-end:6px}
.months{display:flex;flex-wrap:wrap;gap:6px}
.mchip{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--text);font-weight:500;background:var(--card);user-select:none}
.mchip input{width:auto;margin:0;accent-color:var(--primary)}
.mchip:has(input:checked){background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
.mode-sel{width:auto;padding:4px 8px}
[hidden]{display:none!important}
/* דוחות */
.rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#1e1b4b,#4f46e5 60%,#7c3aed);color:#fff;border-radius:var(--radius);padding:24px 26px;margin-bottom:18px}
.rep-head h1{margin:6px 0 4px;font-size:28px}
.rep-head .dates{color:rgba(255,255,255,.85)}
.rep-brand{display:flex;align-items:center;gap:8px;font-weight:700;opacity:.9}
.rep-brand .logo-ico{width:30px;height:30px;border-radius:10px;font-size:15px}
.rep-date{text-align:left;font-size:13px;opacity:.85}
.tips-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--bg);border-inline-start:4px solid var(--primary);line-height:1.6}
.tip.good{border-color:var(--inc);background:var(--inc-soft)}
.tip.warn{border-color:var(--warn);background:var(--warn-soft)}
.tip.bad{border-color:var(--exp);background:var(--exp-soft)}
.tip-ico{font-size:18px;line-height:1.4}
.rep-table td .bar{margin-top:6px}
.rep-mini{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:12px;font-size:14px}
@media print{
  @page{size:A4;margin:12mm}
  :root{--bg:#fff;--card:#fff;--text:#111;--muted:#555;--border:#ddd}
  body{background:#fff}
  aside,.no-print,#toast,.btn{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:none}
  .card,.stat{box-shadow:none!important;break-inside:avoid}
  .rep-head,.stat.s-hero,.bar>span,.tip,.dup-alert{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .row{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr)}
  .sum-table tr.clickable{cursor:default}
}
/* צ'אט */
.chat-fab{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:linear-gradient(135deg,#312e81,#5b21b6);color:#fff;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(49,46,129,.35)}
.chat-fab i,.chat-ic{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal}
.chat-fab[hidden]{display:none}
.chat-panel{position:fixed;left:18px;bottom:18px;z-index:25;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 36px));display:none;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 40px rgba(20,24,60,.3);overflow:hidden}
.chat-panel.open{display:flex}
.chat-h{background:linear-gradient(135deg,#312e81,#5b21b6);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.chat-h b{display:block}.chat-h small{display:block;opacity:.85;font-size:12px}

<script>
/* ---------- Link version: instead of the server on the computer, data is stored in this browser only (IndexedDB) ----------
   Every request the app used to send to the server (127.0.0.1) is answered here, in the browser. Nothing goes out to the internet. */
(function () {
  const PORT = '8772', DB = 'kaspei-habayit-web', BASE = 'http://127.0.0.1:' + PORT + '/api/';
  const NO_MAIL = 'משיכת מיילים וחיבור הג׳ימייל זמינים רק בגרסה שמותקנת במחשב. בגרסת הקישור אפשר לצרף קבצים ותמונות ידנית.';
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const op = (store, mode, fn) => db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode), q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  const get = (s, k) => op(s, 'readonly', o => o.get(k)), put = (s, k, v) => op(s, 'readwrite', o => o.put(v, k));
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const J = (obj, status = 200, headers = {}) => new Response(JSON.stringify(obj), { status, headers: { 'Content-Type': 'application/json', ...headers } });
  const body = o => { try { return JSON.parse((o && o.body) || '{}'); } catch (e) { return {}; } };
  const MIME = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp', txt: 'text/plain', doc: 'application/msword',
    docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', xls: 'application/vnd.ms-excel' };
  const mime = n => MIME[(String(n).split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
  async function handle(path, o) {
    const method = ((o && o.method) || 'GET').toUpperCase(), qs = new URLSearchParams(path.split('?')[1] || ''); path = path.split('?')[0];
    if (path === 'auth') return J({ enabled: false, ok: true, until: 0, to: '' });
    if (path === 'status') return J({ ready: false });
    if (path === 'backups') return J({ error: 'web' }, 404);
    if (path === 'data') {
      const cur = await get('kv', 'data');
      if (method === 'GET') return J({ data: cur ? cur.raw : null, v: cur ? cur.v : '0' });
      const req = body(o);
      if (typeof req.data !== 'string' || !req.data.startsWith('{')) return J({ error: 'הבקשה לא תקינה' }, 400);
      if (cur && String(req.base) !== cur.v) return J({ conflict: true, data: cur.raw, v: cur.v });
      if (req.keepPrev && cur) await put('kv', 'prev-' + Date.now(), cur.raw);
      const v = String(Date.now()); await put('kv', 'data', { raw: req.data, v });
      return J({ ok: true, v });
    }
    if (path === 'chat') return J({ error: 'הצ׳אט החכם זמין רק בגרסה שמותקנת במחשב.' });
    if (path === 'home/file' && method === 'POST') {
      const req = body(o); let bin;
      try { bin = Uint8Array.from(atob(req.data || ''), c => c.charCodeAt(0)); } catch (e) { return J({ error: 'הקובץ לא תקין' }, 400); }
      if (!bin.length) return J({ error: 'הקובץ ריק' });
      const safe = String(req.name || 'קובץ').replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').slice(-80) || 'קובץ';
      const name = new Date().toISOString().slice(0, 10) + '_' + Math.random().toString(16).slice(2, 8) + '_' + safe;
      await put('files', name, new Blob([bin], { type: mime(safe) }));
      return J({ ok: true, file: name });
    }
    if (path === 'home/file') {
      const b = await get('files', qs.get('f') || '');
      return b ? new Response(b, { status: 200, headers: { 'Content-Type': b.type || mime(qs.get('f')) } }) : J({ error: 'הקובץ לא נמצא' }, 404);
    }
    if (path === 'home/pdfimg') return J({ error: 'web' }, 404);
    if (path === 'google/gmail') return J({ connected: false, error: NO_MAIL });
    if (path.startsWith('home/')) return J({ error: NO_MAIL });
    return J({ error: 'לא נמצא' }, 404);
  }
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (u, o) => {
    const s = String(u && u.url || u);
    if (s.startsWith(BASE)) return handle(s.slice(BASE.length), o).catch(e => J({ error: 'השמירה בדפדפן נכשלה: ' + (e && e.message || e) }, 500));
    return nativeFetch(u, o);
  };
  // Images and links to attached files (in reports) point to the server address: replace them with the file stored in the browser
  const FILE = BASE + 'home/file?f=';
  const blobUrl = new Map();
  const urlFor = f => blobUrl.get(f) || (blobUrl.set(f, get('files', f).then(b => b ? URL.createObjectURL(b) : '')), blobUrl.get(f));
  const fix = root => root.querySelectorAll && root.querySelectorAll('img[src^="' + FILE + '"]').forEach(img => {
    const f = decodeURIComponent(img.getAttribute('src').slice(FILE.length)); img.removeAttribute('src');
    urlFor(f).then(u => { if (u) img.src = u; });
  });
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="' + FILE + '"]'); if (!a) return;
    e.preventDefault(); const w = window.open('', '_blank');
    urlFor(decodeURIComponent(a.getAttribute('href').slice(FILE.length))).then(u => { if (u && w) w.location = u; else if (w) w.close(); });
  }, true);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.nodeType === 1 && (n.matches && n.matches('img') ? fix(n.parentNode || n) : fix(n))))).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

<script>
/* ---------- נתונים ושמירה ---------- */
const STORE = 'kaspei-habayit-v1';
const DEFAULT = {
  transactions: [], recurring: [], goals: [], assets: [], budgets: {}, nwHistory: {}, rules: [], funds: [],
  // תיאורים שסומנו "אף פעם לא לייבא": שורה עם תיאור כזה מסומנת לדילוג בכל קובץ שמייבאים
  impBlock: [],
  // הקטגוריות נוצרות רק מייבוא או מהוספה ידנית
  categories: { income: [], expense: [] },
  settings: { maaserPct: 10, maaserCategory: 'מעשרות וצדקה', loanCategory: 'הלוואות' }
};
// הקטגוריות המובנות מגרסאות קודמות, כדי להסיר אותן פעם אחת אם לא נעשה בהן שימוש
const OLD_BUILTIN = ['משכורת', 'קצבאות וזיכויים', 'מלגה / כולל', 'הכנסה נוספת', 'מתנות', 'שונות', 'מזון וקניות', 'דיור ושכר דירה', 'חשמל, מים וגז',
  'שכר לימוד', 'מעשרות וצדקה', 'שבת וחגים', 'ביגוד והנעלה', 'תחבורה', 'בריאות', 'חוגים ושיעורים', 'ביטוחים', 'הלוואות', 'שמחות ומתנות', 'תקשורת'];
function cleanCategories() {
  ['income', 'expense'].forEach(type => {
    const used = new Set([...S.transactions, ...S.recurring].filter(t => t.type === type).map(t => t.category).filter(Boolean));
    if (!S.settings.catsCleaned) S.categories[type] = S.categories[type].filter(c => !OLD_BUILTIN.includes(c) || used.has(c));
    used.forEach(c => { if (!S.categories[type].includes(c)) S.categories[type].push(c); });
  });
  S.settings.catsCleaned = true;
}
// הוספת קטגוריה לרשימה אם היא חדשה
function ensureCat(type, c) { if (c && !S.categories[type].includes(c)) S.categories[type].push(c); }
// שדה קטגוריה: בוחרים מהרשימה או מקלידים חדשה
function catField(type, selected) {
  return `<input name="category" list="cats-${type}" value="${esc(selected || '')}" maxlength="40" placeholder="בחירה או הקלדת קטגוריה חדשה" autocomplete="off">
    <datalist id="cats-income">${S.categories.income.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <datalist id="cats-expense">${S.categories.expense.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
}
const clone = o => JSON.parse(JSON.stringify(o));
let S = clone(DEFAULT);

/* ---------- מזהה הדפדפן, לכניסה עם קוד במייל ---------- */
// כל דפדפן (ופרופיל) מקבל מזהה אקראי משלו. השרת מאשר רק דפדפן אחד, אחרי קוד מהמייל, לשבוע
const DEVICE = (() => {
  let d = ''; try { d = localStorage.getItem('kaspei-device') || ''; } catch (e) {}
  if (!/^[0-9a-f]{64}$/.test(d)) { d = [...crypto.getRandomValues(new Uint8Array(32))].map(b => b.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('kaspei-device', d); } catch (e) {} }
  return d;
})();
{ const nativeFetch = window.fetch.bind(window);
  window.fetch = (u, o = {}) => String(u).startsWith('http://127.0.0.1:8772/') ? nativeFetch(u, { ...o, headers: { ...(o.headers || {}), 'X-Device': DEVICE } }) : nativeFetch(u, o); }
// מסך הכניסה: שולחים קוד למייל, מזינים אותו, וממשיכים
function authScreen(to) {

/* ---------- שמירה בקובץ במחשב (kaspei_data.json) דרך השרת המקומי, ולא בכרום ---------- */
// כך לא משנה באיזה פרופיל או דפדפן פותחים את התוכנה: הנתונים תמיד באותו קובץ
const DATA_API = 'http://127.0.0.1:8772/api/data';
const FILE = { raw: null, v: '0', pending: null, busy: false };
function load() {
  try { if (FILE.raw) { const d = JSON.parse(FILE.raw); if (!d.__enc) return normalize(d); } } catch (e) {}
  return clone(DEFAULT);
}
// שמירה לקובץ: השמירה האחרונה תמיד מנצחת, ושמירות לא נשלחות במקביל
function fileSave(str) {
  FILE.pending = str; if (!FILE.busy) fileFlush();
}
async function fileFlush() {
  FILE.busy = true;
  while (FILE.pending !== null) {
    const str = FILE.pending; FILE.pending = null;
    try {
      const r = await fetch(DATA_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: str, base: FILE.v }) });
      if (r.status === 401) { FILE.pending = str; FILE.busy = false; toast('תוקף האימות פג. צריך קוד חדש מהמייל'); return setTimeout(() => location.reload(), 2500); }
      const d = await r.json();
      if (d.ok) { FILE.raw = str; FILE.v = d.v; }
      else if (d.conflict) { // הקובץ שונה מחלון אחר: טוענים את הגרסה העדכנית במקום לדרוס אותה
        FILE.raw = d.data; FILE.v = d.v; FILE.pending = null; await applyFileRaw();
        toast('הנתונים עודכנו מחלון אחר של התוכנה. השינוי האחרון לא נשמר, כדאי לבצע אותו שוב');
      } else throw new Error(d.error || 'error');
    } catch (e) {
      if (FILE.pending === null) FILE.pending = str;
      toast('השמירה לקובץ נכשלה. כנראה שרת התוכנה לא פועל: סגרו ופתחו מחדש מקיצור הדרך "כספי הבית"');
      await new Promise(res => setTimeout(res, 4000));
    }
  }
  FILE.busy = false;
}
// טעינת התוכן מהקובץ לתוך התוכנה (גם כשהוא מוצפן ויש כבר מפתח)
async function applyFileRaw() {
  let d = JSON.parse(FILE.raw || '{}');
  if (d.__enc) {
    if (!CRYPT || b64e(CRYPT.salt) !== d.salt) return location.reload();
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(d.iv) }, CRYPT.key, b64d(d.ct));
    d = JSON.parse(new TextDecoder().decode(pt));
  } else if (CRYPT) return location.reload();
  S = normalize(d);

window.addEventListener('beforeunload', e => { if (FILE.busy || FILE.pending !== null) { e.preventDefault(); e.returnValue = ''; } });
function normalize(d) {

}
function save() {

/* ---------- עזרים ---------- */
const $ = s => document.querySelector(s);

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const moneyFmt = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 2, minimumFractionDigits: 0 });
const money = v => moneyFmt.format(Math.round(v * 100) / 100);
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function shiftMonth(m, delta) { const [y, mm] = m.split('-').map(Number); return monthKey(new Date(y, mm - 1 + delta, 1)); }
function monthsBetween(a, b) { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
function monthName(m, style = 'long') { const [y, mm] = m.split('-').map(Number); return new Intl.DateTimeFormat('he-IL', { month: style, year: style === 'long' ? 'numeric' : undefined }).format(new Date(y, mm - 1, 1)); }
const hebFmt = (() => { try { return new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return null; } })();
function hebDate(iso) { if (!hebFmt || !iso) return ''; const [y, m, d] = iso.split('-').map(Number); return hebFmt.format(new Date(y, m - 1, d, 12)); }
function gregDate(iso) { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function toast(msg) { const t = $('#toast'); ui.undoFn = null; t.classList.remove('has-act'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
// הודעה עם כפתור "בטל" ל־8 שניות. restore מחזיר את מה שנמחק
function undoToast(msg, restore) {

  t.classList.add('show', 'has-act'); ui.undoFn = restore;

}
// מחיקת עסקאות עם אפשרות ביטול: העסקאות חוזרות למקום שלהן ברשימה
function deleteTxWithUndo(ids, msg, after) {
  const set = new Set(ids), removed = [];
  S.transactions.forEach((t, i) => { if (set.has(t.id)) removed.push([i, t]); });
  S.transactions = S.transactions.filter(t => !set.has(t.id)); save(); after();
  undoToast(msg, () => { removed.forEach(([i, t]) => { if (!S.transactions.some(x => x.id === t.id)) S.transactions.splice(Math.min(i, S.transactions.length), 0, t); }); save(); after(); toast('המחיקה בוטלה'); });
}
const COLORS = ['#4f46e5', '#06b6d4', '#f59e0b', '#ec4899', '#10b981', '#8b5cf6', '#f97316', '#0ea5e9', '#84cc16', '#e11d48', '#14b8a6', '#64748b'];

/* החזרי הלוואות ומשכנתא: מסומנים בקטגוריית ההלוואות או בעסקה שסומנה כ"החזר חוב".
   מעתה הם נספרים כהוצאה רגילה לכל דבר — בסיכומים, בדוחות ובגרפים —
   ואינם מוחרגים עוד משום חישוב. הסימון נשמר רק לתצוגה (🏦) ולחישוב יתרת החוב במסך הנכסים. */
function isDebtRepay(t) {
  // true = התנועות הן תשלומי חוב (לצורך תצוגה ויתרת חוב), אך הן אינן מוחרגות מההוצאות
  return t.type === 'expense' && (t.debtRepay === true || t.category === S.settings.loanCategory);
}
// האם להחריג את התנועה מההוצאות. כרגע: לא מחריגים — החזר חוב נספר כהוצאה.
// כדי להחזיר את ההחרגה בעתיד, שנה את השורה הבאה ל: return isDebtRepay(t);
function skipAsExpense(t) {
  return false;
}
function sumMonth(m, type, cat) {
  // ההוצאות כוללות גם החזרי חוב. אין החרגה.
  return S.transactions.filter(t => t.type === type && t.date.startsWith(m) && (!cat || t.category === cat))
    .reduce((a, t) => a + t.amount, 0);
}
function netWorth() { let a = 0, l = 0; S.assets.forEach(x => x.kind === 'asset' ? a += x.value : l += x.value); return { a, l, n: a - l }; }
function catOptions(type, selected) {
  const list = [...S.categories[type]];
  if (selected && !list.includes(selected)) list.push(selected);
  return list.map(c => `<option${c === selected ? ' selected' : ''}>${esc(c)}</option>`).join('');
}
function download(name, content, mime) {

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- הוצאות והכנסות קבועות: רישום אוטומטי בכל חודש ---------- */
function applyRecurring() {
  const now = new Date(), cur = monthKey(now); let added = 0;
  S.recurring.forEach(r => {
    if (!r.active) return;
    let m = r.lastApplied ? shiftMonth(r.lastApplied, 1) : r.startMonth;
    while (m <= cur) {
      if (r.endMonth && m > r.endMonth) break; // הקבועה הסתיימה
      const [y, mm] = m.split('-').map(Number);
      const day = Math.min(r.day, new Date(y, mm, 0).getDate()), date = `${m}-${pad(day)}`;
      if (m === cur && now.getDate() < day) break;
      // נרשמת רק בחודשים שנבחרו, ולא נרשמת פעמיים אם כבר קיימת עסקה זהה
      const inMonths = !r.months || r.months.includes(mm);
      const exists = S.transactions.some(t => t.date === date && t.amount === r.amount && t.type === r.type && t.note === r.note);
      if (inMonths && !exists) {
        S.transactions.push({ id: uid(), type: r.type, amount: r.amount, date, category: r.category, note: r.note, recurringId: r.id });
        added++;
      }
      r.lastApplied = m; m = shiftMonth(m, 1);
    }
  });
  if (added) save();
  return added;
}

/* ---------- התחייבויות: הפחתת ההחזר החודשי מהיתרה ---------- */
// לא נרשמת הוצאה. רק יתרת ההתחייבות יורדת, פעם אחת לכל חודש חדש.
// חודש שסומן ידנית כ"שולם" (a.payments) לא מופחת שוב, כדי לא לספור את ההחזר פעמיים
function applyLiabilityPayments() {
  const cur = monthKey(new Date()); let changed = false;
  S.assets.forEach(a => {
    if (a.kind !== 'liability' || !(a.payment > 0)) return;
    if (!a.paidThrough) { a.paidThrough = cur; changed = true; return; }
    while (a.paidThrough < cur) {
      a.paidThrough = shiftMonth(a.paidThrough, 1); // החודש הזה נחשב "מטופל" בכל מקרה
      if (a.endMonth && a.paidThrough > a.endMonth) continue; // אחרי חודש הסיום לא מורידים עוד החזרים
      const paidMark = a.payments && a.payments[a.paidThrough];
      if (paidMark) { changed = true; continue; } // כבר נרשם ידנית דרך סימון "שולם"
      const amt = Math.min(a.payment, a.value);
      if (amt <= 0) continue;
      a.value = Math.max(0, Math.round((a.value - amt) * 100) / 100);
      a.paidTotal = Math.round(((a.paidTotal || 0) + amt) * 100) / 100;
      changed = true;
    }
  });
  if (changed) save();
}

/* ---------- זיהוי כפילויות ---------- */
const dayDiff = (a, b) => Math.abs((new Date(a) - new Date(b)) / 86400000);
// תיאור "דומה": זהה אחרי ניקוי רווחים וסימנים, או שאחד מכיל את השני. בלי תיאור, משווים לפי קטגוריה
const normNote = s => String(s || '').toLowerCase().replace(/[\s"'״׳\-_.,:;()\/\\]+/g, '');
function sameDesc(a, b) {
  const x = normNote(a.note), y = normNote(b.note);
  if (!x || !y) return !x && !y && a.category === b.category;
  return x === y || (Math.min(x.length, y.length) >= 3 && (x.includes(y) || y.includes(x)));
}
// שתי עסקאות שחשודות ככפולות: אותו סוג, אותו סכום, הפרש של עד 3 ימים ותיאור דומה.
// שתי עסקאות שנוצרו משתי קבועות שונות אינן כפילות: אלה שני חיובים נפרדים
function isDupPair(t, u) {
  if (t.type !== u.type || Math.abs(t.amount - u.amount) >= 0.01 || dayDiff(t.date, u.date) > 3) return false;
  if (t.splitFrom && t.splitFrom === u.splitFrom) return false;
  if (t.recurringId && u.recurringId && t.recurringId !== u.recurringId) return false;
  return sameDesc(t, u);
}
function similarTx(t, pool = S.transactions) {
  return pool.filter(x => x.id !== t.id && isDupPair(x, t));
}
// זוגות חשודים בכל הנתונים (או בתקופה), בלי זוגות שסומנו "לא כפול"
function duplicatePairs(list) {
  const ok = new Set(S.settings.notDup || []), pairs = [], seen = new Set();
  const sorted = [...list].sort((a, b) => a.date.localeCompare(b.date));
  sorted.forEach((t, i) => {
    for (let j = i + 1; j < sorted.length && dayDiff(sorted[j].date, t.date) <= 3; j++) {
      const u = sorted[j], key = [t.id, u.id].sort().join('|');
      if (isDupPair(t, u) && !ok.has(key) && !seen.has(key)) { seen.add(key); pairs.push([t, u, key]); }
    }
  });
  return pairs;
}
// אזהרה כשהחזר חודשי של התחייבות זהה לעסקה קבועה או לעסקה קיימת
function paymentDupWarning(payment) {
  const r = S.recurring.find(x => x.type === 'expense' && Math.abs(x.amount - payment) < 0.01);
  if (r) return `לידיעתך: יש עסקה קבועה "${r.note || r.category}" באותו סכום. ההוצאה נספרת דרכה, וההתחייבות רק עוקבת אחרי היתרה`;
  return '';
}

/* ---------- מצב תצוגה ---------- */
const ui = { tab: 'dash', month: monthKey(new Date()), pie: 'expense', editTx: null, txType: 'expense', editAsset: null,

// בדשבורד אפשר לעבור בין תצוגה חודשית לשנתית. במסכים אחרים הניווט תמיד לפי חודש

/* ---------- דשבורד ---------- */
function cmpText(cur, prev, goodWhenUp, label = 'חודש קודם') {
  if (!prev) return `אין נתונים מ${label}`;
  const diff = (cur - prev) / Math.abs(prev) * 100, up = diff >= 0, good = up === goodWhenUp;
  return `<span class="${good ? 'pos' : 'neg'}">${up ? '▲' : '▼'} ${Math.abs(diff).toFixed(0)}%</span> לעומת ${label}`;
}
// טבלת סיכום של 12 חודשי השנה, עם סה״כ וממוצע. לחיצה על חודש פותחת אותו בתצוגה חודשית
function yearSummary(year) {
  let run = 0, ti = 0, te = 0, active = 0;
  const rows = MONTHS.map((n, i) => {
    const k = `${year}-${pad(i + 1)}`, inc = sumMonth(k, 'income'), exp = sumMonth(k, 'expense'), bal = inc - exp;
    run += bal; ti += inc; te += exp; if (inc || exp) active++;
    const cur = ui.period !== 'year' && k === ui.month;
    return `<tr class="clickable${cur ? ' cur' : ''}" data-action="gotoMonth" data-m="${k}" title="מעבר לתצוגה של ${n}"><td>${n}</td>
      <td class="pos">${inc ? money(inc) : '—'}</td><td class="neg">${exp ? money(exp) : '—'}</td>
      <td class="${bal >= 0 ? 'pos' : 'neg'}">${inc || exp ? money(bal) : '—'}</td><td>${inc || exp ? money(run) : '—'}</td></tr>`;
  }).join('');
  const avg = v => active ? money(v / active) : '—';
  return `<div class="table-wrap"><table class="sum-table"><thead><tr><th>חודש</th><th>הכנסות</th><th>הוצאות</th><th>יתרה</th><th>יתרה מצטברת</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td>סה״כ שנתי</td><td class="pos">${money(ti)}</td><td class="neg">${money(te)}</td><td class="${ti - te >= 0 ? 'pos' : 'neg'}">${money(ti - te)}</td><td></td></tr>
    <tr><td>ממוצע לחודש פעיל</td><td>${avg(ti)}</td><td>${avg(te)}</td><td>${avg(ti - te)}</td><td></td></tr></tfoot></table></div>`;
}
VIEWS.dash = () => {
  const year = ui.period === 'year', Y = ui.month.slice(0, 4);
  const m = year ? Y : ui.month, pm = year ? String(+Y - 1) : shiftMonth(ui.month, -1);
  const word = year ? 'השנה' : 'החודש', prevLabel = year ? 'שנה קודמת' : 'חודש קודם';
  const inc = sumMonth(m, 'income'), exp = sumMonth(m, 'expense');
  // החזרי חוב בחודש הזה: מוצגים בנפרד, ואינם נכללים בהוצאות
  const debtM = S.transactions.filter(t => isDebtRepay(t) && t.date.startsWith(m)).reduce((a, t) => a + t.amount, 0);
  const pinc = sumMonth(pm, 'income'), pexp = sumMonth(pm, 'expense');
  const flow = inc - exp, pflow = pinc - pexp, nw = netWorth();
  // מעשרות לפי הגדרות החישוב (הכנסות מוחרגות וניכויים), ראו maaserCalc
  const mPct = S.settings.maaserPct, mc = maaserCalc(m), mDue = mc.due, mPaid = mc.given;
  const mLeft = mDue - mPaid, mBal = mPaid - mDue;
  // יתרה מצטברת מכל התקופה: ניתן פחות נדרש, ועוד יתרת פתיחה. פלוס = עודף, מינוס = חסר
  const ma = maaserCalc(''), allInc = ma.base, allGiven = ma.given;
  const opening = +S.settings.maaserOpening || 0, allDue = ma.due, cumBal = allGiven - allDue + opening;
  const signed = v => `${v >= 0 ? '+' : '−'}${money(Math.abs(v))}`;
  const recent = S.transactions.filter(t => t.date.startsWith(m)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
  const empty = !S.transactions.length, dupCount = duplicatePairs(S.transactions).length;
  return topbar('דשבורד', monthNav(true)) +
  (empty ? `<div class="card welcome"><h2>ברוכים הבאים 👋</h2><p class="sub">התחילו בייבוא קובץ אקסל של הכנסות והוצאות, בהוספת עסקה או בהגדרת הוצאות קבועות (שכר דירה, ועד בית, שכר לימוד).</p>

  (dupCount ? `<div class="dup-alert"><div class="dup-head"><b>⚠️ ${dupCount} חשדות לכפילות</b><span class="sub" style="margin:0">ייתכן שעסקאות נרשמו פעמיים, למשל גם כקבועה וגם מייבוא מהבנק</span>
    <button class="btn sm primary" data-action="dupShow">בדיקה</button></div></div>` : '') +
  /* התזכורת "החזרי חוב לא סומנו" הוסרה לבקשת המשתמש: ההחזרים מתנהלים במסך ההתחייבויות בלבד ואינם נרשמים בהוצאות */
  `<div class="stats">
    <div class="stat s-flow s-hero"><div class="lbl">${year ? 'תזרים שנתי' : 'תזרים חודשי'}</div><div class="val ${flow >= 0 ? 'pos' : 'neg'}">${money(flow)}</div><div class="cmp">${cmpText(flow, pflow, true, prevLabel)}</div></div>
    <div class="stat s-inc"><div class="lbl">הכנסות ${word}</div><div class="val">${money(inc)}</div><div class="cmp">${cmpText(inc, pinc, true, prevLabel)}</div></div>
    <div class="stat s-exp"><div class="lbl">הוצאות ${word}${debtM ? ' (בלי החזרי חוב)' : ''}</div><div class="val">${money(exp)}</div><div class="cmp">${debtM ? `החזרי חוב בנפרד: ${money(debtM)}` : cmpText(exp, pexp, false, prevLabel)}</div></div>
    <div class="stat s-nw"><div class="lbl">שווי נקי</div><div class="val ${nw.n >= 0 ? 'pos' : 'neg'}">${money(nw.n)}</div><div class="cmp">נכסים ${money(nw.a)} · התחייבויות ${money(nw.l)}</div></div>
  </div>
  <div class="row">
    <section class="card"><div class="topbar" style="margin:0 0 10px"><div><h2>פילוח ${word}</h2></div>
      <div class="seg"><button data-action="pie" data-v="expense" class="${ui.pie === 'expense' ? 'on' : ''}">הוצאות</button><button data-action="pie" data-v="income" class="${ui.pie === 'income' ? 'on' : ''}">הכנסות</button></div></div>
      ${donut(m, ui.pie)}</section>
    <section class="card"><h2>תקציבים</h2><p class="sub">${year ? 'ניצול התקציב השנתי (התקציב החודשי × 12)' : 'ניצול התקציב החודשי'} לפי קטגוריה, לא כולל הלוואות</p>${budgetBars(m, 6, year ? 12 : 1)}</section>
  </div>
  <section class="card"><h2>הכנסות מול הוצאות</h2><p class="sub">${year ? `חודשי שנת ${Y}` : `12 החודשים האחרונים עד ${monthName(ui.month)}`}</p>${barChart(year ? `${Y}-12` : ui.month)}
    <ul class="legend" style="display:flex;gap:18px"><li><span class="dot" style="background:var(--inc)"></span>הכנסות</li><li><span class="dot" style="background:var(--exp)"></span>הוצאות</li></ul></section>
  <section class="card"><h2>סיכום לפי חודשים · שנת ${Y}</h2><p class="sub">לחיצה על חודש מציגה את הנתונים שלו בתצוגה חודשית</p>${yearSummary(Y)}</section>
  <div class="row">
    <section class="card maaser"><h2>מעשרות</h2><p class="sub">${mPct}% מההכנסות שנרשמו ${word}, מול מה שנרשם בקטגוריה "${esc(S.settings.maaserCategory)}". <button class="linkbtn" data-tab="maaser">לפירוט המלא</button></p>

      <div class="bar ${mLeft <= 0 ? 'done' : ''}"><span style="width:${mDue ? Math.min(100, mPaid / mDue * 100) : 0}%"></span></div></div>
      <div class="maaser-total"><div><div class="lbl">יתרה מצטברת מכל התקופה</div>
        <div class="val ${cumBal >= 0 ? 'pos' : 'neg'}">${signed(cumBal)}</div>
        <div class="lbl">${cumBal >= 0 ? 'עודף: ניתן יותר מהנדרש' : 'חסר: נותר לתת ' + money(-cumBal)}</div></div>
        <div class="maaser-break">${ma.deduct || ma.base !== ma.inc ? 'בסיס החישוב' : 'סה״כ הכנסות'} ${money(allInc)}<br>נדרש ${money(allDue)} · ניתן ${money(allGiven)}${opening ? `<br>יתרת פתיחה ${signed(opening)}` : ''}</div></div></section>

};

function donut(m, type) {
  const map = {};
  S.transactions.filter(t => t.type === type && t.date.startsWith(m) && !(type === 'expense' && isDebtRepay(t))).forEach(t => map[t.category] = (map[t.category] || 0) + t.amount);
  return donutFromMap(map, `אין ${type === 'expense' ? 'הוצאות' : 'הכנסות'} להצגה ${m.length === 4 ? 'בשנה זו' : 'בחודש זה'}`);
}
function donutFromMap(map, emptyMsg) {
  const arr = Object.entries(map).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]), tot = arr.reduce((a, x) => a + x[1], 0);
  if (!tot) return `<p class="empty">${emptyMsg}</p>`;
  const r = 70, C = 2 * Math.PI * r; let off = 0, circles = '';
  arr.forEach(([c, v], i) => {
    const len = v / tot * C;
    circles += `<circle r="${r}" cx="100" cy="100" fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="30" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"><title>${esc(c)}: ${money(v)}</title></circle>`;
    off += len;
  });
  return `<div class="donut-wrap"><svg viewBox="0 0 200 200" class="chart" role="img" aria-label="פילוח לפי קטגוריה">
    <g transform="rotate(-90 100 100)">${circles}</g>
    <text x="100" y="96" text-anchor="middle" style="font-size:12px">סה״כ</text>
    <text x="100" y="116" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--text)">${money(tot)}</text></svg>
    <ul class="legend">${arr.map(([c, v], i) => `<li><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>${esc(c)}<span class="v">${money(v)} · ${(v / tot * 100).toFixed(0)}%</span></li>`).join('')}</ul></div>`;
}

function barChart(end) {
  const ms = []; for (let i = 11; i >= 0; i--) ms.push(shiftMonth(end, -i));
  const data = ms.map(k => ({ k, i: sumMonth(k, 'income'), e: sumMonth(k, 'expense') }));
  const max = Math.max(1, ...data.map(d => Math.max(d.i, d.e)));
  const W = 720, H = 240, pt = 10, pb = 26, ch = H - pt - pb, cw = W / 12, bw = Math.min(20, cw / 3);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="הכנסות מול הוצאות לפי חודש">`;
  for (let g = 0; g <= 4; g++) { const y = pt + ch * g / 4; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="grid"/>`; }
  data.forEach((d, idx) => {
    const cx = W - idx * cw - cw / 2; // הסדר מימין לשמאל
    const hi = d.i / max * ch, he = d.e / max * ch;
    s += `<rect x="${cx + 1}" y="${pt + ch - hi}" width="${bw}" height="${hi}" rx="3" fill="var(--inc)"><title>${monthName(d.k)} · הכנסות ${money(d.i)}</title></rect>`;
    s += `<rect x="${cx - bw - 1}" y="${pt + ch - he}" width="${bw}" height="${he}" rx="3" fill="var(--exp)"><title>${monthName(d.k)} · הוצאות ${money(d.e)}</title></rect>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${monthName(d.k, 'short')}</text>`;
  });
  return s + '</svg>';
}

function budgetBars(m, limit, factor = 1) {
  const items = Object.entries(S.budgets).filter(([c, v]) => v > 0 && c !== S.settings.loanCategory);
  if (!items.length) return `<p class="empty">אין תקציב מוגדר</p><div class="actions"><button class="btn sm" data-tab="budget">הגדרת תקציב חודשי</button></div>`;
  const rows = items.map(([c, b]) => ({ c, b: b * factor, s: sumMonth(m, 'expense', c) })).sort((a, b) => b.s / b.b - a.s / a.b);
  return rows.slice(0, limit || rows.length).map(({ c, b, s }) => {
    const p = s / b * 100, cls = p > 100 ? 'over' : p >= 85 ? 'near' : '';
    return `<div class="budget-item"><div class="top"><span>${esc(c)}</span><span>${money(s)} / ${money(b)} ${p > 100 ? '<b class="neg">חריגה</b>' : ''}</span></div>
      <div class="bar ${cls}"><span style="width:${Math.min(100, p)}%"></span></div></div>`;
  }).join('') + (limit && rows.length > limit ? `<div class="actions"><button class="btn sm" data-tab="budget">לכל התקציבים</button></div>` : '');
}

/* ---------- עסקאות ---------- */
function txTable(list, withActions = true) {

  ${list.map(t => `<tr>${withActions ? `<td class="c-sel"><input type="checkbox" class="sel" value="${t.id}" aria-label="בחירה" style="width:auto"></td>` : ''}<td class="c-date">${gregDate(t.date)}<span class="heb">${hebDate(t.date)}</span></td>
    <td class="c-cat"><span class="tag">${esc(t.category)}</span>${t.recurringId ? ' 🔁' : ''}${t.splitFrom ? ' ✂️' : ''}${isDebtRepay(t) ? ' 🏦' : ''}</td><td class="c-note">${esc(t.note)}</td>
    <td class="amount c-amt ${t.type === 'income' ? 'pos' : 'neg'}">${t.type === 'income' ? '+' : '−'}${money(t.amount)}${isDebtRepay(t) ? '<span class="heb">החזר חוב · נספר כהוצאה</span>' : ''}</td>
    ${withActions ? `<td class="actions"><button class="btn sm" data-action="editTx" data-id="${t.id}">עריכה</button><button class="btn sm" data-action="splitTx" data-id="${t.id}" title="פיצול לכמה קטגוריות">פיצול</button><button class="btn sm danger" data-action="delTx" data-id="${t.id}">מחיקה</button></td>` : ''}</tr>`).join('')}
  </tbody></table></div>`;
}
function filteredTx() {
  const f = ui.filters, q = f.q.trim();
  const key = f.period === 'month' ? f.month : f.period === 'year' ? f.year : '';
  const inPeriod = t => f.period === 'hmonth' ? hebKey(t.date) === f.hmonth : f.period === 'hyear' ? hebParts(t.date).y === f.hyear : (!key || t.date.startsWith(key));
  // חיפוש חופשי: בהערה, בקטגוריה או בסכום (למשל 2050)
  const ql = q.toLowerCase(), qNum = q.replace(/[,₪\s]/g, '');
  const matchQ = t => !q || (t.note || '').toLowerCase().includes(ql) || (t.category || '').toLowerCase().includes(ql) ||
    (/^\d+(\.\d+)?$/.test(qNum) && String(t.amount).startsWith(qNum));
  const min = parseFloat(f.min), max = parseFloat(f.max);
  const inRange = t => (isNaN(min) || t.amount >= min) && (isNaN(max) || t.amount <= max);
  // בלשונית "עסקאות" מוצגות כל התנועות, כולל החזרי הלוואה. הסינון היחיד הוא "🏦 החזרי חוב" שמציג אותם לבד
  const view = f.cat === '__debt__' ? 'debt' : (ui.txView && ui.txView !== 'exp' ? ui.txView : 'all');
  return S.transactions.filter(t => inPeriod(t) && (f.type === 'all' || t.type === f.type) &&
    (f.cat === '__debt__' ? isDebtRepay(t) : (f.cat === 'all' || t.category === f.cat)) &&
    (view !== 'exp' || t.type !== 'expense' || !skipAsExpense(t)) && (view !== 'debt' || isDebtRepay(t)) && matchQ(t) && inRange(t))
    .sort(TX_SORTS[f.sort] || TX_SORTS['date-desc']);
}
const TX_SORTS = {
  'date-desc': (a, b) => b.date.localeCompare(a.date),
  'date-asc': (a, b) => a.date.localeCompare(b.date),
  'amt-desc': (a, b) => b.amount - a.amount || b.date.localeCompare(a.date),
  'amt-asc': (a, b) => a.amount - b.amount || b.date.localeCompare(a.date),
  'cat': (a, b) => (a.category || '').localeCompare(b.category || '', 'he') || b.date.localeCompare(a.date),
  'note': (a, b) => (a.note || '').localeCompare(b.note || '', 'he') || b.date.localeCompare(a.date)
};
// לחיצה על כותרת עמודה ממיינת לפיה. לחיצה נוספת הופכת את הכיוון
const SORT_COLS = { 'תאריך': ['date-desc', 'date-asc'], 'סכום': ['amt-desc', 'amt-asc'], 'קטגוריה': ['cat'], 'הערה': ['note'] };
const sortTh = name => {

  return `<th class="sortable${on ? ' sorted' : ''}" data-action="sortTx" data-col="${name}" title="מיון לפי ${name}">${name}${arrow}</th>`;
};
VIEWS.tx = () => {

  <form id="txForm" class="grid-form">
    <label>סוג<select name="type"><option value="expense"${type === 'expense' ? ' selected' : ''}>הוצאה</option><option value="income"${type === 'income' ? ' selected' : ''}>הכנסה</option></select></label>
    <label>סכום (₪)<input name="amount" type="number" step="0.01" min="0.01" required value="${ed ? ed.amount : ''}"></label>

    <label id="debtWrap" class="chk" hidden title="ההחזר נספר כהוצאה רגילה">
      <input type="checkbox" name="debtRepay" style="width:auto"${ed && ed.debtRepay ? ' checked' : ''}> זהו החזר הלוואה / משכנתא (נספר כהוצאה רגילה)</label>

  </form></section>
  <section class="card"><div class="grid-form" style="margin-bottom:14px">

    <label>חיפוש<input id="fQ" type="search" value="${esc(f.q)}" placeholder="שם, הערה, קטגוריה או סכום"></label>
    <label>סכום מ־<input id="fMin" type="number" step="0.01" min="0" value="${esc(f.min)}" placeholder="0"></label>

};
function renderTxList() {
  const list = filteredTx();

function catTabsHtml() {

      (!q || (t.note || '').toLowerCase().includes(ql) || (t.category || '').toLowerCase().includes(ql) || (/^\d+(\.\d+)?$/.test(qNum) && String(t.amount).startsWith(qNum))) &&
      (isNaN(min) || t.amount >= min) && (isNaN(max) || t.amount <= max);

function nwChart() {
  const cur = monthKey(new Date()), ms = [];
  for (let i = 5; i >= 0; i--) ms.push(shiftMonth(cur, -i));
  // חודש בלי תמונת מצב מקבל את הערך האחרון שידוע לפניו
  const keys = Object.keys(S.nwHistory).sort(); let last = null;
  const vals = ms.map(m => { keys.forEach(k => { if (k <= m) last = S.nwHistory[k]; }); return last; });
  if (vals.every(v => v === null)) return '<p class="empty">אין עדיין נתונים</p>';
  const nums = vals.map(v => v ?? 0), min = Math.min(0, ...nums), max = Math.max(1, ...nums);
  const W = 600, H = 200, pt = 14, pb = 26, ch = H - pt - pb, step = W / 6;
  const pts = nums.map((v, i) => [W - i * step - step / 2, pt + ch - (v - min) / (max - min || 1) * ch]);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="מגמת שווי נקי">`;
  for (let g = 0; g <= 4; g++) { const y = pt + ch * g / 4; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="grid"/>`; }
  s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--primary)"><title>${monthName(ms[i])}: ${money(nums[i])}</title></circle>
    <text x="${p[0]}" y="${H - 6}" text-anchor="middle">${monthName(ms[i], 'short')}</text>`; });
  return s + '</svg>';
}

/* סימון "שולם" להחזר של חודש מסוים: מוריד את היתרה בסכום ההחזר, ולחיצה שנייה מבטלת.
   חודש שכבר טופל אוטומטית (עד paidThrough) מסומן בלי הפחתה נוספת, כדי לא לספור פעמיים */
function markLoanPaid(id, m) {
  const a = S.assets.find(x => x.id === id); if (!a) return;
  a.payments = a.payments || {};
  // החודש הזה כבר הופחת מהיתרה? (אוטומטית, או בסימון ידני קודם)
  const already = !a.paidThrough || m <= a.paidThrough;
  if (a.payments[m]) { // ביטול הסימון: מחזירים את הסכום ליתרה
    const amt = Math.min(+a.payment || 0, a.value + (+a.payment || 0));
    a.value = Math.round((a.value + amt) * 100) / 100;
    a.paidTotal = Math.max(0, Math.round(((a.paidTotal || 0) - amt) * 100) / 100);
    delete a.payments[m];
    toast('סימון ההחזר בוטל, והסכום חזר ליתרה');
  } else if (already) {
    a.payments[m] = today();
    toast(`סומן שההחזר של ${monthName(m)} שולם (הוא כבר נוכה מהיתרה)`);
  } else {
    const amt = Math.min(+a.payment || 0, a.value);
    a.value = Math.round((a.value - amt) * 100) / 100;
    a.paidTotal = Math.round(((a.paidTotal || 0) + amt) * 100) / 100;
    a.payments[m] = today();
    toast(`נרשם החזר של ${money(amt)} (${monthName(m)})`);
  }
  save(); render();
}

/* ---------- דוחות חודשיים ושנתיים ---------- */
const sumKey = (key, type, cat) => sumMonth(key, type, cat);
function catMap(key, type) {
  const m = {}; S.transactions.filter(t => t.type === type && t.date.startsWith(key)).forEach(t => m[t.category] = (m[t.category] || 0) + t.amount);
  return m;
}
const pctTxt = (a, b) => b ? `${a >= b ? '▲' : '▼'} ${Math.abs((a - b) / b * 100).toFixed(0)}%` : '—';

// טיפים לפי הנתונים: כל טיפ מחושב מהמספרים של התקופה, בלי ניחושים
function reportTips(key, year) {
  const tips = [], add = (icon, kind, text) => tips.push({ icon, kind, text });
  const prev = year ? String(+key - 1) : shiftMonth(key, -1), word = year ? 'השנה' : 'החודש', prevWord = year ? 'בשנה הקודמת' : 'בחודש הקודם';
  const inc = sumKey(key, 'income'), exp = sumKey(key, 'expense'), bal = inc - exp, rate = inc ? bal / inc : 0;
  if (!inc && !exp) return [{ icon: 'ℹ️', kind: 'info', text: `אין עסקאות ב${year ? 'שנה' : 'חודש'} הזה. כדאי לייבא קובץ מהבנק או להוסיף עסקאות.` }];
  // יחס חיסכון
  if (bal < 0) add('🔴', 'bad', `ההוצאות ${word} גבוהות מההכנסות ב־${money(-bal)}. כדאי לבדוק אילו קטגוריות אפשר לצמצם, בעיקר אלה שעלו לעומת ${prevWord}.`);
  else if (inc && rate < 0.1) add('🟠', 'warn', `נשארו ${word} ${money(bal)}, שהם ${(rate * 100).toFixed(0)}% מההכנסות. יעד מקובל הוא לחסוך לפחות 10% מההכנסות.`);
  else if (inc) add('🟢', 'good', `נחסכו ${word} ${money(bal)}, שהם ${(rate * 100).toFixed(0)}% מההכנסות. כדאי להעביר את הסכום לחיסכון או לקרן חירום, כדי שלא יתפזר.`);
  // קטגוריות שעלו בחדות
  const cur = catMap(key, 'expense'), old = catMap(prev, 'expense');
  Object.entries(cur).map(([c, v]) => ({ c, v, o: old[c] || 0 })).filter(x => x.o > 0 && x.v - x.o >= (year ? 1000 : 200) && x.v / x.o >= 1.25)
    .sort((a, b) => (b.v - b.o) - (a.v - a.o)).slice(0, 2)
    .forEach(x => add('📈', 'warn', `ההוצאה על "${x.c}" עלתה ל־${money(x.v)}, לעומת ${money(x.o)} ${prevWord} (עלייה של ${money(x.v - x.o)}).`));
  // ירידה משמעותית
  const drop = Object.entries(old).map(([c, o]) => ({ c, o, v: cur[c] || 0 })).filter(x => x.o - x.v >= (year ? 1000 : 300) && x.v / x.o <= 0.75).sort((a, b) => (b.o - b.v) - (a.o - a.v))[0];
  if (drop) add('👏', 'good', `ההוצאה על "${drop.c}" ירדה ב־${money(drop.o - drop.v)} לעומת ${prevWord}.`);
  // קטגוריה דומיננטית
  const top = Object.entries(cur).sort((a, b) => b[1] - a[1])[0];
  if (top && exp && top[1] / exp >= 0.35) add('🎯', 'info', `"${top[0]}" היא ${(top[1] / exp * 100).toFixed(0)}% מכל ההוצאות ${word}. כל חיסכון קטן בה ישפיע הכי הרבה.`);
  // חריגות תקציב
  const factor = year ? 12 : 1;
  const over = Object.entries(S.budgets).filter(([c, b]) => b > 0 && (cur[c] || 0) > b * factor).map(([c, b]) => `${c} (${money(cur[c] - b * factor)})`);
  if (over.length) add('💼', 'bad', `חריגה מהתקציב ב: ${over.join(', ')}.`);
  else if (Object.keys(S.budgets).length) add('💼', 'good', `כל הקטגוריות עם תקציב נשארו בתוך המסגרת ${word}.`);
  // הוצאות קבועות מול הכנסה
  const fixed = S.transactions.filter(t => t.type === 'expense' && !skipAsExpense(t) && t.recurringId && t.date.startsWith(key)).reduce((a, t) => a + t.amount, 0);
  if (inc && fixed / inc >= 0.6) add('🔁', 'warn', `ההוצאות הקבועות הן ${(fixed / inc * 100).toFixed(0)}% מההכנסות, כך שנשאר מעט מקום לגמישות. כדאי לבדוק אם אפשר להוזיל אחת מהן, למשל ביטוח או תקשורת.`);
  // החזרי התחייבויות
  const pay = S.assets.filter(a => a.kind === 'liability' && a.value > 0).reduce((a, x) => a + (+x.payment || 0), 0), monthlyInc = year ? inc / 12 : inc;
  if (pay && monthlyInc && pay / monthlyInc >= 0.3) add('🏦', 'warn', `החזרי ההלוואות (${money(pay)} בחודש) הם ${(pay / monthlyInc * 100).toFixed(0)}% מההכנסה החודשית. מומלץ לא לקחת הלוואות נוספות כרגע.`);
  // מעשרות
  const { due: mDue, given: mPaid } = maaserCalc(key);
  if (mDue && mPaid < mDue) add('🤲', 'info', `לפי ההכנסות ${word}, נותרו ${money(mDue - mPaid)} למעשרות.`);
  // עסקה גדולה
  const big = S.transactions.filter(t => t.type === 'expense' && !skipAsExpense(t) && t.date.startsWith(key)).sort((a, b) => b.amount - a.amount)[0];
  if (big && exp && big.amount / exp >= 0.15 && !big.recurringId) add('🧾', 'info', `ההוצאה הגדולה ${word}: ${money(big.amount)} ב־${gregDate(big.date)} (${big.note || big.category}).`);
  // הרבה הוצאות קטנות
  const counts = {}; S.transactions.filter(t => t.type === 'expense' && !skipAsExpense(t) && t.date.startsWith(key) && t.amount < 150).forEach(t => counts[t.category] = (counts[t.category] || 0) + 1);
  const many = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (many && many[1] >= (year ? 60 : 10)) add('🪙', 'info', `נרשמו ${many[1]} הוצאות קטנות ב"${many[0]}" (${money(cur[many[0]] || 0)} בסך הכול). קנייה מרוכזת אחת לשבוע יכולה לחסוך.`);
  // בלי קטגוריה וכפילויות
  const noCat = S.transactions.filter(t => t.date.startsWith(key) && (!t.category || t.category === 'ללא קטגוריה')).length;
  if (noCat) add('🏷️', 'info', `${noCat} עסקאות בלי קטגוריה. שיוך שלהן ישפר את הדוח. אפשר לעשות את זה בבת אחת עם "שינוי גורף" במסך העסקאות.`);
  const dups = duplicatePairs(S.transactions.filter(t => t.date.startsWith(key))).length;
  if (dups) add('⚠️', 'warn', `${dups} חשדות לכפילות ${word}. כדאי לבדוק אותם במסך העסקאות לפני שמסתמכים על המספרים.`);
  // חגים מתקרבים (לפי הלוח העברי)
  if (!year && hebFmt) {
    const now = new Date();
    for (let i = 1; i <= 45; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 12), name = hebFmt.format(d);
      const hag = /^1 בניסן/.test(name) ? 'ניסן (פסח)' : /^1 בתשרי/.test(name) ? 'תשרי (החגים)' : '';
      if (hag) {
        const ly = monthKey(new Date(d.getFullYear() - 1, d.getMonth(), 1)), lyExp = sumKey(ly, 'expense');
        add('🗓️', 'info', `חודש ${hag} מתחיל בעוד ${i} ימים.${lyExp ? ` בחודש המקביל בשנה שעברה ההוצאות היו ${money(lyExp)}.` : ''} כדאי להפריש מראש סכום להוצאות החג.`);
        break;
      }
    }
  }
  return tips;
}

BIND.settings = () => {
  $('#mPct').addEventListener('change', e => { S.settings.maaserPct = Number(e.target.value); save(); toast('נשמר'); });
  $('#mCat').addEventListener('change', e => { S.settings.maaserCategory = e.target.value; save(); toast('נשמר'); });
  $('#lCat').addEventListener('change', e => { S.settings.loanCategory = e.target.value; save(); toast('נשמר'); });
  $('#mOpen').addEventListener('change', e => { S.settings.maaserOpening = parseFloat(e.target.value) || 0; save(); toast('נשמר'); });
  // כמה קבצים יחד: כולם נקראים מראש לתור, ואז מטפלים בהם אחד אחרי השני (לכל קובץ עמודות משלו)
  $('#csvFile').addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; loadImportFiles(files); });
  // גרירת כמה קבצים לאזור הייבוא
  const drop = $('#impDrop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor = 'var(--primary)'; }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor = ''; }));
  drop.addEventListener('drop', e => loadImportFiles([...(e.dataTransfer && e.dataTransfer.files || [])]));
  async function loadImportFiles(files) {
    if (!files.length) return;
    const queue = [], bad = [];
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer(), head = new Uint8Array(buf.slice(0, 8));
        const isZip = head[0] === 0x50 && head[1] === 0x4b, isBiff = head[0] === 0xd0 && head[1] === 0xcf;
        // הרבה בנקים מורידים "xls" שהוא בעצם דף אינטרנט עם טבלה – קוראים אותו כטבלה
        const asText = !isZip && !isBiff ? decodeText(buf) : '';
        if (isBiff) { bad.push(`${file.name} (פורמט xls ישן: לפתוח באקסל ולשמור בשם כ־xlsx)`); continue; }
        const sheets = (isZip ? await readXlsx(buf) : /<table/i.test(asText) ? readHtmlTables(asText, file.name) : [{ name: file.name, rows: parseCSV(asText) }]).filter(s => s.rows.length >= 2);
        if (sheets.length) queue.push({ name: file.name, sheets }); else bad.push(`${file.name} (אין בו שורות)`);
      } catch (err) { bad.push(`${file.name} (לא הצלחתי לקרוא)`); }
    }
    if (bad.length) toast('לא נטענו: ' + bad.join(' · '));
    if (!queue.length) return;
    ui.impQueue = { files: queue, i: 0, done: [] };
    startImport(queue[0].sheets);
  }
  $('#restoreFile').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      e.target.value = '';
      let d;
      try { d = JSON.parse(reader.result); } catch (err) { return toast('הקובץ אינו קובץ גיבוי תקין'); }
      if (d && d.__enc) {
        if (!(window.crypto && crypto.subtle)) return toast('הדפדפן הזה לא תומך בפתיחת גיבוי מוצפן');
        const pass = await askPassword('הגיבוי מוצפן. הזן את הסיסמה שהייתה בזמן הגיבוי');
        if (pass == null) return;
        // הפענוח לא משנה את הסיסמה הנוכחית של התוכנה
        const prev = CRYPT;
        try { d = await decryptState(reader.result, pass); } catch (err) { CRYPT = prev; return toast('סיסמה שגויה. הגיבוי לא שוחזר'); }
        CRYPT = prev;
      }
      if (!d || !Array.isArray(d.transactions)) return toast('הקובץ אינו קובץ גיבוי תקין');
      if (!confirm('השחזור יחליף את כל הנתונים הנוכחיים. להמשיך?')) return;
      S = normalize(d); save(); render(); toast('הנתונים שוחזרו');
    };
    reader.readAsText(file);
  });
  if (ui.imp) renderImport();
};

/* קריאת קובץ אקסל (.xlsx) בלי ספריות חיצוניות: קובץ xlsx הוא ZIP של קובצי XML */
async function readXlsx(buf) {

        <b>🚫 "לא לייבא אף פעם"</b> נשמר מיד: התיאור הזה יסומן לדילוג בכל קובץ שתעלה מעכשיו.${count('block') ? ` בקובץ הזה ${count('block')} שורות כאלה.` : ''}</p>

    <div class="actions" style="margin-top:10px"><button class="btn primary" data-action="impGo"${count('tx') + count('rec') ? '' : ' disabled'}>ייבוא ${count('tx')} רגילות ו־${count('rec')} קבועות${more ? ' ומעבר לקובץ הבא' : ''}</button>

      // נשמר מיד, כדי שיחול גם אם מדלגים על הקובץ. כל השורות עם אותו תיאור בקובץ מסומנות יחד
      if (!S.impBlock.some(b => b.key === k)) { S.impBlock.push({ key: k, text: t.note, type: t.type, at: today() }); save(); }

    renderImport();
  }));
}

function removeSampleData() {
  if (S.settings.sampleRemoved) return;
  const sig = [[1, 'income', 'משכורת', 'משכורת', 9800], [1, 'income', 'מלגה / כולל', 'מלגת כולל', 2600], [2, 'expense', 'דיור ושכר דירה', 'שכר דירה', 4200],
    [3, 'expense', 'מעשרות וצדקה', 'מעשרות', 1240], [5, 'expense', 'שכר לימוד', 'תלמוד תורה', 850], [6, 'expense', 'מזון וקניות', 'קניות בסופר', [2900, 3132]],
    [7, 'expense', 'שבת וחגים', 'קניות לשבת', [780, 842]], [9, 'expense', 'חשמל, מים וגז', 'חשבון חשמל', 420], [10, 'expense', 'הלוואות', 'החזר גמ״ח', 600],
    [12, 'expense', 'תחבורה', 'רב־קו', [350, 378]]];
  const isSample = t => !t.recurringId && sig.some(([d, ty, c, n, a]) => t.type === ty && t.category === c && t.note === n &&
    +t.date.slice(8) === d && [].concat(a).includes(t.amount));
  const before = S.transactions.length;
  S.transactions = S.transactions.filter(t => !isSample(t));
  const sb = { 'מזון וקניות': 3000, 'שבת וחגים': 800, 'תחבורה': 400, 'חשמל, מים וגז': 450, 'ביגוד והנעלה': 500 };
  Object.entries(sb).forEach(([c, v]) => { if (S.budgets[c] === v) delete S.budgets[c]; });
  const assetsBefore = S.assets.length;
  S.assets = S.assets.filter(a => !((a.name === 'חיסכון בבנק' && a.value === 12500) || (a.name === 'הלוואת גמ״ח' && a.value === 7200)));
  S.goals = [];
  if (before !== S.transactions.length || assetsBefore !== S.assets.length) S.nwHistory = {};
  S.settings.sampleRemoved = true;
  save();
}

function xCell(ref, c) {
  if (c === null || c === undefined || c === '') return '';
  if (typeof c !== 'object') c = { v: c };
  const s = c.s !== undefined ? ` s="${c.s}"` : (typeof c.v === 'string' ? ` s="${XS.text}"` : '');
  if (c.f !== undefined) return `<c r="${ref}"${s}><f>${xesc(c.f)}</f></c>`;
  if (c.d !== undefined) return `<c r="${ref}"${s || ` s="${XS.date}"`}><v>${dateSerial(c.d)}</v></c>`;
  if (typeof c.v === 'number') return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
  if (c.v === undefined || c.v === '') return s ? `<c r="${ref}"${s}/>` : '';
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xesc(c.v)}</t></is></c>`;
}
function xSheet(sh) {

<sheetFormatPr defaultRowHeight="18"/><cols>${sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"${sh.hidden && sh.hidden.includes(i) ? ' hidden="1"' : ''}/>`).join('')}</cols>

<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
// קובץ ZIP פשוט (בלי דחיסה), מספיק לקובץ אקסל
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  files.forEach(([name, text]) => {
    const n = enc.encode(name), d = enc.encode(text), crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint32(14, crc, true);
    h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, n.length, true);
    parts.push(new Uint8Array(h.buffer), n, d);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint32(16, crc, true);
    c.setUint32(20, d.length, true); c.setUint32(24, d.length, true); c.setUint16(28, n.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), n);

  sheets.forEach((s, i) => s.idx = i);

    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${names.map((n, i) => `<sheet name="${xesc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets>${defs ? `<definedNames>${defs}</definedNames>` : ''}<calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`],

    ['xl/styles.xml', xlsxStyles()],

// בניית חוברת "כספי הבית": עסקאות, סיכום חודשי, לפי קטגוריה, קבועות, נכסים, תקציב. כל הסיכומים הם נוסחאות חיות

    rows: [['תאריך', 'תאריך עברי', 'סוג', 'קטגוריה', 'הערה', 'סכום', 'חודש', 'שנה', 'קבועה', 'החזר חוב'].map(v => ({ v, s: XS.head })),
      ...tx.map(t => [{ d: t.date }, { v: hebDate(t.date), s: XS.center }, { v: t.type === 'income' ? 'הכנסה' : 'הוצאה', s: XS.center }, t.category || '', t.note || '',
        { v: t.amount, s: t.type === 'income' ? XS.inc : XS.exp }, { v: monthName(t.date.slice(0, 7)), s: XS.center }, { v: +t.date.slice(0, 4), s: XS.center }, { v: t.recurringId ? 'כן' : '', s: XS.center }, { v: isDebtRepay(t) ? 'כן' : '', s: XS.center }])] };
  // 2. סיכום חודשי
  const months = [...new Set(tx.map(t => t.date.slice(0, 7)))].sort();
  const h2 = 4, f2 = h2 + 1, l2 = h2 + months.length;
  const s2 = { name: 'סיכום חודשי', cols: [18, 16, 16, 16, 18, 12], freeze: h2, merges: ['A1:F1', 'A2:F2'], heights: [30, 0, 0, 26], tab: 'FF06B6D4',
    rows: [[{ v: 'סיכום חודשי · כספי הבית', s: XS.title }], [{ v: produced, s: XS.sub }], [],
      ['חודש', 'הכנסות', 'הוצאות', 'יתרה', 'יתרה מצטברת', 'אחוז חיסכון'].map(v => ({ v, s: XS.head })),
      ...months.map((m, i) => { const r = f2 + i; return [{ v: monthName(m), s: XS.text },
        { f: `SUMIFS(${T}$F:$F,${T}$G:$G,$A${r},${T}$C:$C,"הכנסה")`, s: XS.inc }, { f: `SUMIFS(${T}$F:$F,${T}$G:$G,$A${r},${T}$C:$C,"הוצאה",${T}$J:$J,"<>כן")`, s: XS.exp },

function downloadBlob(name, blob) {

// שמירת קובץ דרך חלון "שמירה בשם" של Windows (בכרום ובאדג׳). אם החלון לא זמין, יורד לתיקיית ההורדות
async function saveFile(name, blob, kind) {
  if (window.showSaveFilePicker) {
    try {
      const types = { xlsx: [{ description: 'קובץ אקסל', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] }[kind];
      const h = await window.showSaveFilePicker({ suggestedName: name.replace(/[\\/:*?"<>|]/g, '-'), types });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return toast(`הקובץ נשמר: ${h.name}`);
    } catch (e) {
      if (e.name === 'AbortError') return toast('השמירה בוטלה');
      // כל שגיאה אחרת: ממשיכים להורדה רגילה
    }
  }
  downloadBlob(name, blob); toast('הקובץ ירד לתיקיית ההורדות. אם לא רואים אותו, בדקו את סמל ההורדות בכרום');
}
// יצירת קובץ אקסל עם הודעת שגיאה ברורה אם משהו נכשל
async function exportXlsxFile(name, txList, label) {
  let blob;
  try { blob = exportWorkbook(txList, label); }
  catch (e) { console.error(e); return toast('יצירת קובץ האקסל נכשלה: ' + e.message); }
  await saveFile(name, blob, 'xlsx');
}

// כלל: אם התיאור מכיל טקסט מסוים, העסקה מקבלת קטגוריה מסוימת
function ruleCat(note, type) {
  const n = (note || '').toLowerCase();
  const r = (S.rules || []).find(r => (r.type === 'any' || r.type === type) && r.text && n.includes(r.text.toLowerCase()));
  return r ? r.category : '';
}
function applyRulesTo(list, onlyUncategorized) {
  let n = 0;
  list.forEach(t => {
    if (onlyUncategorized && t.category && t.category !== 'ללא קטגוריה') return;
    const c = ruleCat(t.note, t.type);
    if (c && c !== t.category) { t.category = c; ensureCat(t.type, c); n++; }
  });
  return n;
}

function bindRules() {
  const f = $('#ruleForm'); if (!f) return;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const text = f.elements.text.value.trim(), category = f.elements.category.value.trim(), type = f.elements.type.value;
    if (!text || !category) return;
    S.rules = S.rules || [];
    if (S.rules.some(r => r.text === text && r.type === type)) return toast('כבר קיים כלל עם הטקסט הזה');
    S.rules.push({ id: uid(), text, type, category });
    ensureCat(type === 'income' ? 'income' : 'expense', category);
    save(); render(); toast('הכלל נוסף');
  });
}

/* ---------- 2. גיבוי אוטומטי ---------- */
// שמירת "ידית" לתיקיית הגיבוי ב־IndexedDB (רק בכרום ובאדג׳)
const IDB = {
  db: () => new Promise((res, rej) => { const r = indexedDB.open('kaspei-habayit', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  get: async k => { try { const db = await IDB.db(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
  set: async (k, v) => { try { const db = await IDB.db(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
};
const canPickFolder = () => 'showDirectoryPicker' in window;
const backupDays = () => ({ daily: 1, weekly: 7, monthly: 30 }[S.settings.backupFreq || 'weekly'] || 0);
function backupDue() {
  const d = backupDays(); if (!d || !S.transactions.length) return false;
  const last = S.settings.lastBackup; return !last || dayDiff(last, today()) >= d;
}
// כשהנעילה פעילה, גם קובץ הגיבוי מוצפן באותה סיסמה
async function backupText() { return CRYPT ? await encryptState(S) : JSON.stringify(S, null, 1); }
async function writeBackup(interactive) {
  const name = `גיבוי-כספי-הבית-${today()}${CRYPT ? '-מוצפן' : ''}.json`, text = await backupText();
  const dir = await IDB.get('backupDir');
  if (dir) {
    try {
      let perm = await dir.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted' && interactive) perm = await dir.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable();
        await w.write(text); await w.close();
        S.settings.lastBackup = today(); save();
        return `הגיבוי נשמר בתיקייה "${dir.name}"`;
      }
    } catch (e) { if (!interactive) return ''; }
  }
  if (!interactive) return '';
  download(name, text, 'application/json');
  S.settings.lastBackup = today(); save();
  return 'קובץ הגיבוי נשמר בתיקיית ההורדות';
}
// בפתיחת התוכנה: אם הגיע הזמן ויש הרשאה לתיקייה, הגיבוי נשמר בשקט
async function autoBackupOnStart() {
  if (!backupDue()) return;
  const msg = await writeBackup(false);
  if (msg) { toast('גיבוי אוטומטי: ' + msg); if (ui.tab === 'dash') render(); }
}

  if (!backupDue()) return '';

}
