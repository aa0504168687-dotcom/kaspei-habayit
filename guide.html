<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- עמוד המדריך: מדיה מגיעה רק מהאתר עצמו (self). בלי סקריפטים, בלי קבצים מבחוץ -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מדריך למשתמש – כספי הבית</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#15122e;--bar:#1e1b4b;--ink:#fff;--dim:#c7c9f5;--acc:#4f46e5;--line:rgba(255,255,255,.22)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:linear-gradient(135deg,#1e1b4b,#312e81)}
  header b{font-size:16px}
  .cnt{color:var(--dim);font-size:14px;margin-inline-end:auto}
  header a{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:7px 14px;font-weight:700}
  header .x{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:15px}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
  main img{max-width:100%;max-height:calc(100vh - 150px);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);background:#fff}
  nav{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);color:var(--dim);flex-wrap:wrap}
  nav a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:#fff;text-decoration:none;font-size:14px;font-weight:600}
  .dots{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-inline-start:auto}
  .dots a{width:26px;height:26px;padding:0;justify-content:center;color:#fff;text-decoration:none;font-size:12px;border-radius:8px}
  .dots a.on{background:var(--acc);border-color:var(--acc)}
  .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;display:none}
  @media (max-width:640px){header b{font-size:14px}main img{max-height:calc(100vh - 210px)}.dots a{width:22px;height:22px;font-size:11px}}
</style>
</head>
<body>
<header>
  <b>📘 מדריך למשתמש – כספי הבית</b>
  <span class="cnt">שקופית <span id="n">1</span> מתוך 15</span>
  <a href="מדריך-למשתמש-כספי-הבית.pdf" download>⬇️ הורדת PDF</a>
  <button type="button" class="x" id="x" title="סגירה" aria-label="סגירת המדריך">✕</button>
</header>
<main><img id="slide" src="assets/01.jpg" alt="שקופית 1 מתוך 15" width="1600" height="900"></main>
<nav>
  <a id="prev" href="?s=1">→ הקודם</a>
  <a id="next" href="?s=2">הבא ←</a>
  <span class="dots" id="dots"></span>
</nav>
<script>
(function () {
  var N = 15, q = new URLSearchParams(location.search);
  var i = parseInt(q.get('s'), 10); if (!(i >= 1 && i <= N)) i = 1;
  function pad(k) { return (k < 10 ? '0' : '') + k; }
  function href(k) { return '?s=' + k; }
  document.getElementById('slide').src = 'assets/' + pad(i) + '.jpg';
  document.getElementById('slide').alt = 'שקופית ' + i + ' מתוך ' + N;
  document.getElementById('n').textContent = i;
  document.title = 'מדריך למשתמש – כספי הבית (' + i + '/' + N + ')';
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  if (i > 1) { prev.href = href(i - 1); } else { prev.setAttribute('aria-disabled', 'true'); prev.style.opacity = '.4'; }
  if (i < N) { next.href = href(i + 1); } else { next.setAttribute('aria-disabled', 'true'); next.style.opacity = '.4'; }
  var dots = '';
  for (var k = 1; k <= N; k++) dots += '<a href="' + href(k) + '" class="' + (k === i ? 'on' : '') + '" aria-label="שקופית ' + k + '">' + k + '</a>';
  document.getElementById('dots').innerHTML = dots;
  document.getElementById('x').onclick = function () {
    if (history.length > 1 && document.referrer) history.back();
    else if (window.opener && !window.opener.closed) { window.close(); }
    else window.close();
    setTimeout(function () { if (!window.closed) location.href = 'index.html'; }, 300);
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'PageDown') { if (i < N) location.href = href(i + 1); }
    else if (e.key === 'ArrowRight' || e.key === 'PageUp') { if (i > 1) location.href = href(i - 1); }
    else if (e.key === 'Escape') document.getElementById('x').click();
  });
})();
</script>
</body>
</html>
